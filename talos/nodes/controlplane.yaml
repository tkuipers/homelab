# This is a placeholder for your controlplane node configuration.
# You can generate the actual configuration using a command like:
# talosctl gen config <cluster-name> https://<controlplane-ip>:6443 

clusterName: home-infra
clusterEndpoint: "https://192.168.1.15:6443"
machine:
  type: controlplane
  network:
    interfaces:
      - deviceSelector: { "driver": "e1000" } # You might need to change this based on your NIC driver
        dhcp: true
  # See https://www.talos.dev/v1.7/talos-guides/configuration/patching/
  # for more patching examples.
  patches:
    # Set NTP servers for time synchronization.
    - op: replace
      path: /machine/time/servers
      value:
        - time.cloudflare.com
        - pool.ntp.org

# This is the CNI config. Talos comes with flannel by default.
# You can uncomment this section and modify it to use a different CNI like Cilium.
# cni:
#   config:
#     # Flannel is the default CNI in Talos.
#     name: flannel
#     urls:
#       - https://raw.githubusercontent.com/flannel-io/flannel/v0.25.1/Documentation/kube-flannel.yml
# This is a minimal required configuration for the controlplane.
# You will generate a more complete one with `talosctl gen config`.
# The generated file will include secrets and certificates. 