# This is a placeholder for your GPU worker node configuration.
# This will be generated along with the controlplane configuration. 

clusterName: home-infra
clusterEndpoint: "https://192.168.1.15:6443" # This should point to your controlplane VIP
machine:
  type: worker
  # This section enables the NVIDIA GPU drivers.
  # Talos will download and install the specified driver version for you.
  # You should check the Talos documentation for the NVIDIA driver version
  # compatible with your Talos version and your GPU (NVIDIA 1060).
  features:
    nvidiaGpu:
      enabled: true
      # You can specify a driver version. If omitted, Talos uses its default.
      # driverVersion: "535.129.03"
  network:
    interfaces:
      - deviceSelector: { "driver": "e1000" } # You might need to change this based on your NIC driver
        dhcp: true
  # You can also apply patches to worker nodes.
  patches:
    - op: replace
      path: /machine/time/servers
      value:
        - time.cloudflare.com
        - pool.ntp.org
# This is a minimal required configuration for a worker node.
# The `talosctl gen config` command will also produce a base worker.yaml for you. 