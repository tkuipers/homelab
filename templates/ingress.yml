apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: external-service-expose
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP" #important
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  ingressClassName: public
  tls:
    - hosts:
      - tkuipers.ca
      secretName: tkuipers-ca-tls
    - hosts:
      - sonar.mushu.tkuipers.ca
      secretName: sonar-mushu-tkuipers-ca-tls
    - hosts:
      - radar.mushu.tkuipers.ca
      secretName: radar-mushu-tkuipers-ca-tls
  rules:
  - host: tkuipers.ca
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: webserver-svc
              port:
                number: 80
  - host: sonar.mushu.tkuipers.ca
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sonar-svc
            port:
              number: 80
