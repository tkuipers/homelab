apiVersion: apps/v1
kind: Deployment
metadata:
  name: webserver-depl
spec:
  selector:
    matchLabels:
      app: webserver-app
  template:
    metadata:
      labels:
        app: webserver-app
    spec:
      containers:
        - name: webserver-app
          image: docker.tkuipers.ca/tkuipers-ca:latest
          imagePullPolicy: Always
      imagePullSecrets:
        - name: regcred
---
apiVersion: v1
kind: Service
metadata:
  name: webserver-svc
spec:
  selector:
    app: webserver-app
  ports:
  - name: webserver-app
    protocol: TCP
    port: 80
    targetPort: 80


---
apiVersion: v1
kind: Endpoints
metadata:
  name: proxmox-svc
subsets:
  - addresses:
      - ip: 192.168.1.100
    ports:
      - port: 8006
---
apiVersion: v1
kind: Service
metadata:
  name: proxmox-svc
spec:
  ports:
    - port: 80
      targetPort: 8006
---
apiVersion: v1
kind: Endpoints
metadata:
  name: stocker-svc
subsets:
  - addresses:
      - ip: 192.168.1.200
    ports:
      - port: 8000
