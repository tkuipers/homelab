---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ariel-depl
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ariel-app
  template:
    metadata:
      labels:
        app: ariel-app
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: ariel-app
        image: sonatype/nexus3
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        volumeMounts:
        - name: registry-vol
          mountPath: /nexus-data
      imagePullSecrets:
      - name: regcred
      volumes:
      - name: registry-vol
        persistentVolumeClaim:
          claimName: sonatype-registry-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonatype-registry-data
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 80Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ariel-svc
spec:
  selector:
    app: ariel-app
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8081
  - name: docker
    protocol: TCP
    port: 5000
    targetPort: 5000
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi
provisioner: nfs.csi.k8s.io
parameters:
  server: 192.168.1.214
  share: /srv/nfs
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - hard
  - nfsvers=4.1
