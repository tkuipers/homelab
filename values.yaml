cert-manager: #defined by either the name or alias of your dependency in Chart.yaml
  namespace: cert-manager







# ---
# apiVersion: v1
# kind: Service
# metadata:
#   name: sonar-external-service
#   namespace: default
# spec:
#   type: ExternalName
#   externalName: 192.168.1.152 # eg example.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonar
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP" #important
    # cert-manager.io/issuer: letsencrypt-staging
    # service.beta.kubernetes.io/do-ingress-hostname: "sonar3.mushu.tkuipers.ca"
spec:
  rules:
  - host: sonar3.mushu.tkuipers.ca # eg external-service.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sonar-external-service
            port:
              number: 8989





