# sidero/serverclass-controlplane.yaml
# This file defines a "class" of servers.
# We are creating a class for our controlplane nodes.
---
apiVersion: metal.sidero.dev/v1alpha2
kind: ServerClass
metadata:
  name: home-infra-controlplane
spec:
  # Reference the default environment created by Sidero.
  environmentRef:
    name: default
    namespace: sidero-system
  # the server's hardware details. If a server matches all qualifiers,
  # it will be claimed by this ServerClass.
  qualifiers:
    hardware:
      - system:
          serialNumber: "18C6XV1"
  # After Talos is installed, instruct iPXE to exit so the server
  # can boot from the local disk on the next reboot. This breaks the boot loop.
  bootFromDiskMethod: ipxe-sanboot

  # These patches are applied to the Talos machine configuration when a server
  # from this class is provisioned.
  configPatches:
    - op: replace
      path: /machine/type
      value: controlplane
    - op: replace
      path: /machine/install/disk
      value: /dev/sdb
    - op: replace
      path: /machine/install/image
      value: ghcr.io/siderolabs/installer:v1.10.4
    - op: add
      path: /machine/network/hostname
      value: dell-r620
    # AdGuard (10.0.0.71) runs on this node and DHCP hands it out as BOTH
    # primary and secondary DNS, which deadlocks a cold boot: kubelet needs DNS
    # to pull the AdGuard image, and AdGuard is what serves DNS. 8.8.8.8 is the
    # fallback that breaks the loop. AdGuard stays first so split-horizon
    # rewrites keep resolving. Mirrors serverclass-worker.yaml.
    - op: add
      path: /machine/network/nameservers
      value:
        - 10.0.0.71
        - 8.8.8.8
    - op: add
      path: /cluster/allowSchedulingOnControlPlanes
      value: true
    # Datadog control plane monitoring - expose metrics on all interfaces
    - op: add
      path: /cluster/controllerManager/extraArgs
      value:
        bind-address: "0.0.0.0"
    - op: add
      path: /cluster/scheduler/extraArgs
      value:
        bind-address: "0.0.0.0"
    - op: replace
      path: /cluster/network/cni
      value:
        name: flannel
    - op: replace
      path: /cluster/proxy
      value:
        disabled: false
    - op: add
      path: /machine/certSANs
      value:
        - 10.0.0.50
    # OpenEBS Configuration for Control Plane (2.4TB available)
    - op: add
      path: /machine/nodeLabels
      value:
        openebs.io/engine: local
    - op: add
      path: /machine/kubelet/extraMounts
      value:
        - destination: /var/local
          type: bind
          source: /var/local
          options:
            - rbind
            - rshared
            - rw
    - op: add
      path: /cluster/apiServer/admissionControl/-
      value:
        name: PodSecurity
        configuration:
          apiVersion: pod-security.admission.config.k8s.io/v1beta1
          kind: PodSecurityConfiguration
          exemptions:
            namespaces:
            - openebs
            - metallb-system
    # # Local Path Provisioner User Volume Configuration
    # - op: add
    #   path: /machine/userVolumes
    #   value: []
    # - op: add
    #   path: /machine/userVolumes/-
    #   value:
    #     name: local-path-provisioner
    #     provisioning:
    #       diskSelector:
    #         match: "disk.transport == 'megaraid_sas'"
    #       minSize: 100GB
