# sidero/serverclass-controlplane.yaml
# This file defines a "class" of servers.
# We are creating a class for our controlplane nodes.
---
apiVersion: metal.sidero.dev/v1alpha2
kind: ServerClass
metadata:
  name: home-infra-controlplane
spec:
  # Reference the default environment created by Sidero.
  environmentRef:
    name: default
    namespace: sidero-system
  # the server's hardware details. If a server matches all qualifiers,
  # it will be claimed by this ServerClass.
  qualifiers:
    hardware:
      - system:
          serialNumber: "18C6XV1"
  # After Talos is installed, instruct iPXE to exit so the server
  # can boot from the local disk on the next reboot. This breaks the boot loop.
  bootFromDiskMethod: ipxe-sanboot

  # These patches are applied to the Talos machine configuration when a server
  # from this class is provisioned.
  configPatches:
    - op: replace
      path: /machine/type
      value: controlplane
    - op: replace
      path: /machine/install/disk
      value: /dev/sdb
    - op: replace
      path: /machine/install/image
      value: ghcr.io/siderolabs/installer:v1.10.4
    - op: add
      path: /machine/network/hostname
      value: dell-r620
    - op: add
      path: /cluster/allowSchedulingOnControlPlanes
      value: true
    - op: replace
      path: /cluster/network/cni
      value:
        name: flannel
    - op: replace
      path: /cluster/proxy
      value:
        disabled: false
    - op: replace
      path: /cluster/extraManifests
      value:
        - https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
    - op: add
      path: /machine/certSANs
      value:
        - 172.16.0.50
    - op: add
      path: /cluster/apiServer/admissionControl/-
      value:
        name: PodSecurity
        configuration:
          apiVersion: pod-security.admission.config.k8s.io/v1beta1
          kind: PodSecurityConfiguration
          exemptions:
            namespaces:
            - openebs
            - metallb-system