# Local StorageClasses for 2-node cluster
# Using local storage engines for performance + NFS for shared access
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-single-node
  namespace: openebs
provisioner: local.csi.openebs.io
parameters:
  storage: "lvm"
  vgpattern: "vg-openebs-*"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
apiVersion: storage.k8s.io/v1  
kind: StorageClass
metadata:
  name: openebs-hostpath-local
  namespace: openebs
provisioner: openebs.io/local
parameters:
  storageType: "hostpath"
  basePath: "/var/openebs/local"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
# NFS Storage Classes for shared access across nodes
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-nfs
  namespace: openebs
provisioner: openebs.io/nfsrwx
parameters:
  backendStorageClass: "openebs-hostpath-local"  # Use local storage as backend
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-nfs-lvm
  namespace: openebs  
provisioner: openebs.io/nfsrwx
parameters:
  backendStorageClass: "openebs-single-node"  # Use LVM as backend for better performance
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true 