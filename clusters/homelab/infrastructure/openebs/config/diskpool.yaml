# Local storage configuration for OpenEBS
# Since we're using a 2-node cluster, we use local storage instead of replicated Mayastor
---
apiVersion: v1
kind: StorageClass
metadata:
  name: openebs-lvm-localpv
  namespace: openebs
provisioner: local.csi.openebs.io
parameters:
  storage: "lvm"
  vgpattern: "vg-openebs-*"  # Volume group pattern for LVM
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
apiVersion: v1
kind: StorageClass
metadata:
  name: openebs-hostpath
  namespace: openebs
provisioner: openebs.io/local
parameters:
  storageType: "hostpath"
  basePath: "/var/openebs/local"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete 