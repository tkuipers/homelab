---
# Test PVC to verify OpenEBS dual-replica storage is working
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openebs-test-pvc
  namespace: openebs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-single-node  # Use local LVM storage
  resources:
    requests:
      storage: 1Gi 