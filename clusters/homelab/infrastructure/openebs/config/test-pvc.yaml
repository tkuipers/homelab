---
# Test PVC to verify OpenEBS dual-replica storage is working
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openebs-test-pvc
  namespace: openebs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-single-node  # Use local LVM storage
  resources:
    requests:
      storage: 1Gi
---
# Local storage test PVC (node-bound, high performance)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openebs-test-local-pvc
  namespace: openebs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-single-node  # Use local LVM storage
  resources:
    requests:
      storage: 1Gi
---
# NFS shared storage test PVC (can run on any node)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openebs-test-nfs-pvc
  namespace: openebs
spec:
  accessModes:
    - ReadWriteMany  # Multiple pods can access
  storageClassName: openebs-nfs
  resources:
    requests:
      storage: 1Gi
---
# High-performance NFS test PVC (NFS backed by LVM)
apiVersion: v1  
kind: PersistentVolumeClaim
metadata:
  name: openebs-test-nfs-lvm-pvc
  namespace: openebs
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: openebs-nfs-lvm
  resources:
    requests:
      storage: 1Gi 