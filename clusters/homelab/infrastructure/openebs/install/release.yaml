apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: openebs
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
      version: "4.3.x"
  targetNamespace: openebs
  install:
    createNamespace: false  # We create it explicitly with labels
    timeout: 10m
  upgrade:
    timeout: 10m
    remediation:
      remediateLastFailure: true
  releaseName: openebs
  values:
    # Disable Mayastor (replicated storage) for 2-node cluster
    mayastor:
      enabled: false
    # Enable local storage engines that work well on 2-node clusters
    engines:
      local:
        lvm:
          enabled: true  # LVM-based local storage
        zfs:
          enabled: false
        hostpath:
          enabled: true  # Hostpath local storage
      # Disable replicated storage engines
      replicated:
        mayastor:
          enabled: false
    # Enable Dynamic NFS provisioner for ReadWriteMany volumes
    # The NFS provisioner will use local storage (hostpath/LVM) as backends
    nfs-provisioner:
      enabled: true
    # Enable localpv-provisioner for dynamic hostpath and device volumes
    localpv-provisioner:
      enabled: true
    # Node Disk Manager for discovering local storage
    ndm:
      enabled: true
    # Helper components
    helper:
      enabled: true 