# NFS Server for Control Plane Node (dell-r620) - 2.2Ti storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server-controlplane
  namespace: nfs-servers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server-controlplane
  template:
    metadata:
      labels:
        app: nfs-server-controlplane
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      hostNetwork: true
      hostPID: true
      volumes:
        - name: nfs-storage
          hostPath:
            path: /var/local/nfs-controlplane
            type: DirectoryOrCreate
        - name: proc-fs-nfsd
          hostPath:
            path: /proc/fs/nfsd
            type: DirectoryOrCreate
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
      containers:
        - name: nfs-server
          image: itsthenetwork/nfs-server-alpine:latest
          env:
            - name: SHARED_DIRECTORY
              value: /nfsshare
          ports:
            - name: nfs
              containerPort: 2049
            - name: mountd
              containerPort: 20048
            - name: rpcbind
              containerPort: 111
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_MODULE
                - DAC_OVERRIDE
          volumeMounts:
            - mountPath: /nfsshare
              name: nfs-storage
            - mountPath: /proc/fs/nfsd
              name: proc-fs-nfsd
            - mountPath: /lib/modules
              name: lib-modules
              readOnly: true
            - mountPath: /host-proc
              name: proc
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server-controlplane
  namespace: nfs-servers
spec:
  type: ClusterIP
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
    - name: mountd
      port: 20048
      targetPort: 20048
    - name: rpcbind
      port: 111
      targetPort: 111
  selector:
    app: nfs-server-controlplane
---
