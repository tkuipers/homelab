# NFS Server for Control Plane Node (dell-r620) - 2.2Ti storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server-controlplane
  namespace: nfs-servers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server-controlplane
  template:
    metadata:
      labels:
        app: nfs-server-controlplane
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      volumes:
        - name: nfs-storage
          hostPath:
            path: /var/local/nfs-controlplane
            type: DirectoryOrCreate
      containers:
        - name: nfs-server
          image: erichough/nfs-server:2.2.1
          env:
            - name: NFS_EXPORT_0
              value: "/nfsshare *(rw,sync,no_subtree_check,no_auth_nlm,insecure,no_root_squash)"
          ports:
            - name: nfs
              containerPort: 2049
            - name: mountd
              containerPort: 20048
            - name: rpcbind
              containerPort: 111
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
                - DAC_OVERRIDE
          volumeMounts:
            - mountPath: /nfsshare
              name: nfs-storage
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server-controlplane
  namespace: nfs-servers
spec:
  type: ClusterIP
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
    - name: mountd
      port: 20048
      targetPort: 20048
    - name: rpcbind
      port: 111
      targetPort: 111
  selector:
    app: nfs-server-controlplane
---
