---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: nfs-csi
spec:
  interval: 5m
  chart:
    spec:
      chart: csi-driver-nfs
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
      version: "v4.6.0"
  install:
    createNamespace: false
    timeout: 10m
  upgrade:
    timeout: 10m
  releaseName: csi-driver-nfs
  values:
    driver:
      name: nfs.csi.k8s.io
    controller:
      replicas: 1  # Single replica for 2-node cluster
    node:
      logLevel: 2
    kubeletDir: /var/lib/kubelet 