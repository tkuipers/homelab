apiVersion: v1
kind: Namespace
metadata:
  name: nfs-provisioner
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server-dell-r620
  namespace: nfs-provisioner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server-dell-r620
  template:
    metadata:
      labels:
        app: nfs-server-dell-r620
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: samba-server
        image: ghcr.io/servercontainers/samba:latest
        env:
        - name: ACCOUNT_smbuser
          valueFrom:
            secretKeyRef:
              name: samba-credentials
              key: password
        - name: UID_smbuser
          value: "1000"
        - name: SAMBA_VOLUME_CONFIG_shared
          value: "[shared]; path=/data; valid users = smbuser; guest ok = no; read only = no; browseable = yes"
        ports:
        - containerPort: 445
          name: smb
        securityContext:
          capabilities:
            add: ["DAC_READ_SEARCH"]
        volumeMounts:
        - name: export
          mountPath: /data
        - name: samba-config
          mountPath: /external
      volumes:
      - name: export
        hostPath:
          path: /var/persist/nfs-dell-r620
          type: DirectoryOrCreate
      - name: samba-config
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server-dell-r620
  namespace: nfs-provisioner
spec:
  selector:
    app: nfs-server-dell-r620
  ports:
  - name: smb
    port: 445
    protocol: TCP
