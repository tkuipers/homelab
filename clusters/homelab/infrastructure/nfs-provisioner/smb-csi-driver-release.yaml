apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: csi-driver-smb
  namespace: nfs-provisioner
spec:
  interval: 5m
  chart:
    spec:
      chart: csi-driver-smb
      sourceRef:
        kind: HelmRepository
        name: csi-driver-smb
        namespace: flux-system
      version: "v1.16.0"
  values:
    controller:
      replicas: 1
    node:
      livenessProbe:
        healthPort: 29643

