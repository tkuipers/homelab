apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server-omen-worker1
  namespace: nfs-provisioner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server-omen-worker1
  template:
    metadata:
      labels:
        app: nfs-server-omen-worker1
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      containers:
      - name: nfs-server
        image: erichough/nfs-server:latest
        env:
        - name: NFS_EXPORT_0
          value: "/export *(rw,no_subtree_check,no_root_squash,fsid=0)"
        securityContext:
          privileged: true
          capabilities:
            add: ["SYS_ADMIN", "SETPCAP"]
        volumeMounts:
        - name: export
          mountPath: /export
      volumes:
      - name: export
        hostPath:
          path: /var/persist/nfs-omen-worker1
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server-omen-worker1
  namespace: nfs-provisioner
spec:
  selector:
    app: nfs-server-omen-worker1
  ports:
  - name: nfs
    port: 2049
    protocol: TCP
