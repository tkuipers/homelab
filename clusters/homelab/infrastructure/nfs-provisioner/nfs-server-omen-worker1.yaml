apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server-omen-worker1
  namespace: nfs-provisioner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server-omen-worker1
  template:
    metadata:
      labels:
        app: nfs-server-omen-worker1
    spec:
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      containers:
      - name: nfs-server
        image: gcr.io/k8s-staging-nfs-ganesha/nfs-server
        ports:
        - name: nfs
          containerPort: 2049
        - name: nfs-udp
          containerPort: 2049
          protocol: UDP
        - name: rpcbind
          containerPort: 111
        - name: rpcbind-udp
          containerPort: 111
          protocol: UDP
        - name: mountd
          containerPort: 20048
        - name: mountd-udp
          containerPort: 20048
          protocol: UDP
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            add: ["SYS_ADMIN", "DAC_READ_SEARCH"]
        args:
        - "-fsid=0"
        - "-grace-time=90"
        - "- Lease-time=90"
        - "-export-addr=0.0.0.0"
        - "/exports"
        volumeMounts:
        - name: export
          mountPath: /exports
      volumes:
      - name: export
        hostPath:
          path: /var/persist/nfs-omen-worker1
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server-omen-worker1
  namespace: nfs-provisioner
spec:
  selector:
    app: nfs-server-omen-worker1
  ports:
  - name: nfs
    port: 2049
    protocol: TCP
