apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server-omen-worker1
  namespace: nfs-provisioner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server-omen-worker1
  template:
    metadata:
      labels:
        app: nfs-server-omen-worker1
    spec:
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      containers:
      - name: nfs-server
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          apk add --no-cache nfs-utils
          echo "/exports *(rw,sync,no_subtree_check,no_root_squash)" > /etc/exports
          /sbin/rpcbind -w -f &
          /sbin/nfsd --debug 8 --no-udp --no-nfs-v2 --no-nfs-v3 -G 600 -t 1
        securityContext:
          privileged: true
        volumeMounts:
        - name: export
          mountPath: /exports
      volumes:
      - name: export
        hostPath:
          path: /var/persist/nfs-omen-worker1
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server-omen-worker1
  namespace: nfs-provisioner
spec:
  selector:
    app: nfs-server-omen-worker1
  ports:
  - name: nfs
    port: 2049
    protocol: TCP
