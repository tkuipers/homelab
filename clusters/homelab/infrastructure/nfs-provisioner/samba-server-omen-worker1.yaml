apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba-server-omen-worker1
  namespace: nfs-provisioner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: samba-server-omen-worker1
  template:
    metadata:
      labels:
        app: samba-server-omen-worker1
    spec:
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: samba-server
        image: ghcr.io/servercontainers/samba:latest
        env:
        - name: ACCOUNT_smbuser
          valueFrom:
            secretKeyRef:
              name: samba-credentials
              key: password
        - name: UID_smbuser
          value: "1000"
        - name: SAMBA_VOLUME_CONFIG_shared
          value: "[shared]; path=/data; valid users = smbuser; guest ok = no; read only = no; browseable = yes"
        ports:
        - containerPort: 445
          name: smb
        securityContext:
          capabilities:
            add: ["DAC_READ_SEARCH", "NET_BIND_SERVICE", "NET_BROADCAST"]
        volumeMounts:
        - name: export
          mountPath: /data
        - name: samba-config
          mountPath: /external/avahi
      volumes:
      - name: export
        hostPath:
          path: /var/persist/nfs-omen-worker1
          type: DirectoryOrCreate
      - name: samba-config
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: samba-server-omen-worker1
  namespace: nfs-provisioner
spec:
  selector:
    app: samba-server-omen-worker1
  ports:
  - name: smb
    port: 445
    protocol: TCP
