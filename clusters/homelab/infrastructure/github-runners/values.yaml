# Self-hosted GitHub Actions runners. Workflows use them with `runs-on: homelab`.
# Each job gets a fresh pod (ephemeral runner) with its own Docker daemon (dind),
# so `services:`, `docker build` and buildx work as on GitHub's ubuntu-latest.
#
# Docker-in-Docker needs privileged pods: a job is effectively root on dell-r620.
# Only attach repositories whose workflows you trust (private repos; GitHub advises
# against self-hosted runners on public repos because fork PRs can run code on them).

gha-runner-scale-set-controller:
  fullnameOverride: arc-controller
  serviceAccount:
    create: true
    name: arc-controller
  flags:
    # chart default is debug (a line per reconcile)
    logLevel: info
    logFormat: json
  # Controller metrics (gha_controller_*) on the controller pod, and the listener metrics
  # (gha_*: assigned/running jobs, job durations) on each scale set's listener pod.
  # Scraped by the PodMonitors in templates/podmonitors.yaml.
  metrics:
    controllerManagerAddr: ":8080"
    listenerAddr: ":8080"
    listenerEndpoint: "/metrics"
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

# Shared by every scale set below (YAML anchor): the pod each job runs in.
# Written out instead of `containerMode: dind` because that mode hardcodes an unpinned
# docker:dind with no /var/lib/docker volume (overlay-on-overlay -> slow vfs driver)
# and no resources. Same shape as the chart's dind expansion otherwise.
runnerTemplate: &runner-template
  spec:
    # omen-worker1 is the small GPU node (training jobs); keep builds off it
    nodeSelector:
      kubernetes.io/hostname: dell-r620
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:2.338.1
        command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      # native sidecar: starts before the runner, stops after it
      - name: dind
        image: docker:29.9.2-dind
        restartPolicy: Always
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
        env:
          # the runner image's docker group
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        startupProbe:
          exec:
            command: ["docker", "info"]
          initialDelaySeconds: 0
          failureThreshold: 24
          periodSeconds: 5
        # builds (BuildKit runs in here). Requests are what the scheduler reserves; dell-r620
        # has ~46 idle cores and ~165Gi free, so the limits are generous. The memory limit
        # covers the RAM-backed dind-storage (30Gi) plus ~6Gi for dockerd and builds.
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "8"
            memory: 36Gi
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: dind-storage
            mountPath: /var/lib/docker
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.1
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
        # the job's own steps: tests, browsers (Playwright), npm
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "6"
            memory: 12Gi
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: npm-cache
            mountPath: /home/runner/.npm
          - name: dind-sock
            mountPath: /var/run
          - name: dshm
            mountPath: /dev/shm
    volumes:
      # The workspace (checkout, node_modules, builds, tool cache) and the npm cache that
      # setup-node restores: ~1.5GB of small-file writes per job, which still stalled etcd on
      # dell-r620's spinning RAID after Docker's storage moved to RAM. tmpfs, counted toward the
      # runner container's memory limit (its peak was ~4.4Gi of 12Gi with these on disk); a job that
      # fills them gets ENOSPC, or OOM if its own processes also need most of the 12Gi.
      - name: work
        emptyDir:
          medium: Memory
          sizeLimit: 6Gi
      - name: npm-cache
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      # Docker images, layers and BuildKit cache of this job (gone with the pod). In RAM:
      # dell-r620's only disk is one spinning RAID volume shared with etcd, and ~6GB of layer
      # writes per job stalled etcd and the apiserver for seconds at a time. tmpfs, so a job
      # that fills it gets ENOSPC; counts toward the dind container's memory limit.
      - name: dind-storage
        emptyDir:
          medium: Memory
          sizeLimit: 30Gi
      # Chromium needs more than the container default of 64M (Playwright recommends --ipc=host in Docker);
      # memory-backed, counts toward the runner container's memory limit
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi

homelab-agent:
  githubConfigUrl: https://github.com/tkuipers/homelab-agent
  # GitHub App credentials (templates/external-secret.yaml)
  githubConfigSecret: github-app
  # Kubernetes name of the scale set (unique per namespace); also a runs-on label
  runnerScaleSetName: homelab-agent
  # the label every repo's workflows use, whichever scale set serves them
  scaleSetLabels: [homelab]
  # one warm runner: jobs start without waiting for a pod (homelab-agent deploys often)
  minRunners: 1
  # 4 x (36Gi dind + 12Gi runner) at the limits still fits dell-r620's 202GB
  maxRunners: 4
  namespaceOverride: arc-runners
  # Argo CD renders without cluster access, so the chart's controller lookup can't run
  controllerServiceAccount:
    namespace: arc-systems
    name: arc-controller
  template: *runner-template
