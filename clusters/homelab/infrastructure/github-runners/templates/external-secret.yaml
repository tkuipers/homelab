# The GitHub App the controller and listeners authenticate as (registers runners,
# polls for jobs). 1Password item "GitHub Actions Runner App", created by
# tooling/scripts/setup-credentials/setup-github-runner-credentials.sh. The PEM key
# is stored base64 encoded (one line) and decoded here.
# Every scale set references this secret (githubConfigSecret: github-app).
# The backtick wrappers below keep Helm from rendering ESO's own template expressions.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: github-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        github_app_id: "{{`{{ .app_id }}`}}"
        github_app_installation_id: "{{`{{ .installation_id }}`}}"
        github_app_private_key: "{{`{{ .private_key_base64 | b64dec }}`}}"
  data:
    - secretKey: app_id
      remoteRef:
        key: "GitHub Actions Runner App"
        property: app-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: installation_id
      remoteRef:
        key: "GitHub Actions Runner App"
        property: installation-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: private_key_base64
      remoteRef:
        key: "GitHub Actions Runner App"
        property: private-key-base64
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
