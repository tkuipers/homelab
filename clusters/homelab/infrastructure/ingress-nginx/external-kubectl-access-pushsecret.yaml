# Pushes the external-kubectl-access token into 1Password (Homelab vault)
# so it can be retrieved on remote machines without copy/paste from a terminal
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: external-kubectl-access-token
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword-store
      kind: ClusterSecretStore
  deletionPolicy: None
  selector:
    secret:
      name: external-kubectl-access-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: "Homelab Kubectl Token"
          property: "token"
