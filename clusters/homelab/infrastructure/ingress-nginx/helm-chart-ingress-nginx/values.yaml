# ingress-nginx controller configuration
ingress-nginx:
  controller:
    # LoadBalancer service with static IP from MetalLB
    service:
      type: LoadBalancer
      loadBalancerIP: 10.0.0.70
      externalTrafficPolicy: Local

    # Ingress class configuration
    ingressClassResource:
      name: nginx
      enabled: true
      default: true

    # Admission webhooks
    admissionWebhooks:
      enabled: true
      patch:
        enabled: true
      certManager:
        enabled: false
      annotations:
        nginx.ingress.kubernetes.io/enable-annotation-validation: "false"
      failurePolicy: Ignore

    # Controller config
    config:
      strict-validate-path-type: "false"
      use-forwarded-headers: "true"
      compute-full-forwarded-for: "true"
      # Default is one worker per core (48 on dell-r620). Peak traffic is <10 req/s,
      # and every worker re-resolves ExternalName backends (resume S3) in Lua each
      # time the 1-5s TTL expires; 48 workers made ~20 DNS queries/s and logged each
      # lost UDP packet as "lua udp socket read timed out".
      worker-processes: "4"

      # JSON access logs -> Alloy turns every key into a Loki field
      # ("msg" becomes the log line). See observability/helm-chart-alloy.
      log-format-escape-json: "true"
      log-format-upstream: '{"time":"$time_iso8601","msg":"$request_method $host$uri $status","method":"$request_method","host":"$host","path":"$uri","query":"$args","protocol":"$server_protocol","status":$status,"bytes_sent":$bytes_sent,"request_length":$request_length,"request_time":$request_time,"remote_addr":"$remote_addr","x_forwarded_for":"$proxy_add_x_forwarded_for","remote_user":"$remote_user","referer":"$http_referer","user_agent":"$http_user_agent","request_id":"$req_id","trace_id":"$opentelemetry_trace_id","upstream":"$proxy_upstream_name","upstream_addr":"$upstream_addr","upstream_status":"$upstream_status","upstream_response_time":"$upstream_response_time","upstream_response_length":"$upstream_response_length","ingress":"$ingress_name","ingress_namespace":"$namespace","ingress_service":"$service_name"}'

      # One trace span per request through the ingress -> Alloy -> Tempo
      enable-opentelemetry: "true"
      otlp-collector-host: alloy.observability.svc.cluster.local
      otlp-collector-port: "4317"
      otel-service-name: ingress-nginx
      otel-sampler: AlwaysOn
      opentelemetry-trust-incoming-span: "true"
      opentelemetry-operation-name: "HTTP $request_method $service_name $uri"

    # Prometheus metrics (per-ingress request counts, status codes, latency)
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 90Mi

  # RBAC
  rbac:
    create: true
    scope: false

  # TCP services passthrough
  tcp:
    # TimeMachine SMB
    "445": "timemachine/timemachine:445"
    # Minecraft (if needed)
    "25565": "pterodactyl/pterodactyl-pterodactyl-wings-gameservers:25565"

