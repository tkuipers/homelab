---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
spec:
  groups:
  - name: node-resources
    interval: 30s
    rules:
    - alert: NodeHighCPUUsage
      expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ $labels.instance }} high CPU usage"
        description: "CPU usage is above 85% (current value: {{ $value }}%)"
    
    - alert: NodeHighMemoryUsage
      expr: 100 * (1 - ((node_memory_MemAvailable_bytes) / (node_memory_MemTotal_bytes))) > 85
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ $labels.instance }} high memory usage"
        description: "Memory usage is above 85% (current value: {{ $value }}%)"
    
    - alert: NodeDiskSpaceLow
      expr: 100 - ((node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} * 100) / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"}) > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ $labels.instance }} disk space low"
        description: "Disk usage is above 80% (current value: {{ $value }}%)"
    
    - alert: NodeDown
      expr: up{job="node-exporter"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Node {{ $labels.instance }} is down"
        description: "Node exporter has been down for more than 5 minutes"
  
  - name: gpu-monitoring
    interval: 30s
    rules:
    - alert: GPUHighTemperature
      expr: DCGM_FI_DEV_GPU_TEMP > 85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "GPU {{ $labels.gpu }} high temperature on {{ $labels.instance }}"
        description: "GPU temperature is above 85°C (current value: {{ $value }}°C)"
    
    - alert: GPUHighUtilization
      expr: DCGM_FI_DEV_GPU_UTIL > 95
      for: 15m
      labels:
        severity: info
      annotations:
        summary: "GPU {{ $labels.gpu }} high utilization on {{ $labels.instance }}"
        description: "GPU utilization has been above 95% for 15 minutes (current value: {{ $value }}%)"
    
    - alert: GPUMemoryHigh
      expr: (DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE)) * 100 > 90
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "GPU {{ $labels.gpu }} memory usage high on {{ $labels.instance }}"
        description: "GPU memory usage is above 90% (current value: {{ $value }}%)"
  
  - name: application-services
    interval: 30s
    rules:
    - alert: ServiceDown
      expr: up{namespace=~"mediacenter|ml|timemachine"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Service {{ $labels.job }} in {{ $labels.namespace }} is down"
        description: "Service has been down for more than 5 minutes"
    
    - alert: PodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total{namespace=~"mediacenter|ml|timemachine"}[15m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
        description: "Pod has restarted {{ $value }} times in the last 15 minutes"
    
    - alert: PodNotReady
      expr: kube_pod_status_phase{namespace=~"mediacenter|ml|timemachine",phase!~"Running|Succeeded"} == 1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready"
        description: "Pod has been in {{ $labels.phase }} state for more than 15 minutes"
    
    - alert: ContainerHighMemory
      expr: sum(container_memory_working_set_bytes{namespace=~"mediacenter|ml|timemachine",container!=""}) by (namespace, pod, container) > 2147483648
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} high memory"
        description: "Container is using more than 2GB of memory (current: {{ $value | humanize }}B)"
  
  - name: storage
    interval: 30s
    rules:
    - alert: PersistentVolumeFillingUp
      expr: (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) * 100 < 20
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "PersistentVolume {{ $labels.persistentvolumeclaim }} filling up"
        description: "PersistentVolume has less than 20% free space (current: {{ $value }}%)"

