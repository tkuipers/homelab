---
# Exportarr for Sonarr
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exportarr-sonarr
  namespace: mediacenter
  labels:
    app: exportarr-sonarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exportarr-sonarr
  template:
    metadata:
      labels:
        app: exportarr-sonarr
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9707"
    spec:
      containers:
      - name: exportarr
        image: ghcr.io/onedr0p/exportarr:v2.0.1
        args:
        - sonarr
        env:
        - name: PORT
          value: "9707"
        - name: URL
          value: "http://sonarr.mediacenter:8989"
        - name: APIKEY
          valueFrom:
            secretKeyRef:
              name: arr-api-keys
              key: sonarr-api-key
        ports:
        - name: metrics
          containerPort: 9707
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: exportarr-sonarr
  namespace: mediacenter
  labels:
    app: exportarr-sonarr
spec:
  selector:
    app: exportarr-sonarr
  ports:
  - name: metrics
    port: 9707
    targetPort: 9707
