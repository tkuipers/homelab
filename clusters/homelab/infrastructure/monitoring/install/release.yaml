apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=55.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Global settings
    global:
      rbac:
        create: true
    
    # Prometheus Operator
    prometheusOperator:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    
    # Prometheus
    prometheus:
      enabled: true
      prometheusSpec:
        retention: 7d
        retentionSize: "10GB"
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: smb-omen-worker1
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 15Gi
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        # Scrape all ServiceMonitors and PodMonitors
        serviceMonitorSelector: {}
        podMonitorSelector: {}
        ruleSelector: {}
    
    # Alertmanager
    alertmanager:
      enabled: true
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: smb-omen-worker1
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
    
    # Grafana
    grafana:
      enabled: true
      admin:
        existingSecret: monitoring-credentials-secret
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: false
      extraVolumes:
        - name: storage
          hostPath:
            path: /var/persist/grafana
            type: DirectoryOrCreate
      extraVolumeMounts:
        - name: storage
          mountPath: /var/lib/grafana
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    
    # Node Exporter
    nodeExporter:
      enabled: true
    
    # Kube State Metrics
    kubeStateMetrics:
      enabled: true
    
    # Default service monitors
    defaultRules:
      create: true
      rules:
        alertmanager: true
        etcd: true
        configReloaders: true
        general: true
        k8s: true
        kubeApiserverAvailability: true
        kubeApiserverSlos: true
        kubelet: true
        kubeProxy: true
        kubePrometheusGeneral: true
        kubePrometheusNodeRecording: true
        kubernetesApps: true
        kubernetesResources: true
        kubernetesStorage: true
        kubernetesSystem: true
        kubeScheduler: true
        kubeStateMetrics: true
        network: true
        node: true
        nodeExporterAlerting: true
        nodeExporterRecording: true
        prometheus: true
        prometheusOperator: true

