  - hosts:
    - alertmanager.tkuipers.ca
    secretName: alertmanager-tkuipers-ca-tls
  rules:
  - host: alertmanager.tkuipers.ca
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kube-prometheus-stack-alertmanager
            port:
              number: 9093

