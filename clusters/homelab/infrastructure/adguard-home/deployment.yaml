apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-home
  namespace: adguard-home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adguard-home
  template:
    metadata:
      labels:
        app: adguard-home
    spec:
      # The config and work dirs are hostPaths on dell-r620. Scheduled
      # anywhere else, AdGuard starts as a fresh install (setup wizard,
      # no DNS on :53).
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      # one-time cold copy of the v0.107 config before v1.0 (same config schema, per
      # the release notes); busybox is already cached on dell-r620
      initContainers:
        - name: config-copy-pre-v1
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - '[ -d /persist/adguard-home-config.bak-v0.107 ] || cp -a /persist/adguard-home-config /persist/adguard-home-config.bak-v0.107'
          volumeMounts:
            - name: persist
              mountPath: /persist
      containers:
        - name: adguard-home
          # Pinned + IfNotPresent on purpose: the nodes use this pod as their
          # upstream DNS (10.0.0.71), so a forced re-pull after an outage
          # deadlocks — no DNS means no image pull means no DNS.
          # A cached image lets AdGuard restart with no network dependency.
          # To upgrade: pre-pull the new tag on dell-r620 first (a Job with that
          # image), then bump it here.
          image: adguard/adguardhome:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: setup
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /opt/adguardhome/conf
            - name: work
              mountPath: /opt/adguardhome/work
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
      volumes:
        - name: config
          hostPath:
            path: /var/persist/adguard-home-config
            type: DirectoryOrCreate
        - name: work
          hostPath:
            path: /var/persist/adguard-home-work
            type: DirectoryOrCreate
        - name: persist
          hostPath:
            path: /var/persist
            type: Directory
