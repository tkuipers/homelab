apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: metallb
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      version: "0.15.2"
  targetNamespace: metallb-system
  install:
    createNamespace: true
  upgrade:
    remediation:
      remediateLastFailure: true
  releaseName: metallb 