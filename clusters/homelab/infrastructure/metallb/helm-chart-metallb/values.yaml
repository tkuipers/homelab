# MetalLB Configuration
# Minimal config - most setup happens via CRDs after install

metallb:
  # L2 only (no BGPPeers), so no BGP backend at all: chart 0.16 would otherwise
  # add the frr-k8s DaemonSet (its new default) for nothing.
  frrk8s:
    enabled: false

  # Controller configuration
  controller:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # Speaker configuration (L2 announcements)
  speaker:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    # Run on all nodes
    tolerations:
      - operator: Exists

