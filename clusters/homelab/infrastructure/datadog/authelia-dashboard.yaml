apiVersion: datadoghq.com/v1alpha1
kind: DatadogDashboard
metadata:
  name: authelia-dashboard
  namespace: datadog
spec:
  title: "🔐 Authelia SSO Dashboard"
  description: "Authentication and authorization monitoring"
  layoutType: ordered
  tags:
    - "team:infrastructure"
  widgets: |
    [
      {
        "definition": {
          "title": "📊 Service Health",
          "type": "group",
          "layout_type": "ordered",
          "widgets": [
            {
              "definition": {
                "title": "Authelia Pod Status",
                "type": "query_value",
                "requests": [
                  {
                    "q": "sum:kubernetes_state.pod.status_phase{kube_namespace:authelia,kube_deployment:authelia,pod_phase:running}",
                    "aggregator": "last",
                    "conditional_formats": [
                      {
                        "comparator": ">=",
                        "value": 1,
                        "palette": "white_on_green"
                      },
                      {
                        "comparator": "<",
                        "value": 1,
                        "palette": "white_on_red"
                      }
                    ]
                  }
                ],
                "precision": 0
              }
            },
            {
              "definition": {
                "title": "Redis Pod Status",
                "type": "query_value",
                "requests": [
                  {
                    "q": "sum:kubernetes_state.pod.status_phase{kube_namespace:authelia,kube_deployment:authelia-redis,pod_phase:running}",
                    "aggregator": "last",
                    "conditional_formats": [
                      {
                        "comparator": ">=",
                        "value": 1,
                        "palette": "white_on_green"
                      },
                      {
                        "comparator": "<",
                        "value": 1,
                        "palette": "white_on_red"
                      }
                    ]
                  }
                ],
                "precision": 0
              }
            },
            {
              "definition": {
                "title": "Active Goroutines",
                "type": "query_value",
                "requests": [
                  {
                    "q": "avg:authelia.go_goroutines{*}",
                    "aggregator": "last"
                  }
                ],
                "precision": 0
              }
            }
          ]
        }
      },
      {
        "definition": {
          "title": "🔑 Authentication Metrics",
          "type": "group",
          "layout_type": "ordered",
          "widgets": [
            {
              "definition": {
                "title": "Login Success Rate",
                "type": "sunburst",
                "requests": [
                  {
                    "response_format": "scalar",
                    "formulas": [
                      {
                        "formula": "query1"
                      }
                    ],
                    "queries": [
                      {
                        "data_source": "metrics",
                        "name": "query1",
                        "query": "max:authelia.authelia_authn_duration.count{*} by {success}",
                        "aggregator": "last"
                      }
                    ]
                  }
                ],
                "custom_links": [],
                "legend": {
                  "type": "inline"
                },
                "hide_total": false
              }
            },
            {
              "definition": {
                "title": "Login Attempts Over Time",
                "type": "timeseries",
                "requests": [
                  {
                    "q": "diff(sum:authelia.authelia_authn_duration.count{success:true})",
                    "display_type": "bars",
                    "style": {
                      "palette": "green",
                      "line_type": "solid",
                      "line_width": "normal"
                    },
                    "metadata": [
                      {
                        "expression": "diff(sum:authelia.authelia_authn_duration.count{success:true})",
                        "alias_name": "Success"
                      }
                    ]
                  },
                  {
                    "q": "diff(sum:authelia.authelia_authn_duration.count{success:false})",
                    "display_type": "bars",
                    "style": {
                      "palette": "warm",
                      "line_type": "solid",
                      "line_width": "normal"
                    },
                    "metadata": [
                      {
                        "expression": "diff(sum:authelia.authelia_authn_duration.count{success:false})",
                        "alias_name": "Failure"
                      }
                    ]
                  }
                ]
              }
            },
            {
              "definition": {
                "title": "Avg Auth Duration (seconds)",
                "type": "timeseries",
                "requests": [
                  {
                    "q": "avg:authelia.authelia_authn_duration.sum{*}/avg:authelia.authelia_authn_duration.count{*}",
                    "display_type": "line",
                    "style": {
                      "palette": "cool"
                    }
                  }
                ]
              }
            }
          ]
        }
      },
      {
        "definition": {
          "title": "📊 Request Metrics",
          "type": "group",
          "layout_type": "ordered",
          "widgets": [
            {
              "definition": {
                "title": "HTTP Requests by Status Code",
                "type": "timeseries",
                "requests": [
                  {
                    "q": "sum:authelia.authelia_request_duration.count{*} by {code}.as_count()",
                    "display_type": "bars",
                    "style": {
                      "palette": "semantic"
                    }
                  }
                ]
              }
            },
            {
              "definition": {
                "title": "Avg Request Duration (seconds)",
                "type": "timeseries",
                "requests": [
                  {
                    "q": "avg:authelia.authelia_request_duration.sum{*}/avg:authelia.authelia_request_duration.count{*}",
                    "display_type": "line",
                    "style": {
                      "palette": "cool"
                    }
                  }
                ],
                "markers": [
                  {
                    "value": "y = 0.2",
                    "display_type": "warning dashed"
                  }
                ]
              }
            }
          ]
        }
      },
      {
        "definition": {
          "title": "📈 Resource Usage",
          "type": "group",
          "layout_type": "ordered",
          "widgets": [
            {
              "definition": {
                "title": "CPU Usage",
                "type": "timeseries",
                "requests": [
                  {
                    "q": "avg:kubernetes.cpu.usage.total{kube_namespace:authelia,kube_deployment:authelia}",
                    "display_type": "line"
                  }
                ]
              }
            },
            {
              "definition": {
                "title": "Memory Usage",
                "type": "timeseries",
                "requests": [
                  {
                    "q": "avg:kubernetes.memory.usage{kube_namespace:authelia,kube_deployment:authelia}",
                    "display_type": "line"
                  }
                ]
              }
            },
            {
              "definition": {
                "title": "Heap Memory (Go)",
                "type": "timeseries",
                "requests": [
                  {
                    "q": "avg:authelia.go_memstats_heap_inuse_bytes{*}",
                    "display_type": "line"
                  }
                ]
              }
            }
          ]
        }
      },
      {
        "definition": {
          "title": "📝 Recent Logs",
          "type": "log_stream",
          "query": "source:authelia service:authelia",
          "columns": ["host", "service", "level", "message"],
          "show_date_column": true,
          "show_message_column": true,
          "message_display": "expanded-md"
        }
      }
    ]
