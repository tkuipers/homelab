---
# Monitor: Homepage (tkuipers.ca) pod health
apiVersion: datadoghq.com/v1alpha1
kind: DatadogMonitor
metadata:
  name: homepage-pod-health
  namespace: datadog
spec:
  name: "[Homelab] Homepage Pod Not Running"
  type: query alert
  query: "min(last_5m):sum:kubernetes.pods.running{kube_deployment:homepage,kube_namespace:homepage} < 1"
  message: |
    Homepage pod is down!
    
    The personal website at tkuipers.ca may be unreachable.
    
    @slack-homelab-alerts
  tags:
    - env:homelab
    - service:homepage
    - team:infrastructure
  options:
    thresholds:
      critical: "1"
    notifyNoData: true
    noDataTimeframe: 10
    renotifyInterval: 60
---
# Monitor: Authentik service pods health
apiVersion: datadoghq.com/v1alpha1
kind: DatadogMonitor
metadata:
  name: authentik-pods-health
  namespace: datadog
spec:
  name: "[Homelab] Authentik Service Down"
  type: query alert
  query: "min(last_5m):sum:kubernetes.pods.running{kube_namespace:authentik,app.kubernetes.io/name:authentik} < 2"
  message: |
    Authentik SSO service is down!
    
    One or more Authentik pods (server/worker) are not running.
    This affects authentication for all services using SSO.
    
    Check: kubectl get pods -n authentik
  tags:
    - env:homelab
    - service:authentik
    - team:infrastructure
    - severity:critical
  options:
    thresholds:
      critical: "2"
    notifyNoData: true
    noDataTimeframe: 10
    renotifyInterval: 30
---
# Monitor: Authentik PostgreSQL health
apiVersion: datadoghq.com/v1alpha1
kind: DatadogMonitor
metadata:
  name: authentik-postgresql-health
  namespace: datadog
spec:
  name: "[Homelab] Authentik PostgreSQL Down"
  type: query alert
  query: "min(last_5m):sum:kubernetes.pods.running{kube_deployment:authentik-postgresql,kube_namespace:authentik} < 1"
  message: |
    Authentik PostgreSQL database is down!
    
    This will cause authentication failures across all services.
    
    Check: kubectl logs -n authentik -l app=authentik-postgresql
  tags:
    - env:homelab
    - service:authentik-postgres
    - team:infrastructure
    - severity:critical
  options:
    thresholds:
      critical: "1"
    notifyNoData: true
    noDataTimeframe: 10
    renotifyInterval: 30
---
# Monitor: Authentik Redis health
apiVersion: datadoghq.com/v1alpha1
kind: DatadogMonitor
metadata:
  name: authentik-redis-health
  namespace: datadog
spec:
  name: "[Homelab] Authentik Redis Down"
  type: query alert
  query: "min(last_5m):sum:kubernetes.pods.running{kube_deployment:authentik-redis,kube_namespace:authentik} < 1"
  message: |
    Authentik Redis cache is down!
    
    This may cause degraded performance and session issues.
    
    Check: kubectl logs -n authentik -l app=authentik-redis
  tags:
    - env:homelab
    - service:authentik-redis
    - team:infrastructure
    - severity:warning
  options:
    thresholds:
      critical: "1"
    notifyNoData: true
    noDataTimeframe: 10
    renotifyInterval: 60
---
# Monitor: High failed login rate
apiVersion: datadoghq.com/v1alpha1
kind: DatadogMonitor
metadata:
  name: authentik-high-failed-logins
  namespace: datadog
spec:
  name: "[Homelab] Authentik High Failed Login Rate"
  type: query alert
  query: "sum(last_5m):sum:authentik.events{action:login_failed,kube_namespace:authentik}.as_count() by {client_ip} > 10"
  message: |
    High failed login attempts detected from IP: {{client_ip.name}}
    
    {{value}} failed login attempts in the last 5 minutes.
    This could indicate a brute-force attack.
    
    Review logs: kubectl logs -n authentik -l app.kubernetes.io/component=worker | grep login_failed
  tags:
    - env:homelab
    - service:authentik
    - team:security
    - severity:warning
  options:
    thresholds:
      critical: "10"
      warning: "5"
    notifyNoData: false
    renotifyInterval: 120
---
# Monitor: Authentik certificate expiry
apiVersion: datadoghq.com/v1alpha1
kind: DatadogMonitor
metadata:
  name: authentik-cert-expiry
  namespace: datadog
spec:
  name: "[Homelab] Authentik TLS Certificate Expiring"
  type: metric alert
  query: "max(last_1h):avg:cert_manager.certificate.expiration_timestamp{kube_namespace:authentik,name:authentik-tls} - time() < 1209600"
  message: |
    TLS certificate for auth.tkuipers.ca is expiring soon!
    
    Certificate expires in less than 14 days.
    
    Check: kubectl get certificate authentik-tls -n authentik
  tags:
    - env:homelab
    - service:authentik
    - team:infrastructure
    - severity:warning
  options:
    thresholds:
      critical: "604800"  # 7 days
      warning: "1209600"  # 14 days
    notifyNoData: false
    renotifyInterval: 1440  # Daily
---
# Monitor: Forward auth latency
apiVersion: datadoghq.com/v1alpha1
kind: DatadogMonitor
metadata:
  name: authentik-forward-auth-latency
  namespace: datadog
spec:
  name: "[Homelab] Authentik Forward Auth High Latency"
  type: metric alert
  query: "avg(last_10m):avg:trace.http.request.duration.by.service.95p{service:authentik} > 500"
  message: |
    Authentik forward authentication is slow!
    
    P95 latency: {{value}}ms (threshold: 500ms)
    This affects all protected services.
    
    Check resource usage and database performance.
  tags:
    - env:homelab
    - service:authentik
    - team:infrastructure
    - severity:warning
  options:
    thresholds:
      critical: "500"
      warning: "300"
    notifyNoData: false
    evaluationDelay: 300
---
# Monitor: PostgreSQL connection pool
apiVersion: datadoghq.com/v1alpha1
kind: DatadogMonitor
metadata:
  name: authentik-postgresql-connections
  namespace: datadog
spec:
  name: "[Homelab] Authentik PostgreSQL High Connections"
  type: metric alert
  query: "avg(last_5m):avg:postgresql.connections{service:authentik-postgres} > 90"
  message: |
    PostgreSQL connection pool is nearly exhausted!
    
    Current connections: {{value}} (warning at 90)
    
    This may cause authentication failures.
    Check for connection leaks or increase pool size.
  tags:
    - env:homelab
    - service:authentik-postgres
    - team:infrastructure
    - severity:warning
  options:
    thresholds:
      critical: "95"
      warning: "90"
    notifyNoData: false
---
# Monitor: Homepage HTTP response
apiVersion: datadoghq.com/v1alpha1
kind: DatadogMonitor
metadata:
  name: homepage-http-errors
  namespace: datadog
spec:
  name: "[Homelab] Homepage High Error Rate"
  type: query alert
  query: "sum(last_5m):sum:nginx.http.response.5xx{service:homepage}.as_count() / sum:nginx.http.response.total{service:homepage}.as_count() * 100 > 10"
  message: |
    Homepage is returning elevated 5xx errors!
    
    Error rate is above 10% in the last 5 minutes.
    
    @slack-homelab-alerts
  tags:
    - env:homelab
    - service:homepage
    - team:infrastructure
  options:
    thresholds:
      critical: "10"
      warning: "5"
    notifyNoData: false
---
# Monitor: ArgoCD server pod health
apiVersion: datadoghq.com/v1alpha1
kind: DatadogMonitor
metadata:
  name: argocd-server-health
  namespace: datadog
spec:
  name: "[Homelab] ArgoCD Server Not Running"
  type: query alert
  query: "min(last_5m):sum:kubernetes.pods.running{kube_deployment:argocd-server,kube_namespace:argocd} < 1"
  message: |
    ArgoCD server is down!
    
    The GitOps UI at argo.tkuipers.ca may be unreachable.
    This could affect deployments.
    
    @slack-homelab-alerts
  tags:
    - env:homelab
    - service:argocd
    - team:infrastructure
  options:
    thresholds:
      critical: "1"
    notifyNoData: true
    noDataTimeframe: 10
    renotifyInterval: 60
---
# Monitor: ArgoCD application sync failures
apiVersion: datadoghq.com/v1alpha1
kind: DatadogMonitor
metadata:
  name: argocd-sync-failures
  namespace: datadog
spec:
  name: "[Homelab] ArgoCD Application Sync Failed"
  type: query alert
  query: "max(last_10m):sum:argocd.app_info{sync_status:outofsync,cluster:homelab} > 2"
  message: |
    Multiple ArgoCD applications are out of sync!
    
    More than 2 applications have failed to sync in the last 10 minutes.
    Check the ArgoCD UI: https://argo.tkuipers.ca
    
    @slack-homelab-alerts
  tags:
    - env:homelab
    - service:argocd
    - team:infrastructure
  options:
    thresholds:
      critical: "2"
      warning: "1"
    notifyNoData: false
---
# Monitor: Ingress controller health
apiVersion: datadoghq.com/v1alpha1
kind: DatadogMonitor
metadata:
  name: ingress-nginx-health
  namespace: datadog
spec:
  name: "[Homelab] Ingress NGINX Not Running"
  type: query alert
  query: "min(last_5m):sum:kubernetes.pods.running{kube_deployment:infrastructure-ingress-nginx-controller,kube_namespace:ingress-nginx} < 1"
  message: |
    Ingress NGINX controller is down!
    
    All external traffic to the cluster will fail.
    This affects: tkuipers.ca, argo.tkuipers.ca, and all other services.
    
    @slack-homelab-alerts
  tags:
    - env:homelab
    - service:ingress-nginx
    - team:infrastructure
  options:
    thresholds:
      critical: "1"
    notifyNoData: true
    noDataTimeframe: 10
    renotifyInterval: 30
---
# Monitor: cert-manager health
apiVersion: datadoghq.com/v1alpha1
kind: DatadogMonitor
metadata:
  name: cert-manager-health
  namespace: datadog
spec:
  name: "[Homelab] cert-manager Not Running"
  type: query alert
  query: "min(last_5m):sum:kubernetes.pods.running{kube_namespace:cert-manager,kube_deployment:infrastructure-cert-manager} < 1"
  message: |
    cert-manager is down!
    
    Certificate issuance and renewal will fail.
    This affects TLS for all services.
    
    @slack-homelab-alerts
  tags:
    - env:homelab
    - service:cert-manager
    - team:infrastructure
  options:
    thresholds:
      critical: "1"
    notifyNoData: true
    noDataTimeframe: 10
    renotifyInterval: 60

