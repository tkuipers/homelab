# Datadog Agent Configuration
# Datadog Pro tier - all features enabled
# Note: Values are nested under 'datadog' because that's the dependency name in Chart.yaml

datadog:
  datadog:
    # Site configuration
    site: datadoghq.com

    # API keys from ExternalSecret
    apiKeyExistingSecret: datadog-api-keys
    appKeyExistingSecret: datadog-api-keys

    # Cluster name for identification
    clusterName: homelab

    # Kubernetes integration
    kubeStateMetricsEnabled: true
    kubeStateMetricsCore:
      enabled: true
    collectEvents: true

    # APM (Application Performance Monitoring)
    apm:
      portEnabled: true
      socketEnabled: true

    # Log Collection
    logs:
      enabled: true
      containerCollectAll: true

    # Live Processes
    processAgent:
      enabled: true
      processCollection: true

    # Network Performance Monitoring
    networkMonitoring:
      enabled: true

    # Orchestrator Explorer
    orchestratorExplorer:
      enabled: true

    # Tags for all metrics
    tags:
      - "env:homelab"
      - "cluster:homelab"

  # Enable the agent DaemonSet
  agents:
    enabled: true
    containers:
      agent:
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
    tolerations:
      - operator: Exists
    useHostNetwork: true

  # Cluster Agent for Kubernetes metrics
  clusterAgent:
    enabled: true
    replicas: 1
    metricsProvider:
      enabled: true
      useDatadogMetrics: true
    admissionController:
      enabled: true
      mutateUnlabelled: false

  # Cluster checks runner
  clusterChecksRunner:
    enabled: false
