# Datadog Agent Configuration for Talos Linux
# https://docs.datadoghq.com/containers/kubernetes/installation/?tab=helm

datadog:
  datadog:
    # API keys from ExternalSecret
    apiKeyExistingSecret: datadog-api-keys
    appKeyExistingSecret: datadog-api-keys

    # Cluster identification
    clusterName: homelab
    site: us5.datadoghq.com

    # Talos-specific kubelet config
    kubelet:
      tlsVerify: false

    # Kubernetes integration
    kubeStateMetricsEnabled: true
    kubeStateMetricsCore:
      enabled: true
    collectEvents: true

    # APM
    apm:
      portEnabled: true
      socketEnabled: true

    # Logs
    logs:
      enabled: true
      containerCollectAll: true

    # Processes
    processAgent:
      enabled: true
      processCollection: true

    # Orchestrator Explorer
    orchestratorExplorer:
      enabled: true

    # Tags
    tags:
      - "env:homelab"
      - "cluster:homelab"

  # Agent DaemonSet configuration
  agents:
    tolerations:
      - operator: Exists

  # Cluster Agent
  clusterAgent:
    enabled: true
    replicas: 1
    metricsProvider:
      enabled: true
      useDatadogMetrics: true

  # Enable Talos provider
  providers:
    talos:
      enabled: true
