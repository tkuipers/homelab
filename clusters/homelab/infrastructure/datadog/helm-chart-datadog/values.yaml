# Datadog Agent Configuration
# Configured for Talos Linux per official docs
# https://docs.datadoghq.com/containers/kubernetes/installation/?tab=helm

datadog:
  datadog:
    # API keys from ExternalSecret
    apiKeyExistingSecret: datadog-api-keys
    appKeyExistingSecret: datadog-api-keys

    # Cluster identification
    clusterName: homelab
    site: datadoghq.com

    # Talos-specific: disable TLS verification for kubelet
    kubelet:
      tlsVerify: false

    # Ignore auto-config for components we'll configure manually
    ignoreAutoConfig:
      - etcd
      - kube_scheduler
      - kube_controller_manager

    # Manual configuration for control plane components
    confd:
      etcd.yaml: |-
        ad_identifiers:
          - kube-scheduler
        instances:
          - prometheus_url: https://%%host%%:2379/metrics
            tls_ca_cert: /host/etc/kubernetes/pki/etcd/ca.crt
            tls_cert: /host/etc/kubernetes/pki/etcd/server.crt
            tls_private_key: /host/etc/kubernetes/pki/etcd/server.key
      kube_scheduler.yaml: |-
        ad_identifiers:
          - kube-scheduler
        instances:
          - prometheus_url: https://%%host%%:10259/metrics
            ssl_verify: false
            bearer_token_auth: true
      kube_controller_manager.yaml: |-
        ad_identifiers:
          - kube-controller-manager
        instances:
          - prometheus_url: https://%%host%%:10257/metrics
            ssl_verify: false
            bearer_token_auth: true

    # Kubernetes integration
    kubeStateMetricsEnabled: true
    kubeStateMetricsCore:
      enabled: true
    collectEvents: true

    # APM
    apm:
      portEnabled: true
      socketEnabled: true

    # Logs
    logs:
      enabled: true
      containerCollectAll: true

    # Processes
    processAgent:
      enabled: true
      processCollection: true

    # Orchestrator Explorer
    orchestratorExplorer:
      enabled: true

    # Tags
    tags:
      - "env:homelab"
      - "cluster:homelab"

  # Agent DaemonSet configuration
  agents:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - operator: Exists

    # Talos: Mount etcd certs from Talos path
    volumes:
      - hostPath:
          path: /system/secrets/etcd
        name: etcd-certs

    volumeMounts:
      - name: etcd-certs
        mountPath: /host/etc/kubernetes/pki/etcd
        readOnly: true

  # Cluster Agent
  clusterAgent:
    enabled: true
    replicas: 1
    metricsProvider:
      enabled: true
      useDatadogMetrics: true

  # CRITICAL: Enable Talos provider
  providers:
    talos:
      enabled: true

  # Disable cluster checks runner for simplicity
  clusterChecksRunner:
    enabled: false
