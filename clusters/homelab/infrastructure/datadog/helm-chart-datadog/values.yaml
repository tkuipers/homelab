# Datadog Agent Configuration
# Datadog Pro tier - all features enabled
# Configured for Talos OS (read-only root filesystem)

datadog:
  datadog:
    # Site configuration
    site: datadoghq.com

    # API keys from ExternalSecret
    apiKeyExistingSecret: datadog-api-keys
    appKeyExistingSecret: datadog-api-keys

    # Cluster name for identification
    clusterName: homelab

    # Kubernetes integration
    kubeStateMetricsEnabled: true
    kubeStateMetricsCore:
      enabled: true
    collectEvents: true

    # APM (Application Performance Monitoring)
    apm:
      portEnabled: true
      socketEnabled: true

    # Log Collection
    logs:
      enabled: true
      containerCollectAll: true

    # Live Processes
    processAgent:
      enabled: true
      processCollection: true

    # Network Performance Monitoring - DISABLED for Talos
    # NPM requires kernel headers which Talos doesn't have
    networkMonitoring:
      enabled: false

    # Orchestrator Explorer
    orchestratorExplorer:
      enabled: true

    # Tags for all metrics
    tags:
      - "env:homelab"
      - "cluster:homelab"

    # Talos-specific: Container runtime socket
    criSocketPath: /var/run/containerd/containerd.sock

  # Enable the agent DaemonSet
  agents:
    enabled: true
    
    # Talos-specific: Use containerd
    containers:
      agent:
        # Talos-specific: Need to disable some features
        env:
          - name: DD_CONTAINER_EXCLUDE
            value: "name:pause name:POD"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # Talos: Disable security context that causes issues
        securityContext:
          readOnlyRootFilesystem: false
      
      traceAgent:
        securityContext:
          readOnlyRootFilesystem: false
      
      processAgent:
        securityContext:
          readOnlyRootFilesystem: false
    
    # Run on all nodes
    tolerations:
      - operator: Exists
    
    # Don't use host network - can cause issues
    useHostNetwork: false
    
    # Talos: Mount containerd socket
    volumes:
      - name: containerdsocket
        hostPath:
          path: /var/run/containerd/containerd.sock
      - name: proc
        hostPath:
          path: /proc
      - name: cgroup
        hostPath:
          path: /sys/fs/cgroup
      - name: var-log
        hostPath:
          path: /var/log
          
    volumeMounts:
      - name: containerdsocket
        mountPath: /var/run/containerd/containerd.sock
        readOnly: true
      - name: proc
        mountPath: /host/proc
        readOnly: true
      - name: cgroup
        mountPath: /host/sys/fs/cgroup
        readOnly: true
      - name: var-log
        mountPath: /var/log/pods
        readOnly: true

  # Cluster Agent for Kubernetes metrics
  clusterAgent:
    enabled: true
    replicas: 1
    metricsProvider:
      enabled: true
      useDatadogMetrics: true
    admissionController:
      enabled: false  # Disable - can cause issues with Talos

  # Cluster checks runner - disable for simplicity
  clusterChecksRunner:
    enabled: false
