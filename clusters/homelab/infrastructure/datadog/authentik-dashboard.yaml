apiVersion: datadoghq.com/v1alpha1
kind: DatadogDashboard
metadata:
  name: authentik-sso-dashboard
  namespace: datadog
spec:
  title: "🔐 Authentik SSO Dashboard"
  description: "Authentication metrics, health, and performance monitoring"
  layoutType: ordered
  tags:
    - team:infrastructure
  widgets: |
    [
      {
        "definition": {
          "title": "🎯 Service Health",
          "type": "group",
          "layout_type": "ordered",
          "widgets": [
            {
              "definition": {
                "title": "Authentik Pods Running",
                "type": "query_value",
                "requests": [
                  {
                    "q": "sum:kubernetes.pods.running{kube_namespace:authentik,app.kubernetes.io/name:authentik}",
                    "aggregator": "last"
                  }
                ],
                "precision": 0,
                "custom_links": [
                  {
                    "label": "View Pods",
                    "link": "https://auth.tkuipers.ca"
                  }
                ],
                "autoscale": true
              }
            },
            {
              "definition": {
                "title": "PostgreSQL Status",
                "type": "check_status",
                "check": "postgres.can_connect",
                "grouping": "cluster",
                "group_by": ["kube_namespace:authentik"],
                "tags": []
              }
            },
            {
              "definition": {
                "title": "Redis Status",
                "type": "check_status",
                "check": "redis.can_connect",
                "grouping": "cluster",
                "group_by": ["kube_namespace:authentik"],
                "tags": []
              }
            },
            {
              "definition": {
                "title": "Pod Restarts (24h)",
                "type": "query_value",
                "requests": [
                  {
                    "q": "sum:kubernetes.containers.restarts{kube_namespace:authentik}.rollup(sum, 86400)",
                    "aggregator": "last"
                  }
                ],
                "precision": 0
              }
            }
          ]
        }
      },
      {
        "definition": {
          "title": "🔑 Authentication Metrics",
          "type": "group",
          "layout_type": "ordered",
          "widgets": [
            {
              "definition": {
                "title": "Login Events (Successful)",
                "type": "timeseries",
                "requests": [
                  {
                    "q": "sum:authentik.events{action:login,kube_namespace:authentik}.as_count()",
                    "display_type": "bars",
                    "style": {
                      "palette": "green",
                      "line_type": "solid",
                      "line_width": "normal"
                    }
                  }
                ],
                "yaxis": {
                  "include_zero": true
                }
              }
            },
            {
              "definition": {
                "title": "Failed Login Attempts",
                "type": "timeseries",
                "requests": [
                  {
                    "q": "sum:authentik.events{action:login_failed,kube_namespace:authentik}.as_count()",
                    "display_type": "bars",
                    "style": {
                      "palette": "warm",
                      "line_type": "solid",
                      "line_width": "normal"
                    }
                  }
                ],
                "yaxis": {
                  "include_zero": true
                },
                "markers": [
                  {
                    "value": "y = 10",
                    "display_type": "error dashed"
                  }
                ]
              }
            },
            {
              "definition": {
                "title": "Login Success Rate",
                "type": "query_value",
                "requests": [
                  {
                    "q": "( sum:authentik.events{action:login}.as_count() / ( sum:authentik.events{action:login}.as_count() + sum:authentik.events{action:login_failed}.as_count() ) ) * 100",
                    "aggregator": "last"
                  }
                ],
                "precision": 2,
                "custom_unit": "%"
              }
            },
            {
              "definition": {
                "title": "Active Sessions",
                "type": "query_value",
                "requests": [
                  {
                    "q": "sum:authentik.sessions.active{kube_namespace:authentik}",
                    "aggregator": "last"
                  }
                ],
                "precision": 0,
                "autoscale": true
              }
            }
          ]
        }
      },
      {
        "definition": {
          "title": "📊 Resource Usage",
          "type": "group",
          "layout_type": "ordered",
          "widgets": [
            {
              "definition": {
                "title": "CPU Usage by Component",
                "type": "timeseries",
                "requests": [
                  {
                    "q": "avg:kubernetes.cpu.usage.total{kube_namespace:authentik} by {kube_deployment}",
                    "display_type": "area",
                    "style": {
                      "palette": "dog_classic"
                    }
                  }
                ],
                "yaxis": {
                  "include_zero": true,
                  "scale": "linear"
                }
              }
            },
            {
              "definition": {
                "title": "Memory Usage by Component",
                "type": "timeseries",
                "requests": [
                  {
                    "q": "avg:kubernetes.memory.usage{kube_namespace:authentik} by {kube_deployment}",
                    "display_type": "area",
                    "style": {
                      "palette": "purple"
                    }
                  }
                ],
                "yaxis": {
                  "include_zero": true,
                  "scale": "linear"
                }
              }
            },
            {
              "definition": {
                "title": "PostgreSQL Connections",
                "type": "timeseries",
                "requests": [
                  {
                    "q": "avg:postgresql.connections{service:authentik-postgres}",
                    "display_type": "line",
                    "style": {
                      "palette": "cool",
                      "line_type": "solid",
                      "line_width": "normal"
                    }
                  }
                ],
                "markers": [
                  {
                    "value": "y = 90",
                    "display_type": "warning dashed",
                    "label": "Connection pool warning"
                  }
                ]
              }
            },
            {
              "definition": {
                "title": "Redis Memory Usage",
                "type": "query_value",
                "requests": [
                  {
                    "q": "avg:redis.mem.used{service:authentik-redis}",
                    "aggregator": "last"
                  }
                ],
                "precision": 2,
                "custom_unit": "MiB",
                "autoscale": true
              }
            }
          ]
        }
      },
      {
        "definition": {
          "title": "⚡ Performance Metrics",
          "type": "group",
          "layout_type": "ordered",
          "widgets": [
            {
              "definition": {
                "title": "HTTP Request Latency (p95)",
                "type": "timeseries",
                "requests": [
                  {
                    "q": "avg:trace.http.request.duration.by.service.95p{service:authentik}",
                    "display_type": "line",
                    "style": {
                      "palette": "warm",
                      "line_type": "solid",
                      "line_width": "normal"
                    }
                  }
                ],
                "markers": [
                  {
                    "value": "y = 500",
                    "display_type": "error dashed",
                    "label": "Latency threshold"
                  }
                ],
                "yaxis": {
                  "include_zero": true
                }
              }
            },
            {
              "definition": {
                "title": "Forward Auth Response Time (p95)",
                "type": "timeseries",
                "requests": [
                  {
                    "q": "avg:nginx.ingress.controller.request.duration.95p{service:authentik-forward-auth}",
                    "display_type": "line",
                    "style": {
                      "palette": "orange"
                    }
                  }
                ],
                "markers": [
                  {
                    "value": "y = 500",
                    "display_type": "warning dashed"
                  }
                ]
              }
            },
            {
              "definition": {
                "title": "HTTP Requests per Second",
                "type": "timeseries",
                "requests": [
                  {
                    "q": "sum:trace.http.request.hits{service:authentik}.as_rate()",
                    "display_type": "bars",
                    "style": {
                      "palette": "cool"
                    }
                  }
                ],
                "yaxis": {
                  "include_zero": true
                }
              }
            },
            {
              "definition": {
                "title": "Error Rate",
                "type": "query_value",
                "requests": [
                  {
                    "q": "( sum:trace.http.request.errors{service:authentik}.as_count() / sum:trace.http.request.hits{service:authentik}.as_count() ) * 100",
                    "aggregator": "avg"
                  }
                ],
                "precision": 2,
                "custom_unit": "%"
              }
            }
          ]
        }
      },
      {
        "definition": {
          "title": "📜 Recent Logs",
          "type": "group",
          "layout_type": "ordered",
          "widgets": [
            {
              "definition": {
                "title": "Authentik Application Logs",
                "type": "log_stream",
                "indexes": [],
                "query": "service:authentik",
                "sort": {
                  "column": "time",
                  "order": "desc"
                },
                "columns": ["core_host", "core_service", "level", "message"],
                "show_date_column": true,
                "show_message_column": true,
                "message_display": "expanded-md"
              }
            },
            {
              "definition": {
                "title": "Error Logs (Last Hour)",
                "type": "log_stream",
                "indexes": [],
                "query": "service:authentik status:error",
                "sort": {
                  "column": "time",
                  "order": "desc"
                },
                "columns": ["core_host", "level", "message"],
                "show_date_column": true,
                "show_message_column": true,
                "message_display": "expanded-lg"
              }
            }
          ]
        }
      }
    ]

