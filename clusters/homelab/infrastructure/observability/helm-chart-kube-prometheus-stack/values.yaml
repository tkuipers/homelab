        target_service: transmission
    - name: logs-tkuipers-ca
      url: https://logs.tkuipers.ca/

      module: http_public
      additionalMetricsRelabels:
        probe: external
        target_namespace: observability
        target_service: grafana
    - name: polymarket-tkuipers-ca
      url: https://polymarket.tkuipers.ca/

      module: http_authelia
      additionalMetricsRelabels:
        probe: external
        target_namespace: polymarket-bot
        target_service: bot
    - name: stocks-api-tkuipers-ca
      url: https://stocks-api.tkuipers.ca/healthz

      module: http_public
      additionalMetricsRelabels:
        probe: external
        target_namespace: stocks
        target_service: api
    - name: stocks-tkuipers-ca
      url: https://stocks.tkuipers.ca/

      module: http_public
      additionalMetricsRelabels:
        probe: external
        target_namespace: stocks
        target_service: console
    - name: k8s-tkuipers-ca
      url: https://k8s.tkuipers.ca/

      module: http_401
      additionalMetricsRelabels:
        probe: external
        target_namespace: ingress-nginx
        target_service: kubernetes-api-proxy
    # --- in-cluster health checks of the app itself via its Service (2xx from
    # its health endpoint; "http_alive" = answers HTTP without a 5xx) ---
    - name: int-mediacenter-jellyfin
      url: http://jellyfin.mediacenter.svc:8096/health
      module: http_2xx
      additionalMetricsRelabels:
        probe: internal
        target_namespace: mediacenter
        target_service: jellyfin
    - name: int-homelab-agent-homelab-agent
      url: http://homelab-agent.homelab-agent.svc/healthz
