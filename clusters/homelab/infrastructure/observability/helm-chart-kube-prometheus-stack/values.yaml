        probe: external
        target_namespace: mediacenter
        target_service: kavita
    - name: prowlarr-tkuipers-ca
      url: https://prowlarr.tkuipers.ca/

      module: http_authelia
      additionalMetricsRelabels:
        probe: external
        target_namespace: mediacenter
        target_service: prowlarr
    - name: radarr-tkuipers-ca
      url: https://radarr.tkuipers.ca/

      module: http_authelia
      additionalMetricsRelabels:
        probe: external
        target_namespace: mediacenter
        target_service: radarr
    - name: readarr-tkuipers-ca
      url: https://readarr.tkuipers.ca/

      module: http_authelia
      additionalMetricsRelabels:
        probe: external
        target_namespace: mediacenter
        target_service: readarr
    - name: sabnzbd-tkuipers-ca
      url: https://sabnzbd.tkuipers.ca/

      module: http_authelia
      additionalMetricsRelabels:
        probe: external
