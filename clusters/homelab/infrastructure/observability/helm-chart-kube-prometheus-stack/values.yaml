# kube-prometheus-stack: metrics (Prometheus), alert routing (Alertmanager),
# UI (Grafana), and the standard exporters (node-exporter, kube-state-metrics).
# Release name is "kps" (set on the ArgoCD Application).
kube-prometheus-stack:
  fullnameOverride: kps
  cleanPrometheusOperatorObjectNames: true

  crds:
    enabled: true

  defaultRules:
    create: true
    rules:
      # Talos does not expose etcd / kube-proxy metrics outside the node
      etcd: false
      kubeProxy: false
    # Always firing on a 2-node homelab (limits are deliberately overcommitted)
    disabled:
      KubeCPUOvercommit: true
      KubeMemoryOvercommit: true
      # fires forever on old failed Jobs; replaced by the Grafana rule
      # "Job failed" (only Jobs started in the last 24h)
      KubeJobFailed: true
      # Duplicates of Grafana-managed rules (alerts/ - generate_alerts.py), which
      # carry namespace/service labels and dashboard links. One failure = one alert.
      KubePodCrashLooping: true             # hl-crashloop
      KubeDeploymentReplicasMismatch: true  # hl-workload-unavailable
      KubeStatefulSetReplicasMismatch: true # hl-statefulset-not-ready
      KubeDaemonSetRolloutStuck: true       # hl-daemonset-not-ready
      NodeFilesystemAlmostOutOfSpace: true  # hl-node-disk
      NodeFilesystemSpaceFillingUp: true    # hl-node-disk-forecast
      TargetDown: true                      # hl-scrape-down

  # Watches the other evaluator: Grafana evaluates every rule in alerts/, so
  # Prometheus alerts when Grafana is down or has stopped evaluating.
  additionalPrometheusRulesMap:
    grafana-alerting:
      groups:
        - name: grafana-alerting
          rules:
            - alert: GrafanaDown
              expr: absent(up{job="kps-grafana"} == 1)
              for: 10m
              labels:
                severity: critical
                namespace: observability
                service: grafana
              annotations:
                summary: Grafana is down - none of the Grafana-managed alert rules are being evaluated
                description: kubectl -n observability get pods -l app.kubernetes.io/name=grafana; check its logs.
            - alert: GrafanaAlertingStalled
              expr: sum(rate(grafana_alerting_rule_evaluations_total[10m])) == 0
              for: 15m
              labels:
                severity: critical
                namespace: observability
                service: grafana
              annotations:
                summary: Grafana is up but evaluates no alert rules
                description: Check Grafana logs (logger=ngalert) and Alerting > Alert rules for provisioning errors.
            - alert: GrafanaAlertRulesFailing
              expr: sum(increase(grafana_alerting_rule_evaluation_failures_total[15m])) > 5
              for: 15m
              labels:
                severity: warning
                namespace: observability
                service: grafana
              annotations:
                summary: Grafana alert rules fail to evaluate (query errors / datasource down)
                description: Alerting > Alert rules, filter by state Error.

  # --- control plane -------------------------------------------------------
  # Talos binds controller-manager/scheduler on 0.0.0.0 (see
  # tooling/patches/controlplane-metrics.yaml); they serve self-signed TLS.
  kubeControllerManager:
    enabled: true
    service:
      selector:
        k8s-app: kube-controller-manager
    serviceMonitor:
      https: true
      insecureSkipVerify: true
  kubeScheduler:
    enabled: true
    service:
      selector:
        k8s-app: kube-scheduler
    serviceMonitor:
      https: true
      insecureSkipVerify: true
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

  kube-state-metrics:
    metricLabelsAllowlist:
      - pods=[app,app.kubernetes.io/name]
      - deployments=[app,app.kubernetes.io/name]

  # --- prometheus ----------------------------------------------------------
  prometheus:
    prometheusSpec:
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      # 40Gi hostPath PV; retentionSize is enforced by Prometheus itself.
      retention: 90d
      retentionSize: 36GB
      scrapeInterval: 30s
      evaluationInterval: 30s
      enableRemoteWriteReceiver: true   # Tempo metrics-generator (span metrics / service graph)
      enableFeatures:
        - exemplar-storage
      # Pick up ServiceMonitors/PodMonitors/Rules from every namespace,
      # regardless of labels.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      # hostPath volume is root owned; fsGroup does not apply to hostPath.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        fsGroup: 0
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 8Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: observability-hostpath
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 40Gi

  alertmanager:
    # The kube-prometheus-stack PrometheusRules alert through this Alertmanager;
    # warnings and criticals go to the homelab agent (Grafana-managed rules are
    # routed by Grafana itself, see alerts/alert-rules.yaml). Inhibit rules are
    # the chart defaults.
    config:
      global:
        resolve_timeout: 5m
      inhibit_rules:
        - source_matchers: ['severity = critical']
          target_matchers: ['severity =~ warning|info']
          equal: [namespace, alertname]
        - source_matchers: ['severity = warning']
          target_matchers: ['severity = info']
          equal: [namespace, alertname]
        - source_matchers: ['alertname = InfoInhibitor']
          target_matchers: ['severity = info']
          equal: [namespace]
        - target_matchers: ['alertname = InfoInhibitor']
      route:
        group_by: [namespace, alertname]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: homelab-agent
        routes:
          - receiver: "null"
            matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
          - receiver: "null"
            matchers: ['severity !~ "warning|critical"']
      receivers:
        - name: "null"
        - name: homelab-agent
          webhook_configs:
            - url: http://homelab-agent.homelab-agent.svc/hooks/alertmanager
              send_resolved: true
              http_config:
                authorization:
                  type: Bearer
                  credentials_file: /etc/alertmanager/secrets/homelab-agent-webhook/token
      templates:
        - /etc/alertmanager/config/*.tmpl
    alertmanagerSpec:
      # mounted at /etc/alertmanager/secrets/<name>/ (ExternalSecret in ../secrets)
      secrets:
        - homelab-agent-webhook
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

  prometheusOperator:
    # cert-manager issues the webhook cert (no patch jobs fighting ArgoCD
    # over caBundle)
    admissionWebhooks:
      certManager:
        enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

  # --- grafana -------------------------------------------------------------
  grafana:
    testFramework:
      enabled: false
    nodeSelector:
      kubernetes.io/hostname: dell-r620
    deploymentStrategy:
      type: Recreate
    persistence:
      enabled: true
      type: pvc
      storageClassName: observability-hostpath
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

    # Secrets: ExternalSecrets from the 1Password item "Observability
    # Credentials" (../secrets/external-secrets.yaml), managed by
    # tooling/scripts/setup-credentials/setup-observability-credentials.sh.
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    extraConfigmapMounts:
      - name: home-dashboard
        mountPath: /etc/grafana/home
        configMap: dash-overview-platform-health   # dashboards/kustomization.yaml
        readOnly: true
        optional: true
    envValueFrom:
      # bearer token for the homelab agent contact points (alerts/alert-rules.yaml)
      AGENT_WEBHOOK_TOKEN:
        secretKeyRef:
          name: homelab-agent-webhook
          key: token
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-oidc
          key: client-secret
      # encrypts datasource passwords etc. in Grafana's DB - never rotate casually
      GF_SECURITY_SECRET_KEY:
        secretKeyRef:
          name: grafana-security
          key: secret-key
      # read-only 'grafana_ro' DB users (setup-grafana-db-readonly.sh)
      DS_PG_STOCKS_PASSWORD:
        secretKeyRef:
          name: grafana-datasources
          key: pg-stocks-password
      DS_PG_POLYMARKET_PASSWORD:
        secretKeyRef:
          name: grafana-datasources
          key: pg-polymarket-password
      DS_MYSQL_STOCKGUESSER_PASSWORD:
        secretKeyRef:
          name: grafana-datasources
          key: mysql-stockguesser-password

    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - logs.tkuipers.ca
      tls:
        - secretName: logs-tkuipers-ca-tls
          hosts:
            - logs.tkuipers.ca

    grafana.ini:
      log:
        # one info line per datasource query (alert evaluation = ~15k lines/h)
        filters: plugin.prometheus:warn plugin.loki:warn plugin.tempo:warn tsdb.loki:warn
      server:
        domain: logs.tkuipers.ca
        root_url: https://logs.tkuipers.ca
      analytics:
        reporting_enabled: false
        check_for_updates: false
      users:
        default_theme: dark
      auth:
        # Local admin login stays available at /login?disableAutoLogin
        oauth_auto_login: true
        signout_redirect_url: https://auth.tkuipers.ca/logout
      auth.generic_oauth:
        enabled: true
        name: Authelia
        icon: signin
        client_id: grafana
        scopes: openid profile email groups
        empty_scopes: false
        auth_url: https://auth.tkuipers.ca/api/oidc/authorization
        token_url: https://auth.tkuipers.ca/api/oidc/token
        api_url: https://auth.tkuipers.ca/api/oidc/userinfo
        login_attribute_path: preferred_username
        groups_attribute_path: groups
        name_attribute_path: name
        email_attribute_path: email
        use_pkce: true
        auth_style: InHeader
        allow_sign_up: true
        auto_login: true
        # Empty (not 'Viewer') when the token has no groups claim, so Grafana
        # falls back from the ID token to the userinfo response (Authelia puts
        # groups there).
        role_attribute_path: "groups && (contains(groups, 'admins') && 'Admin' || 'Viewer')"
        role_attribute_strict: false
        allow_assign_grafana_admin: true
        skip_org_role_sync: false
      unified_alerting:
        enabled: true
      dashboards:
        # Home = "Platform health" (generate_dashboards.py master()). Read from
        # its ConfigMap mounted below (not the sidecar folder, which is empty
        # when Grafana starts, so Grafana could not watch it for changes).
        default_home_dashboard_path: /etc/grafana/home/overview--platform-health.json

    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
        folderAnnotation: grafana_folder
        # folders for the kube-prometheus-stack built-in dashboards
        annotations:
          grafana_folder: Kubernetes
        provider:
          foldersFromFilesStructure: true
          allowUiUpdates: false
      datasources:
        enabled: true
        defaultDatasourceEnabled: true
        isDefaultDatasource: true
        uid: prometheus
      alerts:
        enabled: true
        label: grafana_alert
        labelValue: "1"
        searchNamespace: ALL

    additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.observability.svc:3100
        jsonData:
          maxLines: 5000
          timeout: 300
          derivedFields:
            - name: TraceID
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: tempo
              url: "$${__value.raw}"
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.observability.svc:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            filterByTraceID: true
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          lokiSearch:
            datasourceUid: loki
      # App databases, read-only user 'grafana_ro' (SELECT only, read-only
      # transactions, 30s statement timeout, 5 connections).
      - name: Stocks Postgres
        uid: pg-stocks
        type: grafana-postgresql-datasource
        url: postgres.stocks.svc:5432
        user: grafana_ro
        jsonData:
          database: stocks
          sslmode: disable
          postgresVersion: 1600
          maxOpenConns: 5
        secureJsonData:
          password: ${DS_PG_STOCKS_PASSWORD}
      - name: Polymarket Postgres
        uid: pg-polymarket
        type: grafana-postgresql-datasource
        url: postgres.polymarket-bot.svc:5432
        user: grafana_ro
        jsonData:
          database: polymarket_bot
          sslmode: disable
          postgresVersion: 1600
          maxOpenConns: 5
        secureJsonData:
          password: ${DS_PG_POLYMARKET_PASSWORD}
      - name: Stock Guesser MySQL
        uid: mysql-stockguesser
        type: mysql
        url: mysql.stock-guesser.svc:3306
        user: grafana_ro
        jsonData:
          database: stocker
          maxOpenConns: 5
        secureJsonData:
          password: ${DS_MYSQL_STOCKGUESSER_PASSWORD}

# --- synthetic probes ----------------------------------------------------
# probe=external: real DNS + ingress + TLS (+ Authelia) = what a user sees.
#   Auth redirects/401s count as "up" - behind Authelia this does NOT reach
#   the app. 5xx, timeouts and TLS errors are "down".
# probe=internal: the app's own health endpoint via its Service.
prometheus-blackbox-exporter:
  fullnameOverride: blackbox
  config:
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http:
          preferred_ip_protocol: ip4
          follow_redirects: true
          tls_config:
            insecure_skip_verify: true   # in-cluster self-signed (argocd-server)
      http_alive:
        prober: http
        timeout: 10s
        http:
          preferred_ip_protocol: ip4
          follow_redirects: false
          valid_status_codes: [200, 201, 202, 204, 301, 302, 303, 307, 308, 400, 401, 403, 404, 405]
      tcp_connect:
        prober: tcp
        timeout: 5s
        tcp:
          preferred_ip_protocol: ip4
      # --- external (public hostname) modules: each one only accepts what a
      # healthy host of that class answers, so a deleted/misrouted Ingress
      # (ingress-nginx default backend 404) or a broken backend (502/503) fails.
      http_public:          # public app: 2xx after redirects
        prober: http
        timeout: 10s
        http:
          preferred_ip_protocol: ip4
          follow_redirects: true
      http_authelia:        # behind Authelia: the redirect to the login portal
        prober: http
        timeout: 10s
        http:
          preferred_ip_protocol: ip4
          follow_redirects: false
          valid_status_codes: [302]
          fail_if_header_not_matches:
            - header: Location
              regexp: '^https://auth\.tkuipers\.ca/'
      http_401:             # API that requires credentials (k8s API proxy)
        prober: http
        timeout: 10s
        http:
          preferred_ip_protocol: ip4
          follow_redirects: false
          valid_status_codes: [401]
      http_anki_sync:       # anki sync server: no page at /, its sync API answers 400 to an empty POST
        prober: http
        timeout: 10s
        http:
          preferred_ip_protocol: ip4
          method: POST
          follow_redirects: false
          valid_status_codes: [400]
      # LAN DNS (AdGuard): resolves an external name with a non-empty answer
      dns_a:
        prober: dns
        timeout: 5s
        dns:
          preferred_ip_protocol: ip4
          query_name: github.com
          query_type: A
          valid_rcodes: [NOERROR]
          validate_answer_rrs:
            fail_if_none_matches_regexp: ['.*\tIN\tA\t.*']
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  serviceMonitor:
    enabled: true
    defaults:
      interval: 60s
      scrapeTimeout: 15s
    targets:
    - name: adguard-tkuipers-ca
      url: https://adguard.tkuipers.ca/

      module: http_authelia
      additionalMetricsRelabels:
        probe: external
        target_namespace: adguard-home
        target_service: adguard-home
    - name: agent-tkuipers-ca
      url: https://agent.tkuipers.ca/

      module: http_authelia
      additionalMetricsRelabels:
        probe: external
        target_namespace: homelab-agent
        target_service: homelab-agent
    - name: anki-tkuipers-ca
      url: https://anki.tkuipers.ca/sync/hostKey

      module: http_anki_sync
      additionalMetricsRelabels:
        probe: external
        target_namespace: anki
        target_service: anki
    - name: argo-tkuipers-ca
      url: https://argo.tkuipers.ca/

      module: http_public
      additionalMetricsRelabels:
        probe: external
        target_namespace: argocd
        target_service: argocd-server
    - name: auth-tkuipers-ca
      url: https://auth.tkuipers.ca/

      module: http_public
      additionalMetricsRelabels:
        probe: external
        target_namespace: authelia
        target_service: authelia
    - name: hamh-tkuipers-ca
      url: https://hamh.tkuipers.ca/

      module: http_authelia
      additionalMetricsRelabels:
        probe: external
        target_namespace: homeassistant
        target_service: hamh
    - name: home-tkuipers-ca
      url: https://home.tkuipers.ca/

      module: http_public
      additionalMetricsRelabels:
        probe: external
        target_namespace: homeassistant
        target_service: homeassistant
    - name: tkuipers-ca
      url: https://tkuipers.ca/

      module: http_public
      additionalMetricsRelabels:
        probe: external
        target_namespace: homepage
        target_service: homepage
    - name: resume-tkuipers-ca
      url: https://resume.tkuipers.ca/

      module: http_public
      additionalMetricsRelabels:
        probe: external
        target_namespace: homepage
        target_service: resume-proxy
    - name: bazarr-tkuipers-ca
      url: https://bazarr.tkuipers.ca/

      module: http_authelia
      additionalMetricsRelabels:
        probe: external
        target_namespace: mediacenter
        target_service: bazarr
    - name: jellyfin-tkuipers-ca
      url: https://jellyfin.tkuipers.ca/

      module: http_public
      additionalMetricsRelabels:
        probe: external
        target_namespace: mediacenter
        target_service: jellyfin
    - name: mediarequests-tkuipers-ca
      url: https://mediarequests.tkuipers.ca/

