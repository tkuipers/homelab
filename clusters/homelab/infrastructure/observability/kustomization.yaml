apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Plain manifests for the observability stack. The Helm charts live in the
# helm-chart-* directories and are deployed by their own ArgoCD Applications.
resources:
  - namespace.yaml
  - storage-pvs.yaml
  # Grafana secrets from 1Password - enabled by
  # tooling/scripts/setup-credentials/setup-observability-credentials.sh
  - secrets/external-secrets.yaml
  # Scrape configs for things not covered by their own charts
  - monitors/servicemonitors.yaml
  # Grafana dashboards (generated: tooling/observability/generate_dashboards.py)
  - dashboards
  # Grafana-managed alert rules (generated: tooling/observability/generate_alerts.py)
  - alerts/alert-rules.yaml
