# Tempo - trace storage. Traces arrive via Alloy (OTLP): ingress-nginx (one
# span per request), our own services (OpenTelemetry SDKs), Beyla (eBPF spans
# for third-party apps), Argo CD and Grafana.
tempo:
  fullnameOverride: tempo

  tempo:
    reportingEnabled: false
    # 8Gi budget (PV), 5 days. Check tempo disk use on the Tempo dashboard.
    retention: 120h
    metricsGenerator:
      enabled: true
      remoteWriteUrl: "http://kps-prometheus.observability.svc:9090/api/v1/write"
    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics
            # local-blocks backs TraceQL metrics queries (`| rate()` etc.,
            # used by Grafana's Traces Drilldown) over recent data.
            - local-blocks
          # namespace on span metrics / service graph series (label
          # k8s_namespace_name, like Loki): service names alone are ambiguous
          # (stocks "api", "postgres" in several namespaces)
          processor:
            span_metrics:
              dimensions: [k8s.namespace.name]
            service_graphs:
              dimensions: [k8s.namespace.name]
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 2Gi

  # hostPath volume is root owned; fsGroup does not apply to hostPath.
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0
    runAsNonRoot: false

  persistence:
    enabled: true
    enableStatefulSetAutoDeletePVC: false
    storageClassName: observability-hostpath
    size: 8Gi

  nodeSelector:
    kubernetes.io/hostname: dell-r620

  serviceMonitor:
    enabled: true
