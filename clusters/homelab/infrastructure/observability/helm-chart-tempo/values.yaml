# Tempo - trace storage. Traces arrive via Alloy (OTLP): ingress-nginx (one
# span per request), our own services (OpenTelemetry SDKs), Beyla (eBPF spans
# for third-party apps), Argo CD and Grafana.
tempo:
  fullnameOverride: tempo

  tempo:
    # The single-binary chart is frozen at 1.24.4 (appVersion 2.9.0); keep the 2.9 patches.
    tag: "2.9.5"
    reportingEnabled: false
    # 8Gi budget (PV), 5 days. Check tempo disk use on the Tempo dashboard.
    retention: 120h
    metricsGenerator:
      enabled: true
      remoteWriteUrl: "http://kps-prometheus.observability.svc:9090/api/v1/write"
    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics
            # local-blocks backs TraceQL metrics queries (`| rate()` etc.,
            # used by Grafana's Traces Drilldown) over recent data.
            - local-blocks
          # namespace on span metrics / service graph series (label
          # k8s_namespace_name, like Loki): service names alone are ambiguous
          # (stocks "api", "postgres" in several namespaces)
          processor:
            span_metrics:
              dimensions: [k8s.namespace.name]
            service_graphs:
              dimensions: [k8s.namespace.name]
    # (the chart's empty `opencensus:` default is dropped in `config` below)
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
    # Soft limit (~85% of the 4Gi limit): the Go GC works harder before the cgroup OOM.
    extraEnv:
      - name: GOMEMLIMIT
        value: 3400MiB
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        # hourly peaks are 1.5-1.85Gi (metrics-generator local-blocks + flushes);
        # 2Gi left too little room and it was OOM-killed on 2026-10-16
        memory: 4Gi

  # hostPath volume is root owned; fsGroup does not apply to hostPath.
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0
    runAsNonRoot: false

  persistence:
    enabled: true
    enableStatefulSetAutoDeletePVC: false
    storageClassName: observability-hostpath
    size: 8Gi

  nodeSelector:
    kubernetes.io/hostname: dell-r620

  serviceMonitor:
    enabled: true

  # The chart 1.24.4 config template, except that receivers go through `omit`:
  # its defaults have an empty `opencensus:` receiver that Helm 3 dropped, but
  # Helm 4 (Argo CD 3.5+) renders as `opencensus: null`, which Tempo rejects at
  # startup ("unknown type"). A null override doesn't remove it under Helm 4.2.
  config: |
      memberlist:
        cluster_label: "{{ .Release.Name }}.{{ .Release.Namespace }}"
      multitenancy_enabled: {{ .Values.tempo.multitenancyEnabled }}
      usage_report:
        reporting_enabled: {{ .Values.tempo.reportingEnabled }}
      compactor:
        compaction:
          block_retention: {{ .Values.tempo.retention }}
      distributor:
        receivers:
          {{- toYaml (omit .Values.tempo.receivers "opencensus") | nindent 8 }}
      ingester:
        {{- toYaml .Values.tempo.ingester | nindent 6 }}
      server:
        {{- toYaml .Values.tempo.server | nindent 6 }}
      storage:
        {{- toYaml .Values.tempo.storage | nindent 6 }}
      querier:
        {{- toYaml .Values.tempo.querier | nindent 6 }}
      query_frontend:
        {{- toYaml .Values.tempo.queryFrontend | nindent 6 }}
      overrides:
        {{- toYaml .Values.tempo.overrides | nindent 6 }}
        {{- if .Values.tempo.metricsGenerator.enabled }}
      metrics_generator:
        {{- if .Values.tempo.metricsGenerator.processor }}
        processor:
          {{- toYaml .Values.tempo.metricsGenerator.processor | nindent 8 }}
        {{- end }}
        {{- if .Values.tempo.metricsGenerator.registry }}
        registry:
          {{- toYaml .Values.tempo.metricsGenerator.registry | nindent 8 }}
        {{- end }}
        storage:
          path: {{ .Values.tempo.metricsGenerator.storage.path | quote }}
          {{- if .Values.tempo.metricsGenerator.storage.remote_write }}
          remote_write:
            {{- toYaml .Values.tempo.metricsGenerator.storage.remote_write | nindent 10 }}
          {{- else }}
          remote_write:
            - url: {{ .Values.tempo.metricsGenerator.remoteWriteUrl }}
          {{- end }}
        traces_storage:
          path: {{ .Values.tempo.metricsGenerator.traces_storage.path | quote }}
        {{- end }}
