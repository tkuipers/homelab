# Grafana credentials from 1Password ("Observability Credentials" item in the
# Homelab vault). NOT enabled yet: the cluster currently runs on temporary
# secrets created by hand. tooling/scripts/setup-credentials/
# setup-observability-credentials.sh stores the values in 1Password and
# enables this file in ../kustomization.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: "Observability Credentials"
        property: grafana-admin-user
    - secretKey: admin-password
      remoteRef:
        key: "Observability Credentials"
        property: grafana-admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: "Observability Credentials"
        property: grafana-oidc-client-secret
