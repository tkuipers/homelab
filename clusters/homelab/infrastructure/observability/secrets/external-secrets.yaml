# Grafana credentials from 1Password ("Observability Credentials" item in the
# Homelab vault), stored there by tooling/scripts/setup-credentials/
# setup-observability-credentials.sh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: admin-user
      remoteRef:
        key: "Observability Credentials"
        property: grafana-admin-user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: admin-password
      remoteRef:
        key: "Observability Credentials"
        property: grafana-admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-secret
      remoteRef:
        key: "Observability Credentials"
        property: grafana-oidc-client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Grafana's secret_key: encrypts what Grafana stores in its database
# (datasource passwords, ...). Changing it makes that data unreadable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-security
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: grafana-security
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: secret-key
      remoteRef:
        key: "Observability Credentials"
        property: grafana-secret-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Passwords of the read-only 'grafana_ro' DB users behind the Postgres/MySQL
# datasources (tooling/scripts/setup-credentials/setup-grafana-db-readonly.sh).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-datasources
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: grafana-datasources
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: pg-stocks-password
      remoteRef:
        key: "Observability Credentials"
        property: pg-stocks-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: pg-polymarket-password
      remoteRef:
        key: "Observability Credentials"
        property: pg-polymarket-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: mysql-stockguesser-password
      remoteRef:
        key: "Observability Credentials"
        property: mysql-stockguesser-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Bearer token Grafana and Alertmanager send with alert webhooks to the homelab
# agent (and its SMS relay). From the agent's 1Password item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-agent-webhook
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: homelab-agent-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: "Homelab Agent Credentials"
        property: webhook-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Home Assistant's /api/prometheus needs a token: the long-lived one the
# reconciler (and the agent's Home Assistant MCP) already use.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hass-prometheus
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: hass-prometheus
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: "Authelia Credentials"
        property: homeassistant_reconciler_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
