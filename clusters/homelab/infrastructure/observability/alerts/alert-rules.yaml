        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: stock-guesser/stock-guesser-app has no available replicas
          description: Check the service dashboard (Kubernetes events + logs rows) for why pods are not ready.
          dashboard: https://logs.tkuipers.ca/d/svc-stock-guesser-stock-guesser-app
        isPaused: false
      - uid: dd-stock-guesser-mysql-health
        title: Stock Guesser MySQL health
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: sum(kube_deployment_status_replicas_available{namespace="stock-guesser", deployment="mysql"})
