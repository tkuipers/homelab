      - uid: dd-argocd-sync-failures
        title: Argo CD apps out of sync
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: count(argocd_app_info{sync_status="OutOfSync"}) or vector(0)
            instant: true
