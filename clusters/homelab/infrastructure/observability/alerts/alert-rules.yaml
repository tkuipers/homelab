        annotations:
          summary: stock-guesser/mysql has no available replicas
          description: Check the service dashboard (Kubernetes events + logs rows) for why pods are not ready.
          dashboard: https://logs.tkuipers.ca/d/svc-stock-guesser-mysql
        isPaused: false
      - uid: dd-stock-guesser-latency
        title: Stock Guesser app slow / probes failing
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: sum(increase(prober_probe_total{namespace="stock-guesser", pod=~"stock-guesser-app-.*", result!="successful"}[5m])) or vector(0)
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 3
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Stock Guesser app is failing its probes
          description: Datadog port of stock-guesser-latency (APM avg request duration > 10s). APM is gone; probe failures/timeouts are the replacement signal.
          dashboard: https://logs.tkuipers.ca/d/svc-stock-guesser-stock-guesser-app
        isPaused: false
      - uid: dd-stock-guesser-errors
        title: Stock Guesser app error rate
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: loki
          model:
            refId: A
            expr: 100 * (sum(count_over_time({k8s_namespace_name="stock-guesser", service_name="stock-guesser-app"} | status >= 500 [5m])) or vector(0)) / sum(count_over_time({k8s_namespace_name="stock-guesser", service_name="stock-guesser-app"} | status != "" [5m]))
