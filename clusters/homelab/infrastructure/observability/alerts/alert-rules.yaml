        execErrState: Error
        for: 5m
        labels:
          severity: critical
          namespace: '{{ $labels.namespace }}'
          service: '{{ reReplaceAll "(-[a-z0-9]{8,10})?-[a-z0-9]{5}$|-[0-9]+$" "" $labels.pod }}'
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is crash looping'
