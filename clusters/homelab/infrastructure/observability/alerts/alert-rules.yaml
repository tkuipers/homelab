          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: lt
                params:
                - 1
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels:
          severity: critical
          namespace: homepage
        annotations:
          summary: homepage/homepage has no available replicas
          description: Check the service dashboard (Kubernetes events + logs rows) for why pods are not ready.
