            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: lt
                params:
                - 1
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels:
          severity: critical
          namespace: '{{ $$labels.target_namespace }}'
          service: '{{ $$labels.target_service }}'
        annotations:
          summary: '{{ $labels.instance }} is not reachable (DNS / ingress / TLS / Authelia)'
          description: 'The public hostname fails while the app''s own health check may still pass - suspect DNS (adguard, external-dns, aws-ip-updater), ingress-nginx, cert-manager or Authelia. Each host must answer like its class (blackbox module): http_public = 2xx after redirects, http_authelia = 302 to auth.tkuipers.ca; a 404 usually means the Ingress is gone.'
          dashboard: https://logs.tkuipers.ca/dashboards?tag={{ $labels.target_namespace }}
        isPaused: false
      - uid: hl-authelia-failed-logins
        title: 'Authelia: many failed logins'
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: sum(increase(authelia_authn{success="false"}[15m]))
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
