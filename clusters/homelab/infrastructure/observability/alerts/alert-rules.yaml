            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 0
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: A stock-guesser-training Job failed
          description: Datadog port (kubernetes_state.job.failed for the training CronJob over 1d).
          dashboard: https://logs.tkuipers.ca/d/svc-stock-guesser-stock-guesser-training
        isPaused: false
    - orgId: 1
      name: Homelab
      folder: Alerts
      interval: 1m
      rules:
      - uid: hl-probe-down
        title: Public endpoint down
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: min by (target_namespace, target_service, instance) (probe_success)
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: lt
                params:
                - 1
        noDataState: OK
        execErrState: Error
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.instance }} is not reachable from the cluster'
          description: Blackbox HTTPS probe (DNS + ingress + TLS + Authelia) failing. Open the service dashboard for {{ $labels.target_namespace }}/{{ $labels.target_service }}.
        isPaused: false
      - uid: hl-ingress-5xx
        title: Ingress 5xx ratio high
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: (sum by (exported_namespace, ingress) (rate(nginx_ingress_controller_requests{status=~"5.."}[10m])) / sum by (exported_namespace, ingress) (rate(nginx_ingress_controller_requests[10m]) > 0.01))
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 0.1
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.exported_namespace }}/{{ $labels.ingress }}: more than 10% 5xx'
          description: Ingress NGINX dashboard > 'Top 5xx paths' shows which paths fail; the service dashboard shows its logs.
        isPaused: false
      - uid: hl-crashloop
        title: Container crash looping
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError"})
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 0
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is crash looping'
          description: ''
        isPaused: false
      - uid: hl-oomkilled
        title: Container OOMKilled
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: max by (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}) * on (namespace, pod, container) group_left() (increase(kube_pod_container_status_restarts_total[15m]) > 0)
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 0
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was OOM killed'
          description: Memory panel on the service dashboard shows usage vs limit.
        isPaused: false
      - uid: hl-error-log-spike
        title: Error log spike
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: loki
          model:
            refId: A
            expr: sum by (k8s_namespace_name, service_name) (count_over_time({k8s_namespace_name=~".+", service_name!="kubernetes-events"} | detected_level=~"error|fatal|critical" [10m]))
            queryType: instant
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 100
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.k8s_namespace_name }}/{{ $labels.service_name }} logged >100 errors in 10m'
          description: Open the service dashboard > Logs and filter level=error.
        isPaused: false
      - uid: hl-cert-expiring
        title: TLS certificate expiring
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: min by (instance) ((probe_ssl_earliest_cert_expiry - time()) / 86400)
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: lt
                params:
                - 14
        noDataState: OK
        execErrState: Error
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Certificate for {{ $labels.instance }} expires in < 14 days
          description: cert-manager should renew at 30 days; check the cert-manager dashboard and its logs.
        isPaused: false
      - uid: hl-cronjob-stale
        title: CronJob has not succeeded recently
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: (time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time)) / 3600
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 50
        noDataState: OK
        execErrState: Error
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.cronjob }}: no successful run for > 50h'
          description: All homelab CronJobs run at least daily. Check the CronJob dashboard and failed Jobs on the overview.
        isPaused: false
      - uid: hl-workload-unavailable
        title: Deployment has unavailable replicas
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: max by (namespace, deployment) (kube_deployment_status_replicas_unavailable)
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 0
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas for 15m'
          description: ''
        isPaused: false
      - uid: hl-node-disk
        title: Node filesystem almost full
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: max by (instance, mountpoint) (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"})
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 0.85
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.instance }} {{ $labels.mountpoint }} is more than 85% full'
          description: ''
        isPaused: false
      - uid: hl-argocd-degraded
        title: Argo CD application degraded
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: max by (name, health_status) (argocd_app_info{health_status=~"Degraded|Missing"})
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 0
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Argo CD app {{ $labels.name }} is {{ $labels.health_status }}
          description: ''
        isPaused: false
      - uid: hl-externalsecret-failing
        title: ExternalSecret not syncing
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: max by (exported_namespace, name) (externalsecret_status_condition{condition="Ready", status="False"})
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 0
        noDataState: OK
        execErrState: Error
        for: 30m
        labels:
          severity: warning
