# GENERATED by tooling/observability/generate_alerts.py - do not edit by hand
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-rules
  namespace: observability
  labels:
    grafana_alert: '1'
data:
  homelab-alert-rules.yaml: |
    apiVersion: 1
    groups:
    - orgId: 1
      name: Ported from Datadog
      folder: Alerts
      interval: 1m
      rules:
      - uid: dd-homepage-pod-health
        title: Homepage pod health
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: sum(kube_deployment_status_replicas_available{namespace="homepage", deployment="homepage"})
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: lt
                params:
                - 1
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: homepage/homepage has no available replicas
          description: Check the service dashboard (Kubernetes events + logs rows) for why pods are not ready.
          dashboard: https://logs.tkuipers.ca/d/svc-homepage-homepage
        isPaused: false
      - uid: dd-homepage-http-errors
        title: Homepage HTTP 5xx rate
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: 100 * (sum(rate(nginx_ingress_controller_requests{exported_namespace="homepage", status=~"5.."}[5m])) or vector(0)) / (sum(rate(nginx_ingress_controller_requests{exported_namespace="homepage"}[5m])) > 0)
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 10
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: More than 10% of homepage requests return 5xx
          description: 'Datadog port: nginx 5xx / total * 100 > 10 over 5m. Source is now the ingress-nginx metrics.'
          dashboard: https://logs.tkuipers.ca/d/svc-homepage-homepage
        isPaused: false
      - uid: dd-argocd-server-health
