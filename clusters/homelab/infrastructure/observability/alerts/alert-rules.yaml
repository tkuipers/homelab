            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: min by (entity, friendly_name) (hass_sensor_battery_percent)
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: lt
                params:
                - 15
        noDataState: OK
        execErrState: Error
        for: 6h
        labels:
          severity: warning
          namespace: homeassistant
        annotations:
          summary: '{{ $labels.friendly_name }} battery at {{ $values.B }}%'
          description: Replace or charge it before the device drops off (Home Assistant dashboard > Lowest batteries).
          dashboard: https://logs.tkuipers.ca/d/svc-homeassistant-homeassistant
        isPaused: false
