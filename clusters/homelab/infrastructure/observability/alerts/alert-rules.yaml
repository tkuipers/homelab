            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 10
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
          namespace: authelia
        annotations:
          summary: '{{ $values.B }} failed Authelia logins in 15m'
          description: Brute force or a broken auth backend. Authelia dashboard > 'Failed logins / bans'.
          dashboard: https://logs.tkuipers.ca/dashboards?tag=authelia
        isPaused: false
      - uid: hl-ingress-5xx
        title: Ingress 5xx ratio high
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: (sum by (exported_namespace, ingress) (rate(nginx_ingress_controller_requests{status=~"5.."}[5m])) / sum by (exported_namespace, ingress) (rate(nginx_ingress_controller_requests[5m]) > 0.01))
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 0.1
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
          namespace: '{{ $$labels.exported_namespace }}'
          service: '{{ $$labels.ingress }}'
        annotations:
          summary: '{{ $labels.exported_namespace }}/{{ $labels.ingress }}: more than 10% 5xx'
          description: Ingress NGINX dashboard > 'Top 5xx paths' shows which paths fail; the service dashboard shows its logs.
          dashboard: https://logs.tkuipers.ca/dashboards?tag={{ $labels.exported_namespace }}
        isPaused: false
      - uid: hl-crashloop
        title: Container crash looping
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError"})
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 0
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
          namespace: '{{ $$labels.namespace }}'
          service: '{{ reReplaceAll "(-[a-z0-9]{8,10})?-[a-z0-9]{5}$|-[0-9]+$" "" $$labels.pod }}'
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is crash looping'
          description: ''
          dashboard: https://logs.tkuipers.ca/dashboards?tag={{ $labels.namespace }}
        isPaused: false
      - uid: hl-oomkilled
        title: Container OOMKilled
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: max by (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}) * on (namespace, pod, container) group_left() (increase(kube_pod_container_status_restarts_total[15m]) > 0)
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
