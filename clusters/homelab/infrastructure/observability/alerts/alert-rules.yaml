        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 20% of Stock Guesser requests fail (5xx)
          description: Datadog port of stock-guesser-errors (APM errors/hits > 20%). Now computed from the app's access logs in Loki.
          dashboard: https://logs.tkuipers.ca/d/svc-stock-guesser-stock-guesser-app
        isPaused: false
      - uid: dd-stock-guesser-training-failures
