          summary: Loki has received no logs in 10 minutes
          description: ''
          dashboard: https://logs.tkuipers.ca/d/svc-observability-loki
        isPaused: false
    - orgId: 1
      name: Homelab agent
      folder: Alerts
      interval: 1m
      rules:
      - uid: agent-down
        title: Homelab agent down
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: sum(kube_deployment_status_replicas_available{namespace="homelab-agent", deployment="homelab-agent"})
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: lt
                params:
                - 1
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels:
          severity: critical
          namespace: homelab-agent
          notify: relay
        annotations:
          summary: homelab-agent/homelab-agent has no available replicas
          description: Check the service dashboard (Kubernetes events + logs rows) for why pods are not ready.
          dashboard: https://logs.tkuipers.ca/d/svc-homelab-agent-homelab-agent
        isPaused: false
      - uid: agent-component-down
        title: Homelab agent part down
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: min by (component) (homelab_agent_component_up)
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: lt
                params:
                - 1
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
          namespace: homelab-agent
          notify: agent-self
        annotations:
          summary: 'Homelab agent: {{ $labels.component }} is failing its health check'
          description: Settings > Health in https://agent.tkuipers.ca shows details; the agent dashboard has the timeline.
          dashboard: https://logs.tkuipers.ca/dashboards?tag=homelab-agent
        isPaused: false
      - uid: agent-mcp-down
        title: Homelab agent MCP server down
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: min by (server) (homelab_agent_mcp_up)
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: lt
                params:
                - 1
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
          namespace: homelab-agent
          notify: agent-self
        annotations:
          summary: MCP server {{ $labels.server }} isn't answering the agent's probe
          description: Test it at https://agent.tkuipers.ca/#/mcp
          dashboard: https://logs.tkuipers.ca/dashboards?tag=homelab-agent
        isPaused: false
      - uid: agent-signed-out
        title: Homelab agent not signed in to Claude
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: max(homelab_agent_signed_in)
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: lt
                params:
                - 1
        noDataState: OK
        execErrState: Error
        for: 30m
        labels:
          severity: warning
          namespace: homelab-agent
          notify: agent-self
        annotations:
          summary: The homelab agent has been signed out of Claude for 30 minutes
          description: Sign in at https://agent.tkuipers.ca/#/auth
          dashboard: https://logs.tkuipers.ca/dashboards?tag=homelab-agent
        isPaused: false
      - uid: agent-queue-stuck
        title: Homelab agent queue stuck
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: max(homelab_agent_oldest_queued_seconds)
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 1800
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
          namespace: homelab-agent
          notify: agent-self
        annotations:
          summary: A conversation has waited over 30 minutes for a slot
          description: 'All slots busy: see https://agent.tkuipers.ca (Working now).'
          dashboard: https://logs.tkuipers.ca/dashboards?tag=homelab-agent
        isPaused: false
      - uid: agent-professor-grading-failing
        title: Study grading checks failing
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 1800
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: sum(increase(homelab_agent_professor_claude_total{purpose=~"accuracy|typed",ok="false"}[30m])) or vector(0)
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 0
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
          namespace: homelab-agent
          notify: agent-self
        annotations:
          summary: Claude's accuracy check or typed-answer matching on the Study page failed
          description: 'Grading accuracy is a hard rule for the Professor: his writing went to her marked "Not checked" (or a typed answer could not be matched). See the homelab-agent logs for "professor accuracy check failed" / "typed answer match failed".'
          dashboard: https://logs.tkuipers.ca/dashboards?tag=homelab-agent
        isPaused: false
      - uid: agent-professor-fillers-failing
        title: Professor filler batches failing
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 3600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: sum(increase(homelab_agent_professor_filler_batches_total{ok="false"}[1h])) or vector(0)
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 2
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
          namespace: homelab-agent
          notify: agent-self
        annotations:
          summary: The Professor's filler line batches keep failing
          description: More than 2 filler batches failed in the last hour (her model returned no lines). See "professor filler batch failed" in the homelab-agent logs.
          dashboard: https://logs.tkuipers.ca/dashboards?tag=homelab-agent
        isPaused: false
      - uid: agent-scan-overdue
        title: Homelab agent daily scan overdue
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: time() - max(homelab_agent_last_scan_timestamp_seconds)
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 108000
        noDataState: OK
        execErrState: Error
        for: 30m
        labels:
          severity: warning
          namespace: homelab-agent
          notify: agent-self
        annotations:
          summary: The homelab agent's daily scan hasn't finished for {{ humanizeDuration $values.B.Value }}
          description: 'Agent web UI: https://agent.tkuipers.ca (Claude signed in? runs stuck?)'
          dashboard: https://logs.tkuipers.ca/dashboards?tag=homelab-agent
        isPaused: false
    deleteRules:
    - orgId: 1
      uid: hl-probe-down
  homelab-notifications.yaml: |
    apiVersion: 1
    contactPoints:
    - orgId: 1
      name: homelab-agent
      receivers:
      - uid: homelab-agent
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://homelab-agent.homelab-agent.svc/hooks/grafana
          authorization_scheme: Bearer
          authorization_credentials: $AGENT_WEBHOOK_TOKEN
          httpMethod: POST
    - orgId: 1
      name: homelab-agent-relay
      receivers:
      - uid: homelab-agent-relay
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://homelab-agent-relay.homelab-agent.svc/hooks/grafana
          authorization_scheme: Bearer
          authorization_credentials: $AGENT_WEBHOOK_TOKEN
          httpMethod: POST
    policies:
    - orgId: 1
      receiver: homelab-agent
      group_by:
      - grafana_folder
      - alertname
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
      - receiver: homelab-agent-relay
        object_matchers:
        - - notify
          - '='
          - relay
        repeat_interval: 6h
      - receiver: homelab-agent
        object_matchers:
        - - notify
          - '='
          - agent-self
        repeat_interval: 1h
