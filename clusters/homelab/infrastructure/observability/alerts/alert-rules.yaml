      - uid: hl-arr-health
        title: '*arr health check failing'
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            refId: A
            expr: max by (job) (sonarr_system_health_issues or radarr_system_health_issues or readarr_system_health_issues or prowlarr_system_health_issues)
            instant: true
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: last
            settings:
              mode: dropNN
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 0
        noDataState: OK
        execErrState: Error
