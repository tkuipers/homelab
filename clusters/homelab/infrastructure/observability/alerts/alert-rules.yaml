        for: 5m
        labels:
          severity: critical
        annotations:
          summary: ingress-nginx/infrastructure-ingress-nginx-controller has no available replicas
          description: Check the service dashboard (Kubernetes events + logs rows) for why pods are not ready.
          dashboard: https://logs.tkuipers.ca/d/svc-ingress-nginx-infrastructur-15969e20
