apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: ingress-nginx
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
      version: ">=4.0.0"
  install:
    createNamespace: true
  targetNamespace: ingress-nginx
  values:
    controller:
      service:
        type: LoadBalancer
        # Expose additional TCP ports
        ports:
          http: 80
          https: 443
          smb: 445
        targetPorts:
          http: http
          https: https
          smb: 445
      ingressClassResource:
        name: nginx
        enabled: true
      admissionWebhooks:
        enabled: true
        patch:
          enabled: true
        certManager:
          enabled: false
        # Disable strict path validation to allow ACME challenges
        annotations:
          nginx.ingress.kubernetes.io/enable-annotation-validation: "false"
        # Set failure policy to Ignore for ACME challenges
        failurePolicy: Ignore
      # Enable TCP services
      config:
        strict-validate-path-type: "false"
      # Reference the TCP services ConfigMap
      extraArgs:
        tcp-services-configmap: ingress-nginx/tcp-services
    rbac:
      create: true
      scope: false 