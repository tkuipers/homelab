apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: ingress-nginx
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
      version: ">=4.0.0"
  install:
    createNamespace: true
  targetNamespace: ingress-nginx
  values:
    controller:
      service:
        type: LoadBalancer
      ingressClassResource:
        name: nginx
        enabled: true
      admissionWebhooks:
        enabled: true
        patch:
          enabled: true
        certManager:
          enabled: false
    rbac:
      create: true
      scope: false 