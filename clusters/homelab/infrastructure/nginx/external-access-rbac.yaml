---
# Service Account for external kubectl access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-kubectl-access
  namespace: kube-system
---
# ClusterRoleBinding to give cluster-admin permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-kubectl-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: external-kubectl-access
  namespace: kube-system
---
# Secret to create a long-lived token
apiVersion: v1
kind: Secret
metadata:
  name: external-kubectl-access-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: external-kubectl-access
type: kubernetes.io/service-account-token 