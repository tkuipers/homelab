---
# Service pointing to the API server
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-api-proxy
  namespace: ingress-nginx
spec:
  type: ExternalName
  externalName: 172.16.0.50
  ports:
  - port: 6443
    targetPort: 6443
    protocol: TCP
    name: https
---
# Certificate for k8s.tkuipers.ca
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k8s-tkuipers-ca-tls
  namespace: ingress-nginx
spec:
  secretName: k8s-tkuipers-ca-tls
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
  - k8s.tkuipers.ca
---
# Ingress with Let's Encrypt TLS termination
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-api-proxy
  namespace: ingress-nginx
  annotations:
    # Backend protocol is HTTPS since we're connecting to the API server
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    # Disable SSL verification for the backend connection (to avoid certSANs issues)
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    # Increase proxy timeouts for long-running kubectl operations
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Let's Encrypt certificate
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - k8s.tkuipers.ca
    secretName: k8s-tkuipers-ca-tls
  rules:
  - host: k8s.tkuipers.ca
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kubernetes-api-proxy
            port:
              number: 6443 