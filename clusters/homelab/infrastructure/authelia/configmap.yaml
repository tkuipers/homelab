apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
data:
  configuration.yml: |
    ---
    theme: dark
    default_2fa_method: totp
    
    server:
      address: tcp://0.0.0.0:9091
      asset_path: /assets
      endpoints:
        authz:
          auth-request:
            implementation: AuthRequest
      headers:
        csp_template: ""
      buffers:
        read: 4096
        write: 4096
      timeouts:
        read: 6s
        write: 6s
        idle: 30s
    
    log:
      level: info
      format: json
      file_path: ""
      keep_stdout: true
    
    telemetry:
      metrics:
        enabled: true
        address: tcp://0.0.0.0:9959
        buffers:
          read: 4096
          write: 4096
        timeouts:
          read: 6s
          write: 6s
          idle: 30s
    
    totp:
      disable: false
      issuer: auth.tkuipers.ca
      algorithm: sha1
      digits: 6
      period: 30
      skew: 1
      secret_size: 32
    
    webauthn:
      disable: false
      display_name: T. Kuipers Auth
      attestation_conveyance_preference: indirect
      timeout: 60s
      selection_criteria:
        user_verification: preferred
    
    authentication_backend:
      password_reset:
        disable: false
      refresh_interval: 5m
      file:
        path: /config/users_database.yml
        watch: true
        password:
          algorithm: argon2
          argon2:
            variant: argon2id
            iterations: 3
            memory: 65536
            parallelism: 4
            key_length: 32
            salt_length: 16
    
    access_control:
      default_policy: deny
      networks:
        - name: cluster_pods
          networks:
            - 10.244.0.0/16
        - name: cluster_services
          networks:
            - 10.96.0.0/12
      rules:
        # Bypass auth for API paths from cluster networks (inter-service communication)
        - domain: "*.tkuipers.ca"
          resources:
            - "^/api.*"
          networks:
            - cluster_pods
            - cluster_services
          policy: bypass
        # Jellyfin and ArgoCD - 1FA only (for client compatibility)
        - domain: "jellyfin.tkuipers.ca"
          policy: one_factor
        - domain: "argo.tkuipers.ca"
          policy: one_factor
        # Require 2FA for all other protected services
        - domain: "*.tkuipers.ca"
          policy: two_factor
    
    session:
      cookies:
        - name: authelia_session
          domain: tkuipers.ca
          authelia_url: https://auth.tkuipers.ca
          same_site: lax
          expiration: 1h
          inactivity: 5m
          remember_me: 1M
      redis:
        host: authelia-redis
        port: 6379
        database_index: 0
    
    regulation:
      max_retries: 3
      find_time: 2m
      ban_time: 5m
    
    storage:
      local:
        path: /config/db.sqlite3
    
    notifier:
      disable_startup_check: true
      filesystem:
        filename: /config/notification.txt
    
    identity_providers:
      oidc:
        hmac_secret:
          path: /secrets/oidc-hmac-secret
        jwks:
          - key:
              path: /secrets/oidc-issuer-private-key
        cors:
          endpoints:
            - authorization
            - token
            - revocation
            - introspection
            - userinfo
          allowed_origins_from_client_redirect_uris: true
        clients:
          - client_id: 'argocd'
            client_name: 'Argo CD'
            client_secret:
              path: /secrets/argocd-client-secret-hash
            public: false
            authorization_policy: 'one_factor'
            require_pkce: false
            redirect_uris:
              - 'https://argo.tkuipers.ca/auth/callback'
            scopes:
              - 'openid'
              - 'groups'
              - 'email'
              - 'profile'
            response_types:
              - 'code'
            grant_types:
              - 'authorization_code'
            access_token_signed_response_alg: 'none'
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'client_secret_basic'
          - client_id: 'argocd-cli'
            client_name: 'Argo CD (CLI)'
            public: true
            authorization_policy: 'one_factor'
            require_pkce: true
            pkce_challenge_method: 'S256'
            redirect_uris:
              - 'http://localhost:8085/auth/callback'
            scopes:
              - 'openid'
              - 'offline_access'
              - 'groups'
              - 'email'
              - 'profile'
            response_types:
              - 'code'
            grant_types:
              - 'authorization_code'
              - 'refresh_token'
            access_token_signed_response_alg: 'none'
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'none'

