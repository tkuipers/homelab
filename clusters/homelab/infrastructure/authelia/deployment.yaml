apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: authelia
  labels:
    app: authelia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      containers:
      - name: authelia
        image: authelia/authelia:4.39.28
        ports:
        - containerPort: 9091
          name: http
        - containerPort: 9959
          name: metrics
        env:
        - name: AUTHELIA_LOG_LEVEL
          value: "info"
        - name: AUTHELIA_LOG_FORMAT
          value: "json"
        - name: TZ
          value: "America/Edmonton"
        - name: AUTHELIA_STORAGE_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: authelia-secrets
              key: storage-encryption-key
        - name: AUTHELIA_SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: authelia-secrets
              key: session-secret
        - name: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: authelia-secrets
              key: jwt-secret
        # OIDC secrets (using _FILE suffix pointing to mounted secret files)
        - name: AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE
          value: /app/secrets/oidc-hmac-secret
        # issuer key: identity_providers.oidc.jwks in the configmap (template filter)
        - name: X_AUTHELIA_CONFIG_FILTERS
          value: template
        volumeMounts:
        - name: config
          mountPath: /config/configuration.yml
          subPath: configuration.yml
          readOnly: true
        - name: users
          mountPath: /config/users_database.yml
          subPath: users_database.yml
          readOnly: true
        - name: branding
          mountPath: /assets
          readOnly: true
        - name: oidc-secrets
          mountPath: /app/secrets
          readOnly: true
        - name: data
          mountPath: /config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 9091
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: 9091
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: config
        configMap:
          name: authelia-config
      - name: users
        secret:
          secretName: authelia-secrets
          items:
            - key: users_database.yml
              path: users_database.yml
      - name: branding
        configMap:
          name: authelia-branding
      - name: oidc-secrets
        secret:
          secretName: authelia-secrets
          items:
            - key: oidc-hmac-secret
              path: oidc-hmac-secret
            - key: oidc-issuer-private-key
              path: oidc-issuer-private-key
      - name: data
        hostPath:
          path: /var/persist/authelia-data
          type: DirectoryOrCreate

