# Authentik Helm Chart Values
# Configured for external PostgreSQL and Redis

global:
  # Datadog labels
  additionalLabels:
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: authentik

  # Pod annotations for Datadog
  podAnnotations:
    ad.datadoghq.com/authentik.logs: '[{"source":"authentik","service":"authentik"}]'
    ad.datadoghq.com/authentik.check_names: '["http_check"]'
    ad.datadoghq.com/authentik.init_configs: '[{}]'
    ad.datadoghq.com/authentik.instances: '[{"name":"authentik","url":"http://%%host%%:9000/if/flow/initial-setup/","timeout":1}]'

  # Node selector to pin to omen-worker1
  nodeSelector:
    kubernetes.io/hostname: omen-worker1

  # Security context
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

# Authentik configuration
authentik:
  # Secret key - must be provided directly or via valueFrom
  secret_key: "652ZyKJ6hfw7vGW4J1cFshBgP6rkKb3TCj/69u7F59Y="
  
  # Bootstrap credentials
  bootstrap_password: "niaq7VpzX3Lintz9HJhjy24NZ9yQsbJA"
  bootstrap_token: "c453a3bf5c572d247da9c4cfba8ac771"
  bootstrap_email: "tkuipers123@gmail.com"
  
  # External PostgreSQL configuration
  postgresql:
    host: "authentik-postgresql"
    port: 5432
    name: "authentik"
    user: "authentik"
    password: "hmJIJyDAvnAvAyxr2yph5y2MePhlm76"
  
  # External Redis configuration
  redis:
    host: "authentik-redis"
    port: 6379
  
  # External hostname
  host: "https://auth.tkuipers.ca"
  host_https: true
  
  error_reporting:
    enabled: false

# Disable embedded PostgreSQL - using external
postgresql:
  enabled: false

# Configuration will be loaded from infrastructure-authentik secret via envFrom
# Secret is managed by authentik-chart-secret-sync ExternalSecret

# Server configuration
server:
  enabled: true
  replicas: 1

  # Resources
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  # Additional environment variables
  env:
    - name: AUTHENTIK_DISABLE_UPDATE_CHECK
      value: "true"
    - name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS
      value: "true"

  # Service configuration
  service:
    type: ClusterIP
    port: 9000

# Worker configuration
worker:
  enabled: true
  replicas: 1

  # Resources
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Additional environment variables
  env:
    - name: AUTHENTIK_DISABLE_UPDATE_CHECK
      value: "true"
    - name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS
      value: "true"

# Web configuration
web:
  enabled: true
  path: /

# Email configuration (optional, can be configured later)
email:
  host: ""
  port: 587
  username: ""
  password: ""
  use_tls: false
  use_ssl: false
  from: ""

# Ingress will be created separately via ingress.yaml

