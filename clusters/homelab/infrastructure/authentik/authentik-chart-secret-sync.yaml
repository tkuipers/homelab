apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-chart-secret-sync
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: infrastructure-authentik
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    # External hostname
    - secretKey: AUTHENTIK_HOST
      remoteRef:
        key: "Authentik Credentials"
        property: external_host
    - secretKey: AUTHENTIK_HOST_HTTPS
      remoteRef:
        key: "Authentik Credentials"
        property: external_host_https
    # PostgreSQL connection - use individual mappings to avoid templates
    - secretKey: AUTHENTIK_POSTGRESQL__HOST
      remoteRef:
        key: "Authentik Credentials"
        property: postgresql_host
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: "Authentik PostgreSQL"
        property: password
    # Secret key
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: "Authentik Credentials"
        property: secret_key
    # Redis configuration
    - secretKey: AUTHENTIK_REDIS__HOST
      remoteRef:
        key: "Authentik Credentials"
        property: redis_host
    - secretKey: AUTHENTIK_REDIS__PORT
      remoteRef:
        key: "Authentik Credentials"
        property: redis_port
    # Bootstrap configuration
    - secretKey: AUTHENTIK_BOOTSTRAP__EMAIL
      remoteRef:
        key: "Authentik Credentials"
        property: bootstrap_email
    - secretKey: AUTHENTIK_BOOTSTRAP__PASSWORD
      remoteRef:
        key: "Authentik Credentials"
        property: bootstrap_password
    - secretKey: AUTHENTIK_BOOTSTRAP__TOKEN
      remoteRef:
        key: "Authentik Credentials"
        property: bootstrap_token

