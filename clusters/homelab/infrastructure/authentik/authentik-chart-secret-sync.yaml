apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-chart-secret-sync
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: infrastructure-authentik
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    # Authentik configuration keys (Helm chart format)
    - secretKey: secret_key
      remoteRef:
        key: "Authentik Credentials"
        property: secret_key
    - secretKey: bootstrap_password
      remoteRef:
        key: "Authentik Credentials"
        property: bootstrap_password
    - secretKey: bootstrap_token
      remoteRef:
        key: "Authentik Credentials"
        property: bootstrap_token
    # PostgreSQL credentials
    - secretKey: postgresql__user
      remoteRef:
        key: "Authentik PostgreSQL"
        property: username
    - secretKey: postgresql__password
      remoteRef:
        key: "Authentik PostgreSQL"
        property: password

