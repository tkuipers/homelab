apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-chart-secret-sync
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: infrastructure-authentik
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      type: Opaque
      stringData:
        # PostgreSQL connection (override chart's default hostname)
        AUTHENTIK_POSTGRESQL__HOST: "authentik-postgresql"
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .postgresql_password }}"
        # Secret key
        AUTHENTIK_SECRET_KEY: "{{ .secret_key }}"
        # Redis configuration
        AUTHENTIK_REDIS__HOST: "authentik-redis"
        AUTHENTIK_REDIS__PORT: "6379"
        # Bootstrap configuration
        AUTHENTIK_BOOTSTRAP__EMAIL: "tkuipers123@gmail.com"
        AUTHENTIK_BOOTSTRAP__PASSWORD: "{{ .bootstrap_password }}"
        AUTHENTIK_BOOTSTRAP__TOKEN: "{{ .bootstrap_token }}"
  data:
    # PostgreSQL password
    - secretKey: postgresql_password
      remoteRef:
        key: "Authentik PostgreSQL"
        property: password
    # Secret key
    - secretKey: secret_key
      remoteRef:
        key: "Authentik Credentials"
        property: secret_key
    # Bootstrap password
    - secretKey: bootstrap_password
      remoteRef:
        key: "Authentik Credentials"
        property: bootstrap_password
    # Bootstrap token
    - secretKey: bootstrap_token
      remoteRef:
        key: "Authentik Credentials"
        property: bootstrap_token

