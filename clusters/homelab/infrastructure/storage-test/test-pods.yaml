# Test pod for control plane storage (dell-r620)
---
apiVersion: v1
kind: Pod
metadata:
  name: storage-test-controlplane
  namespace: storage-test
spec:
  nodeSelector:
    kubernetes.io/hostname: dell-r620
  containers:
  - name: test-container
    image: alpine:latest
    command: ["/bin/sh"]
    args: ["-c", "while true; do echo 'Storage test running on dell-r620...'; sleep 30; done"]
    volumeMounts:
    - name: storage-volume
      mountPath: /data
  volumes:
  - name: storage-volume
    hostPath:
      path: /var/local/nfs-controlplane
      type: DirectoryOrCreate
  restartPolicy: Always
---
# Test pod for worker storage (omen-worker1)  
apiVersion: v1
kind: Pod
metadata:
  name: storage-test-worker
  namespace: storage-test
spec:
  nodeSelector:
    kubernetes.io/hostname: omen-worker1
  containers:
  - name: test-container
    image: alpine:latest
    command: ["/bin/sh"]
    args: ["-c", "while true; do echo 'Storage test running on omen-worker1...'; sleep 30; done"]
    volumeMounts:
    - name: storage-volume
      mountPath: /data
  volumes:
  - name: storage-volume
    hostPath:
      path: /var/local/nfs-worker
      type: DirectoryOrCreate
  restartPolicy: Always 