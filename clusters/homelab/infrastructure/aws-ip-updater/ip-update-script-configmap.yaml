apiVersion: v1
kind: ConfigMap
metadata:
  name: ip-update-script
  namespace: aws-ip-updater
data:
  update-ip.sh: |
    #!/bin/bash
    set -euo pipefail
    
    echo "$(date): Starting AWS IP update process..."
    
    # Debug: Show AWS configuration (without secrets)
    echo "=== Debug Information ==="
    echo "AWS CLI version: $(aws --version)"
    echo "AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:0:4}****"
    echo "AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION"
    echo "HOSTED_ZONE_ID: $HOSTED_ZONE_ID"
    echo "RECORD_NAME: $RECORD_NAME"
    echo
    
    # Test AWS credentials
    echo "Testing AWS credentials..."
    if aws sts get-caller-identity; then
        echo "✓ AWS credentials are valid"
    else
        echo "✗ AWS credentials failed"
        exit 1
    fi
    echo
    
    # Get current public IP
    echo "Getting current public IP..."
    CURRENT_IP=$(curl -s https://ipv4.icanhazip.com/ || curl -s https://checkip.amazonaws.com/ || curl -s https://api.ipify.org/)
    
    if [[ ! "$CURRENT_IP" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
        echo "ERROR: Failed to get valid public IP address. Got: $CURRENT_IP"
        exit 1
    fi
    
    echo "Current public IP: $CURRENT_IP"
    
    # Parse comma-separated record names
    IFS=',' read -ra RECORD_NAMES <<< "$RECORD_NAME"
    
    # Remove any whitespace from record names
    for i in "${!RECORD_NAMES[@]}"; do
        RECORD_NAMES[i]=$(echo "${RECORD_NAMES[i]}" | xargs)
    done
    
    echo "Will update ${#RECORD_NAMES[@]} DNS record(s): ${RECORD_NAMES[*]}"
    
    # Check if any records need updating
    NEED_UPDATE=false
    CHANGES_JSON=""
    
    for record_name in "${RECORD_NAMES[@]}"; do
        echo "Checking DNS record for: $record_name"
        
        # Debug: Show the exact command being run
        echo "  Running: aws route53 list-resource-record-sets --hosted-zone-id '$HOSTED_ZONE_ID' --query \"ResourceRecordSets[?Name=='$record_name.' && Type=='A'].ResourceRecords[0].Value\" --output text"
        
        # Debug: For wildcard records, show what Route53 actually returns
        if [[ "$record_name" == *"*"* ]]; then
            echo "  Debug: Listing all A records to check wildcard handling:"
            aws route53 list-resource-record-sets \
                --hosted-zone-id "$HOSTED_ZONE_ID" \
                --query "ResourceRecordSets[?Type=='A'].{Name:Name,Value:ResourceRecords[0].Value}" \
                --output table
        fi
        
        # Get current DNS record IP
        # Handle Route53's octal encoding of asterisk (* becomes \052)
        QUERY_NAME="$record_name"
        if [[ "$record_name" == *"*"* ]]; then
            # Also check for the octal representation
            OCTAL_NAME="${record_name//\*/\\052}"
            echo "  Also checking octal representation: $OCTAL_NAME"
            CURRENT_DNS_IP=$(aws route53 list-resource-record-sets \
                --hosted-zone-id "$HOSTED_ZONE_ID" \
                --query "ResourceRecordSets[?(Name=='$record_name.' || Name=='$OCTAL_NAME.') && Type=='A'].ResourceRecords[0].Value" \
                --output text)
        else
            CURRENT_DNS_IP=$(aws route53 list-resource-record-sets \
                --hosted-zone-id "$HOSTED_ZONE_ID" \
                --query "ResourceRecordSets[?Name=='$record_name.' && Type=='A'].ResourceRecords[0].Value" \
                --output text)
        fi
        
        if [ "$CURRENT_DNS_IP" = "None" ] || [ -z "$CURRENT_DNS_IP" ]; then
            echo "  No existing A record found for $record_name - will create"
            NEED_UPDATE=true
        elif [ "$CURRENT_IP" != "$CURRENT_DNS_IP" ]; then
            echo "  Current DNS IP ($CURRENT_DNS_IP) differs from public IP ($CURRENT_IP) - will update"
            NEED_UPDATE=true
        else
            echo "  DNS IP matches public IP - no update needed for $record_name"
        fi
        
        # Add this record to the changes batch
        if [ -n "$CHANGES_JSON" ]; then
            CHANGES_JSON="$CHANGES_JSON,"
        fi
        
        CHANGES_JSON="$CHANGES_JSON
            {
                \"Action\": \"UPSERT\",
                \"ResourceRecordSet\": {
                    \"Name\": \"$record_name\",
                    \"Type\": \"A\",
                    \"TTL\": 300,
                    \"ResourceRecords\": [
                        {
                            \"Value\": \"$CURRENT_IP\"
                        }
                    ]
                }
            }"
    done
    
    if [ "$NEED_UPDATE" = "false" ]; then
        echo "All DNS records are up to date. No changes needed."
        exit 0
    fi
    
    echo "DNS records need updating. Submitting batch change..."
    
    # Create the change batch JSON
    CHANGE_BATCH=$(cat <<EOF
    {
        "Comment": "Automatic IP update $(date) - Updated ${#RECORD_NAMES[@]} record(s)",
        "Changes": [$CHANGES_JSON
        ]
    }
    EOF
    )
    
    # Update the DNS records
    echo "Updating Route53 records..."
    CHANGE_ID=$(aws route53 change-resource-record-sets \
        --hosted-zone-id "$HOSTED_ZONE_ID" \
        --change-batch "$CHANGE_BATCH" \
        --query 'ChangeInfo.Id' \
        --output text)
    
    echo "Route53 change submitted with ID: $CHANGE_ID"
    
    # Wait for the change to propagate
    echo "Waiting for change to propagate..."
    aws route53 wait resource-record-sets-changed --id "$CHANGE_ID"
    
    echo "$(date): Successfully updated ${#RECORD_NAMES[@]} DNS record(s) to IP $CURRENT_IP"
    for record_name in "${RECORD_NAMES[@]}"; do
        echo "  - $record_name"
    done 