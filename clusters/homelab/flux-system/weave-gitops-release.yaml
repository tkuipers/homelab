apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: weave-gitops
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: weave-gitops
      sourceRef:
        kind: HelmRepository
        name: weaveworks-charts
        namespace: flux-system
      version: ">=4.0.0"  # Optional: pin a version range
  values:
    adminUser:
      create: true
      username: admin
      passwordHash: "$2y$10$RwbmAxnTXmTVIdZiFyhrcOz0Rpi0h9MWxe3G5sBKF/qcMB0QaT5YG"  # bcrypt hash
    ingress:
      enabled: true
      className: "nginx"
      hosts:
        - host: flux.tkuipers.ca
          paths:
            - path: /
              pathType: ImplementationSpecific 