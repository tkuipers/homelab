apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: weave-gitops
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: weave-gitops
      sourceRef:
        kind: HelmRepository
        name: weave-gitops
      version: ">=4.0.0"
  values:
    ingress:
      enabled: true
      className: "nginx"
      hosts:
        - host: flux.tkuipers.ca
          paths:
            - path: /
              pathType: ImplementationSpecific 