apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # The homelab repository is the Secret argocd-git-ssh (secret-type: repository,
  # built by argocd-externalsecret-git-ssh.yaml).

  # Resource tracking method
  application.resourceTrackingMethod: annotation

  # Enable status badge
  statusbadge.enabled: "true"

  # Authelia OIDC configuration
  url: https://argo.tkuipers.ca
  oidc.config: |
    name: Authelia
    issuer: https://auth.tkuipers.ca
    clientID: argocd
    clientSecret: $oidc.authelia.clientSecret
    cliClientID: argocd-cli
    requestedScopes:
      - openid
      - email
      - groups
      - profile
    enableUserInfoGroups: true
    userInfoPath: /api/oidc/userinfo

  # Argo CD 3.x's default exclusions (high-churn, controller-made kinds), minus
  # core Endpoints: ingress-nginx/k8s-api-proxy.yaml manages one by hand. No
  # Cilium or Kyverno here, so their entries are left out.
  resource.exclusions: |
    - apiGroups:
        - discovery.k8s.io
      kinds:
        - EndpointSlice
    - apiGroups:
        - coordination.k8s.io
      kinds:
        - Lease
    - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
      kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
    - apiGroups:
        - certificates.k8s.io
      kinds:
        - CertificateSigningRequest
    - apiGroups:
        - cert-manager.io
      kinds:
        - CertificateRequest

