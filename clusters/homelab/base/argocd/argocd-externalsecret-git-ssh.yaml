apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-git-ssh
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: argocd-git-ssh
    creationPolicy: Owner
    deletionPolicy: Retain
    # Declarative repository Secret: Argo CD 3.0 no longer reads `repositories`
    # from argocd-cm.
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        name: homelab
        type: git
        url: ssh://git@github.com/tkuipers/homelab.git
        sshPrivateKey: "{{ .sshPrivateKey }}"
  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: Homelab Git SSH Key
        property: private key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
