apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Core cluster infrastructure components (metallb, cert-manager, ingress, dns)

  # Allow deploying to any namespace
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc

  # Allow any source repo (locked to homelab in practice via Applications)
  sourceRepos:
    - "*"

  # Allow all cluster-scoped resources (CRDs, ClusterRoles, etc.)
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  # Allow all namespaced resources
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # Orphaned resource monitoring with exclusions for runtime-generated resources
  orphanedResources:
    warn: true
    ignore:
      # Kubernetes auto-generated
      - kind: ConfigMap
        name: kube-root-ca.crt
      # cert-manager runtime secrets (explicit names since globs may not work)
      - kind: Secret
        name: letsencrypt-prod
      - kind: Secret
        name: letsencrypt-staging
      - kind: Secret
        name: infrastructure-cert-manager-webhook-ca
      # Datadog runtime state
      - kind: ConfigMap
        name: datadog-cluster-id
      - kind: ConfigMap
        name: infrastructure-datadog-leader-election
      - kind: ConfigMap
        name: infrastructure-datadogtoken
      - kind: Secret
        name: webhook-certificate
      # Helm release secrets (legacy)
      - kind: Secret
        name: sh.helm.release.v1.metallb.v1
