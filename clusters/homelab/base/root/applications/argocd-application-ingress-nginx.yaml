apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: infrastructure
  # The ingress-nginx controller is gone (Traefik serves the Ingresses). What's left
  # in its namespace: the "nginx" IngressClass, the k8s.tkuipers.ca API proxy Ingress,
  # and the external kubectl access RBAC + token PushSecret.
  source:
    repoURL: ssh://git@github.com/tkuipers/homelab.git
    targetRevision: main
    path: clusters/homelab/infrastructure/ingress-nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
