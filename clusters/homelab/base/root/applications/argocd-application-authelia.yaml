apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-authelia
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infrastructure
  source:
    repoURL: ssh://git@github.com/tkuipers/homelab.git
    targetRevision: main
    path: clusters/homelab/infrastructure/authelia
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: authelia-secrets
      jsonPointers:
        - /data
        - /metadata/labels
        - /metadata/annotations
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
  destination:
    server: https://kubernetes.default.svc
    namespace: authelia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

