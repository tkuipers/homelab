apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  # No resources-finalizer: deleting this Application must not delete the
  # operator and its CRDs (that would delete every ExternalSecret in the cluster).
spec:
  project: infrastructure
  source:
    repoURL: ssh://git@github.com/tkuipers/homelab.git
    targetRevision: main
    path: clusters/homelab/infrastructure/external-secrets/helm-chart-external-secrets
    helm:
      releaseName: external-secrets
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      # the CRDs are too big for client-side apply (since 0.19)
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
