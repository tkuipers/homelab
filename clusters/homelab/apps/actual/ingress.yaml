apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actual
  namespace: actual
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: budget.tkuipers.ca
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - budget.tkuipers.ca
    secretName: actual-tls
  rules:
  - host: budget.tkuipers.ca
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: actual
            port:
              number: 5006
