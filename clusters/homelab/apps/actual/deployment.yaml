apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual
  namespace: actual
  labels:
    app: actual
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: actual
    tags.datadoghq.com/version: "24.12.0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: actual
  template:
    metadata:
      labels:
        app: actual
        tags.datadoghq.com/env: homelab
        tags.datadoghq.com/service: actual
        tags.datadoghq.com/version: "24.12.0"
      annotations:
        ad.datadoghq.com/actual.logs: '[{"source":"actual","service":"actual"}]'
    spec:
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      containers:
      - name: actual
        image: ghcr.io/actualbudget/actual-server:latest
        ports:
        - containerPort: 5006
          name: http
        volumeMounts:
        - name: data
          mountPath: /data
        env:
        - name: DEBUG
          value: "actual:*"
        - name: ACTUAL_OPENID_DISCOVERY_URL
          valueFrom:
            secretKeyRef:
              name: actual-oidc-secret
              key: discovery_url
        - name: ACTUAL_OPENID_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: actual-oidc-secret
              key: client_id
        - name: ACTUAL_OPENID_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: actual-oidc-secret
              key: client_secret
        - name: ACTUAL_OPENID_SERVER_HOSTNAME
          valueFrom:
            secretKeyRef:
              name: actual-oidc-secret
              key: server_hostname
        - name: ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB
          value: "20"
        - name: ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB
          value: "50"
        - name: ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB
          value: "20"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5006
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 5006
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: data
        hostPath:
          path: /var/persist/actual-data
          type: DirectoryOrCreate
      - name: config
        secret:
          secretName: actual-oidc-secret
