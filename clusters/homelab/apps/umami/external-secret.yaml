apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-secrets
  namespace: umami
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: umami-secrets
    creationPolicy: Owner
  data:
  - secretKey: postgres_password
    remoteRef:
      key: homelab/umami
      property: postgres_password
  - secretKey: app_secret
    remoteRef:
      key: homelab/umami
      property: app_secret
  - secretKey: database_url
    remoteRef:
      key: homelab/umami
      property: database_url

