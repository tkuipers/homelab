apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: stocks
  labels:
    app: stocks-nats
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stocks-nats
  template:
    metadata:
      labels:
        app: stocks-nats
    spec:
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      containers:
        - name: nats
          image: nats:2-alpine
          args:
            - -js
            - -sd
            - /data
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
        # Prometheus metrics incl. JetStream stream/consumer lag (pending,
        # ack pending, redelivered) - the "is the pipeline moving" signal
        - name: nats-exporter
          image: natsio/prometheus-nats-exporter:0.20.1
          args:
            - -varz
            - -connz
            - -jsz=all
            - -port=7777
            - http://localhost:8222
          ports:
            - containerPort: 7777
              name: metrics
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: data
          hostPath:
            path: /var/persist/stocks-nats
            type: DirectoryOrCreate
