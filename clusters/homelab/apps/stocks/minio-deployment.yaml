apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: stocks
  labels:
    app: stocks-minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stocks-minio
  template:
    metadata:
      labels:
        app: stocks-minio
      annotations:
        ad.datadoghq.com/minio.logs: '[{"source":"minio","service":"stocks-minio"}]'
    spec:
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      containers:
        - name: minio
          image: minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: stocks-secret
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stocks-secret
                  key: minio-root-password
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: data
          hostPath:
            path: /var/persist/stocks-minio
            type: DirectoryOrCreate
