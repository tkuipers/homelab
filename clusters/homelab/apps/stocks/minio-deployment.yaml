apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: stocks
  labels:
    app: stocks-minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stocks-minio
  template:
    metadata:
      labels:
        app: stocks-minio
    spec:
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      # one-time cold copy of the MinIO data before the switch to SILO
      initContainers:
        - name: data-copy-pre-silo
          image: busybox:1.38.0
          command: ["/bin/sh", "-c"]
          args:
            - '[ -d /persist/stocks-minio.bak-minio ] || cp -a /persist/stocks-minio /persist/stocks-minio.bak-minio'
          volumeMounts:
            - name: persist
              mountPath: /persist
      containers:
        - name: minio
          # minio/minio is archived (last image RELEASE.2025-09-07, no more security
          # fixes). SILO is PGSTY's maintained MinIO fork: same data format, CLI and
          # MINIO_* env (https://github.com/pgsty/minio).
          image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: stocks-secret
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stocks-secret
                  key: minio-root-password
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: data
          hostPath:
            path: /var/persist/stocks-minio
            type: DirectoryOrCreate
        - name: persist
          hostPath:
            path: /var/persist
            type: Directory
