apiVersion: apps/v1
kind: Deployment
metadata:
  name: training
  namespace: stocks
  labels:
    app: stocks-training
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stocks-training
  template:
    metadata:
      labels:
        app: stocks-training
    spec:
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: training
          # renovate: datasource=docker
          image: ghcr.io/tkuipers/stock-guesser-training:latest
          ports:
            - containerPort: 8085
              name: http
          env:
            # traces -> Alloy (OTLP) -> Tempo
            - name: OTEL_SERVICE_NAME
              value: training
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc:4318
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stocks-secret
                  key: database-url
            - name: NATS_URL
              value: nats://nats:4222
            - name: MINIO_ENDPOINT_URL
              value: http://minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: stocks-secret
                  key: minio-root-user
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stocks-secret
                  key: minio-root-password
            - name: MINIO_MODELS_BUCKET
              value: models
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "2Gi"
              cpu: "200m"
            limits:
              memory: "16Gi"
              cpu: "4000m"
