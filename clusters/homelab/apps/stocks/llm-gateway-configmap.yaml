apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-config
  namespace: stocks
data:
  llm_config.yaml: |
    providers:
      ollama:
        type: openai_compatible
        base_url: "${OLLAMA_BASE_URL:-http://ollama:11434/v1}"
        api_key: "ollama"
        pull_on_startup: false

      openai:
        type: openai
        base_url: "https://api.openai.com/v1"
        api_key: "${OPENAI_API_KEY:-}"

      anthropic_compat:
        type: openai_compatible
        base_url: "https://api.anthropic.com/v1"
        api_key: "${ANTHROPIC_API_KEY:-}"

    tasks:
      filing_extraction:
        provider: anthropic_compat
        model: "${FILING_EXTRACTION_MODEL:-claude-3-5-haiku-latest}"
        temperature: 0.0
        max_tokens: 256
        system_prompt: |
          You are a financial filing analyst. Read the SEC 8-K text and decide if it announces
          a real workforce reduction. Reply with ONLY a JSON object — no explanation, no markdown.

          Required field:
            status: "LAYOFF_CONFIRMED" or "NO_LAYOFFS"

          Optional fields (include only when stated in the filing):
            layoff_pct: decimal fraction of workforce cut (0.70 = 70%)
            layoff_count: absolute number of employees affected
            reason: one short phrase (e.g. "cost reduction")

          Use NO_LAYOFFS when layoff language appears only in executive compensation clauses,
          risk-factor boilerplate, forward-looking statements, or acquired-company descriptions.

          Examples:
          {"status":"LAYOFF_CONFIRMED","layoff_pct":0.15,"layoff_count":500,"reason":"cost reduction"}
          {"status":"LAYOFF_CONFIRMED","layoff_pct":null,"layoff_count":null,"reason":null}
          {"status":"NO_LAYOFFS","layoff_pct":null,"layoff_count":null,"reason":null}

      sentiment_rerank:
        provider: openai
        model: "${SENTIMENT_RERANK_MODEL:-gpt-4o-mini}"
        temperature: 0.0
        max_tokens: 256
        system_prompt: |
          You are a financial news analyst. Rate the sentiment and relevance of the
          provided news text to the specified company. Return ONLY valid JSON.

      geopolitical_analysis:
        provider: openai
        model: "${GEO_ANALYSIS_MODEL:-gpt-4o-mini}"
        temperature: 0.1
        max_tokens: 1024
        system_prompt: |
          You are a geopolitical risk analyst specialising in investment impact.
          Analyse the provided text for risks relevant to the named company or sector.
          Return ONLY valid JSON with structured risk assessment.

      insider_context:
        provider: anthropic_compat
        model: "${INSIDER_CONTEXT_MODEL:-claude-3-5-haiku-latest}"
        temperature: 0.0
        max_tokens: 512
        system_prompt: |
          You are a financial analyst specialising in insider trading patterns.
          Given a summary of insider transactions, determine whether the activity
          is routine (planned sales, diversification) or potentially alarming.
          Return ONLY valid JSON.
