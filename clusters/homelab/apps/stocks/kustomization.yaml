apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ghcr-credentials-external-secret.yaml
  - stocks-credentials-external-secret.yaml
  # Infrastructure
  - postgres-deployment.yaml
  - postgres-service.yaml
  - postgres-backup-cronjob.yaml
  - nats-deployment.yaml
  - nats-service.yaml
  - minio-deployment.yaml
  - minio-service.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  # Application services
  - api-deployment.yaml
  - api-service.yaml
  - api-ingress.yaml
  - console-deployment.yaml
  - console-service.yaml
  - console-ingress.yaml
  - audit-consumer-deployment.yaml
  - audit-consumer-service.yaml
  - ingestion-deployment.yaml
  - ingestion-service.yaml
  - llm-gateway-configmap.yaml
  - llm-gateway-deployment.yaml
  - llm-gateway-service.yaml
  - decision-deployment.yaml
  - decision-service.yaml
  # Order pipeline (replaces the former monolithic `execution` service):
  #   orchestrator = approve/route brain · paper-filler = virtual fill hands.
  # Broker-filler + reconciliation appliance arrive in Phase 2.
  - orchestrator-deployment.yaml
  - orchestrator-service.yaml
  - paper-filler-deployment.yaml
  - paper-filler-service.yaml
  - training-deployment.yaml
  - training-service.yaml
# Feature 19/20: the cross-sectional model's config and trading policy (the
# "champion"). Training fits with it, decision trades with it; the overnight
# research service (apps/stocks-research) proposes changes, and only a
# candidate its promotion gate approves is written here. The name gets a
# content hash, so a change rolls both deployments.
configMapGenerator:
  - name: xsec-champion
    namespace: stocks
    envs:
      - xsec-champion.env
