apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision
  namespace: stocks
  labels:
    app: stocks-decision
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stocks-decision
  template:
    metadata:
      labels:
        app: stocks-decision
    spec:
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: decision
          # renovate: datasource=docker
          image: ghcr.io/tkuipers/stock-guesser-decision:latest
          ports:
            - containerPort: 8083
              name: http
          env:
            # traces -> Alloy (OTLP) -> Tempo
            - name: OTEL_SERVICE_NAME
              value: decision
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc:4318
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stocks-secret
                  key: database-url
            - name: NATS_URL
              value: nats://nats:4222
            - name: REDIS_URL
              value: redis://redis:6379
            - name: ENVIRONMENT
              value: production
            - name: MINIO_ENDPOINT_URL
              value: http://minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: stocks-secret
                  key: minio-root-user
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stocks-secret
                  key: minio-root-password
            - name: MINIO_MODELS_BUCKET
              value: models
            # Feature 19: orders come from the 09:35-ET cross-sectional run;
            # "legacy" puts the old engine back in charge (xsec then shadows).
            - name: ORDER_SOURCE
              value: xsec
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
