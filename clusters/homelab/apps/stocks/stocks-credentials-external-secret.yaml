apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stocks-credentials
  namespace: stocks
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: stocks-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # PostgreSQL
        postgres-root-password: "{{ .postgres_root_password }}"
        postgres-user: "{{ .postgres_user }}"
        postgres-password: "{{ .postgres_password }}"
        postgres-database: "{{ .postgres_database }}"
        database-url: "postgresql+asyncpg://{{ .postgres_user }}:{{ .postgres_password }}@postgres:5432/{{ .postgres_database }}"
        # Core app secrets
        credential-encryption-key: "{{ .credential_encryption_key }}"
        session-secret-key: "{{ .session_secret_key }}"
        # OIDC
        oidc-client-secret: "{{ .oidc_client_secret }}"
        # MinIO
        minio-root-user: "{{ .minio_root_user }}"
        minio-root-password: "{{ .minio_root_password }}"
        # Signal ingestion API keys
        newsapi-key: "{{ .newsapi_key }}"
        adzuna-app-id: "{{ .adzuna_app_id }}"
        adzuna-app-key: "{{ .adzuna_app_key }}"
        azure-maps-key: "{{ .azure_maps_key }}"
        google-places-key: "{{ .google_places_key }}"
        acled-email: "{{ .acled_email }}"
        acled-password: "{{ .acled_password }}"
        # LLM providers
        openai-api-key: "{{ .openai_api_key }}"
        anthropic-api-key: "{{ .anthropic_api_key }}"
        # S3 backup
        aws-access-key-id: "{{ .aws_access_key_id }}"
        aws-secret-access-key: "{{ .aws_secret_access_key }}"
        s3-bucket: "{{ .s3_bucket }}"
        s3-region: "{{ .s3_region }}"
  data:
    - secretKey: postgres_root_password
      remoteRef:
        key: "Stocks v2"
        property: postgres-root-password
    - secretKey: postgres_user
      remoteRef:
        key: "Stocks v2"
        property: postgres-user
    - secretKey: postgres_password
      remoteRef:
        key: "Stocks v2"
        property: postgres-password
    - secretKey: postgres_database
      remoteRef:
        key: "Stocks v2"
        property: postgres-database
    - secretKey: credential_encryption_key
      remoteRef:
        key: "Stocks v2"
        property: credential-encryption-key
    - secretKey: session_secret_key
      remoteRef:
        key: "Stocks v2"
        property: session-secret-key
    - secretKey: oidc_client_secret
      remoteRef:
        key: "Stocks v2"
        property: oidc-client-secret
    - secretKey: minio_root_user
      remoteRef:
        key: "Stocks v2"
        property: minio-root-user
    - secretKey: minio_root_password
      remoteRef:
        key: "Stocks v2"
        property: minio-root-password
    - secretKey: newsapi_key
      remoteRef:
        key: "Stocks v2"
        property: newsapi-key
    - secretKey: adzuna_app_id
      remoteRef:
        key: "Stocks v2"
        property: adzuna-app-id
    - secretKey: adzuna_app_key
      remoteRef:
        key: "Stocks v2"
        property: adzuna-app-key
    - secretKey: azure_maps_key
      remoteRef:
        key: "Stocks v2"
        property: azure-maps-key
    - secretKey: google_places_key
      remoteRef:
        key: "Stocks v2"
        property: google-places-key
    - secretKey: acled_email
      remoteRef:
        key: "Stocks v2"
        property: acled-email
    - secretKey: acled_password
      remoteRef:
        key: "Stocks v2"
        property: acled-password
    - secretKey: openai_api_key
      remoteRef:
        key: "Stocks v2"
        property: openai-api-key
    - secretKey: anthropic_api_key
      remoteRef:
        key: "Stocks v2"
        property: anthropic-api-key
    - secretKey: aws_access_key_id
      remoteRef:
        key: "Stocks v2"
        property: aws-access-key-id
    - secretKey: aws_secret_access_key
      remoteRef:
        key: "Stocks v2"
        property: aws-secret-access-key
    - secretKey: s3_bucket
      remoteRef:
        key: "Stocks v2"
        property: s3-bucket
    - secretKey: s3_region
      remoteRef:
        key: "Stocks v2"
        property: s3-region
