apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-consumer
  namespace: stocks
  labels:
    app: stocks-audit-consumer
spec:
  replicas: 1
  # Durable NATS consumers: a new pod must not overlap the old, or it hits
  # "consumer is already bound to a subscription" and silently stops recording.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stocks-audit-consumer
  template:
    metadata:
      labels:
        app: stocks-audit-consumer
    spec:
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: audit-consumer
          # renovate: datasource=docker
          image: ghcr.io/tkuipers/stock-guesser-audit-consumer:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            # traces -> Alloy (OTLP) -> Tempo
            - name: OTEL_SERVICE_NAME
              value: audit-consumer
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc:4318
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stocks-secret
                  key: database-url
            - name: NATS_URL
              value: nats://nats:4222
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
