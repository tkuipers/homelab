apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-consumer
  namespace: stocks
  labels:
    app: stocks-audit-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stocks-audit-consumer
  template:
    metadata:
      labels:
        app: stocks-audit-consumer
      annotations:
        ad.datadoghq.com/audit-consumer.logs: '[{"source":"python","service":"stocks-audit-consumer"}]'
    spec:
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: audit-consumer
          # renovate: datasource=docker
          image: ghcr.io/tkuipers/stock-guesser-audit-consumer:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stocks-secret
                  key: database-url
            - name: NATS_URL
              value: nats://nats:4222
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_SERVICE
              value: stocks-audit-consumer
            - name: DD_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
