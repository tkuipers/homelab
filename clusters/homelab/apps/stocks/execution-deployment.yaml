apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution
  namespace: stocks
  labels:
    app: stocks-execution
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stocks-execution
  template:
    metadata:
      labels:
        app: stocks-execution
      annotations:
        ad.datadoghq.com/execution.logs: '[{"source":"python","service":"stocks-execution"}]'
    spec:
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: execution
          # renovate: datasource=docker
          image: ghcr.io/tkuipers/stock-guesser-execution:latest
          ports:
            - containerPort: 8084
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stocks-secret
                  key: database-url
            - name: NATS_URL
              value: nats://nats:4222
            - name: REDIS_URL
              value: redis://redis:6379
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: stocks-secret
                  key: credential-encryption-key
            - name: MINIO_ENDPOINT_URL
              value: http://minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: stocks-secret
                  key: minio-root-user
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stocks-secret
                  key: minio-root-password
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_SERVICE
              value: stocks-execution
            - name: DD_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
