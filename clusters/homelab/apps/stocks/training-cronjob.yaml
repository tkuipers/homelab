apiVersion: batch/v1
kind: CronJob
metadata:
  name: training
  namespace: stocks
  labels:
    app: stocks-training
spec:
  schedule: "0 1 * * 0"  # Weekly on Sunday at 1 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: stocks-training
          annotations:
            ad.datadoghq.com/training.logs: '[{"source":"python","service":"stocks-training"}]'
        spec:
          nodeSelector:
            kubernetes.io/hostname: omen-worker1
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: training
              # renovate: datasource=docker
              image: ghcr.io/tkuipers/stock-guesser-training:latest
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: stocks-secret
                      key: database-url
                - name: NATS_URL
                  value: nats://nats:4222
                - name: MINIO_ENDPOINT_URL
                  value: http://minio:9000
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: stocks-secret
                      key: minio-root-user
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: stocks-secret
                      key: minio-root-password
                - name: MINIO_MODELS_BUCKET
                  value: models
                - name: DD_AGENT_HOST
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
                - name: DD_SERVICE
                  value: stocks-training
                - name: DD_ENV
                  value: production
              resources:
                requests:
                  memory: "4Gi"
                  cpu: "1000m"
                limits:
                  memory: "16Gi"
                  cpu: "4000m"
