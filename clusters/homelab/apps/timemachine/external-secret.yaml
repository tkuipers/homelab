apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: timemachine-credentials
  namespace: timemachine
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: timemachine-credentials
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: "Time Machine Backup"
      property: username
  - secretKey: password
    remoteRef:
      key: "Time Machine Backup"
      property: password 