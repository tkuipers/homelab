apiVersion: apps/v1
kind: Deployment
metadata:
  name: timemachine
  namespace: timemachine
  labels:
    app: timemachine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timemachine
  template:
    metadata:
      labels:
        app: timemachine
    spec:
      containers:
      - name: timemachine
        image: mbentley/timemachine:smb
        ports:
        - containerPort: 445
          name: smb
          protocol: TCP
        env:
        - name: TM_USERNAME
          valueFrom:
            secretKeyRef:
              name: timemachine-credentials
              key: username
        - name: TM_GROUPNAME
          valueFrom:
            secretKeyRef:
              name: timemachine-credentials
              key: username
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: timemachine-credentials
              key: password
        - name: TM_UID
          value: "1000"
        - name: TM_GID
          value: "1000"
        - name: SHARE_NAME
          value: "TimeMachine"
        - name: VOLUME_SIZE_LIMIT
          value: "0"  # No size limit
        - name: SMB_PORT
          value: "445"
        - name: SET_PERMISSIONS
          value: "true"
        volumeMounts:
        - name: timemachine-data
          mountPath: /opt/timemachine
        securityContext:
          privileged: true  # Required for SMB functionality
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: timemachine-data
        persistentVolumeClaim:
          claimName: timemachine-storage 