apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  namespace: ml
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      initContainers:
      - name: fix-permissions
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          chmod -R 777 /models
        volumeMounts:
        - name: models
          mountPath: /models
      - name: download-model
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          if [ ! -f /models/deepseek-r1-distill-qwen-7b.gguf ]; then
            echo "Downloading DeepSeek-R1-Distill-Qwen-7B model (Q4_K_M, ~4.5GB)..."
            curl -L -o /models/deepseek-r1-distill-qwen-7b.gguf https://huggingface.co/bartowski/DeepSeek-R1-Distill-Qwen-7B-GGUF/resolve/main/DeepSeek-R1-Distill-Qwen-7B-Q4_K_M.gguf
            echo "Model download complete"
          else
            echo "Model already exists, skipping download"
          fi
        volumeMounts:
        - name: models
          mountPath: /models
      containers:
      - name: llama-server
        image: ghcr.io/ggml-org/llama.cpp:server-cuda
        ports:
        - containerPort: 8080
          name: http
        command:
        - /bin/sh
        - -c
        args:
        - |
          exec /app/llama-server \
            --model /models/deepseek-r1-distill-qwen-7b.gguf \
            --host 0.0.0.0 \
            --port 8080 \
            --ctx-size 32768 \
            --threads 4 \
            --n-gpu-layers 28 \
            --api-key "${API_KEY}"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
        env:
        - name: TZ
          value: "America/Los_Angeles"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: llama-api-key
              key: api-key
        volumeMounts:
        - name: models
          mountPath: /models
        resources:
          requests:
            memory: "24Gi"
            cpu: "1000m"
            nvidia.com/gpu: 1
          limits:
            memory: "30Gi"
            cpu: "4000m"
            nvidia.com/gpu: 1
      volumes:
      - name: models
        hostPath:
          path: /var/persist/llama-models
          type: DirectoryOrCreate

