apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  namespace: ml
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      initContainers:
      - name: fix-permissions
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          chmod -R 777 /models
        volumeMounts:
        - name: models
          mountPath: /models
      - name: download-model
        image: alpine:latest
        command:
        - sh
        - -c
        - |
          apk add --no-cache curl
          
          MODEL_FILE="/models/deepseek-r1-distill-qwen-7b.gguf"
          MODEL_URL="https://huggingface.co/bartowski/DeepSeek-R1-Distill-Qwen-7B-GGUF/resolve/main/DeepSeek-R1-Distill-Qwen-7B-Q4_K_M.gguf"
          REPO="bartowski/DeepSeek-R1-Distill-Qwen-7B-GGUF"
          FILENAME="DeepSeek-R1-Distill-Qwen-7B-Q4_K_M.gguf"
          
          # Fetch expected SHA256 from Hugging Face API
          echo "Fetching file metadata from Hugging Face..."
          EXPECTED_SHA=$(curl -s "https://huggingface.co/api/models/${REPO}/tree/main/${FILENAME}" | grep -o '"sha256":"[^"]*"' | cut -d'"' -f4)
          
          if [ -z "$EXPECTED_SHA" ]; then
            echo "Warning: Could not fetch SHA256 from Hugging Face API, proceeding without verification"
          else
            echo "Expected SHA256: $EXPECTED_SHA"
          fi
          
          # Check if model exists and verify checksum
          if [ -f "$MODEL_FILE" ]; then
            echo "Model file exists, verifying integrity..."
            if [ -n "$EXPECTED_SHA" ]; then
              ACTUAL_SHA=$(sha256sum "$MODEL_FILE" | cut -d' ' -f1)
              if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
                echo "✓ Model verified successfully, checksum matches!"
                exit 0
              else
                echo "✗ Checksum mismatch! Expected: $EXPECTED_SHA, Got: $ACTUAL_SHA"
                echo "Re-downloading model..."
                rm -f "$MODEL_FILE"
              fi
            else
              FILE_SIZE=$(stat -c%s "$MODEL_FILE" 2>/dev/null || echo 0)
              if [ "$FILE_SIZE" -gt 4000000000 ]; then
                echo "Model exists and appears complete ($FILE_SIZE bytes), skipping download"
                exit 0
              fi
            fi
          fi
          
          # Download model
          echo "Downloading DeepSeek-R1-Distill-Qwen-7B model (Q4_K_M, ~4.5GB)..."
          curl -L --progress-bar -C - -o "$MODEL_FILE" "$MODEL_URL"
          
          if [ $? -ne 0 ]; then
            echo "✗ Download failed!"
            exit 1
          fi
          
          # Verify downloaded file
          if [ -n "$EXPECTED_SHA" ]; then
            echo "Verifying downloaded file..."
            ACTUAL_SHA=$(sha256sum "$MODEL_FILE" | cut -d' ' -f1)
            if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
              echo "✓ Download verified successfully!"
            else
              echo "✗ Downloaded file checksum mismatch!"
              echo "Expected: $EXPECTED_SHA"
              echo "Got: $ACTUAL_SHA"
              rm -f "$MODEL_FILE"
              exit 1
            fi
          else
            echo "Download complete (checksum verification skipped)"
          fi
        volumeMounts:
        - name: models
          mountPath: /models
      containers:
      - name: llama-server
        image: ghcr.io/ggml-org/llama.cpp:server-cuda
        ports:
        - containerPort: 8080
          name: http
        command:
        - /bin/sh
        - -c
        args:
        - |
          exec /app/llama-server \
            --model /models/deepseek-r1-distill-qwen-7b.gguf \
            --host 0.0.0.0 \
            --port 8080 \
            --ctx-size 16384 \
            --threads 4 \
            --n-gpu-layers 12 \
            --jinja \
            --api-key "${API_KEY}"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
        env:
        - name: TZ
          value: "America/Los_Angeles"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: llama-api-key
              key: api-key
        volumeMounts:
        - name: models
          mountPath: /models
        resources:
          requests:
            memory: "12Gi"
            cpu: "1000m"
            nvidia.com/gpu: 1
          limits:
            memory: "18Gi"
            cpu: "4000m"
            nvidia.com/gpu: 1
      volumes:
      - name: models
        hostPath:
          path: /var/persist/llama-models
          type: DirectoryOrCreate

