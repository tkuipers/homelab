apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: OPENAI_API_BASE_URLS
          value: "http://llama-server.ml.svc.cluster.local:8080/v1"
        - name: OPENAI_API_KEYS
          valueFrom:
            secretKeyRef:
              name: llama-api-key
              key: api-key
        - name: WEBUI_AUTH
          value: "false"
        - name: ENABLE_SIGNUP
          value: "false"
        - name: ENABLE_RAG_WEB_SEARCH
          value: "true"
        - name: RAG_WEB_SEARCH_ENGINE
          value: "duckduckgo"
        - name: ENABLE_SEARCH_QUERY
          value: "true"
        volumeMounts:
        - name: data
          mountPath: /app/backend/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: data
        hostPath:
          path: /var/persist/open-webui
          type: DirectoryOrCreate

