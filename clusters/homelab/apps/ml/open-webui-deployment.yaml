apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: OPENAI_API_BASE_URLS
          value: "http://llama-server.ml.svc.cluster.local:8080/v1"
        - name: OPENAI_API_KEYS
          valueFrom:
            secretKeyRef:
              name: llama-api-key
              key: api-key
        - name: WEBUI_AUTH
          value: "false"
        - name: ENABLE_SIGNUP
          value: "false"
        # Enhanced web search configuration
        - name: ENABLE_RAG_WEB_SEARCH
          value: "true"
        - name: RAG_WEB_SEARCH_ENGINE
          value: "duckduckgo"
        - name: ENABLE_SEARCH_QUERY
          value: "true"
        # Enable web search for tools (important for agent usage)
        - name: ENABLE_WEB_SEARCH
          value: "true"
        # Tool/function calling support
        - name: ENABLE_OPENAI_API
          value: "true"
        # RAG enhancements
        - name: ENABLE_RAG
          value: "true"
        - name: RAG_EMBEDDING_ENGINE
          value: "openai"
        - name: RAG_EMBEDDING_MODEL
          value: "nomic-embed-text"
        - name: ENABLE_IMAGE_GENERATION
          value: "false"
        # Enable community sharing
        - name: ENABLE_COMMUNITY_SHARING
          value: "true"
        volumeMounts:
        - name: data
          mountPath: /app/backend/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      
      # MCP Server: Brave Search - Web search with API
      - name: mcp-brave-search
        image: python:3.12-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install --no-cache-dir mcp uvicorn &&
            uvx --python python3.12 mcpo --port 8001 -- \
            uvx mcp-server-brave-search
        ports:
        - containerPort: 8001
          name: brave-search
        env:
        - name: BRAVE_API_KEY
          valueFrom:
            secretKeyRef:
              name: mcp-api-keys
              key: brave-api-key
              optional: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      
      # MCP Server: Fetch - HTTP requests and web content fetching
      - name: mcp-fetch
        image: python:3.12-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install --no-cache-dir mcp uvicorn &&
            uvx --python python3.12 mcpo --port 8002 -- \
            uvx mcp-server-fetch
        ports:
        - containerPort: 8002
          name: fetch
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      
      # MCP Server: Memory - Persistent memory/knowledge graph
      - name: mcp-memory
        image: python:3.12-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install --no-cache-dir mcp uvicorn &&
            uvx --python python3.12 mcpo --port 8003 -- \
            uvx mcp-server-memory
        ports:
        - containerPort: 8003
          name: memory
        volumeMounts:
        - name: mcp-memory
          mountPath: /root/.mcp-memory
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      
      # MCP Server: Time - Current time and timezone info
      - name: mcp-time
        image: python:3.12-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install --no-cache-dir mcp uvicorn &&
            uvx --python python3.12 mcpo --port 8004 -- \
            uvx mcp-server-time
        ports:
        - containerPort: 8004
          name: time
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      
      # MCP Server: Filesystem - Safe filesystem operations
      - name: mcp-filesystem
        image: python:3.12-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install --no-cache-dir mcp uvicorn &&
            uvx --python python3.12 mcpo --port 8005 -- \
            uvx mcp-server-filesystem /workspace
        ports:
        - containerPort: 8005
          name: filesystem
        volumeMounts:
        - name: mcp-workspace
          mountPath: /workspace
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      
      # MCP Server: Git operations
      - name: mcp-git
        image: python:3.12-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            apt-get update && apt-get install -y git &&
            pip install --no-cache-dir mcp uvicorn &&
            uvx --python python3.12 mcpo --port 8006 -- \
            uvx mcp-server-git --repository /workspace
        ports:
        - containerPort: 8006
          name: git
        volumeMounts:
        - name: mcp-workspace
          mountPath: /workspace
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      
      volumes:
      - name: data
        hostPath:
          path: /var/persist/open-webui
          type: DirectoryOrCreate
      - name: mcp-memory
        hostPath:
          path: /var/persist/open-webui/mcp-memory
          type: DirectoryOrCreate
      - name: mcp-workspace
        hostPath:
          path: /var/persist/open-webui/workspace
          type: DirectoryOrCreate

