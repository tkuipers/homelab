apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-api-keys
  namespace: ml
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: mcp-api-keys
    creationPolicy: Owner
  data:
  - secretKey: brave-api-key
    remoteRef:
      key: "MCP API Keys"
      property: brave_api_key
  - secretKey: mcpo-api-key
    remoteRef:
      key: "MCP API Keys"
      property: mcpo_api_key

