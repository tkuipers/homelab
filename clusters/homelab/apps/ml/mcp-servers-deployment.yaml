apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-servers
  namespace: ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-servers
  template:
    metadata:
      labels:
        app: mcp-servers
    spec:
      containers:
      # MCP Brave Search Server wrapped with mcpo proxy
      - name: brave-search
        image: python:3.12-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            apt-get update -qq && apt-get install -y -qq nodejs npm > /dev/null 2>&1 &&
            pip install -q --no-cache-dir uv &&
            uv tool install --quiet mcpo &&
            export PATH="/root/.local/bin:$PATH" &&
            mcpo --host 0.0.0.0 --port 8080 -- npx -y @brave/brave-search-mcp-server
        ports:
        - containerPort: 8080
          name: brave
        env:
        - name: BRAVE_API_KEY
          valueFrom:
            secretKeyRef:
              name: mcp-api-keys
              key: brave-api-key
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-servers
  namespace: ml
spec:
  selector:
    app: mcp-servers
  ports:
  - name: brave-search
    port: 8001
    targetPort: 8080
  type: ClusterIP

