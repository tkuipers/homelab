apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-servers
  namespace: ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-servers
  template:
    metadata:
      labels:
        app: mcp-servers
    spec:
      containers:
      # MCP Brave Search Server (official image)
      - name: brave-search
        image: mcp/brave-search
        ports:
        - containerPort: 8080
          name: brave
        env:
        - name: BRAVE_API_KEY
          valueFrom:
            secretKeyRef:
              name: mcp-api-keys
              key: brave-api-key
        - name: BRAVE_MCP_TRANSPORT
          value: "http"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-servers
  namespace: ml
spec:
  selector:
    app: mcp-servers
  ports:
  - name: brave-search
    port: 8001
    targetPort: 8080
  type: ClusterIP

