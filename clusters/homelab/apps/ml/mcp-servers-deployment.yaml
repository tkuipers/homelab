apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-servers
  namespace: ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-servers
  template:
    metadata:
      labels:
        app: mcp-servers
    spec:
      containers:
      # MCP Brave Search Server (via mcpo proxy)
      - name: brave-search
        image: python:3.12-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            apt-get update && apt-get install -y nodejs npm curl &&
            pip install --no-cache-dir uv &&
            uv tool install mcpo &&
            export PATH="/root/.local/bin:$PATH" &&
            mcpo --host 0.0.0.0 --port 8001 -- npx -y @modelcontextprotocol/server-brave-search
        ports:
        - containerPort: 8001
          name: brave
        env:
        - name: BRAVE_API_KEY
          valueFrom:
            secretKeyRef:
              name: mcp-api-keys
              key: brave-api-key
              optional: true
        - name: PORT
          value: "8001"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-servers
  namespace: ml
spec:
  selector:
    app: mcp-servers
  ports:
  - name: brave-search
    port: 8001
    targetPort: 8001
  type: ClusterIP

