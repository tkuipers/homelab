# What the agent may do with kubectl. Real changes go through git (Argo CD);
# this allows looking at everything except Secrets, restarts, and minor live
# edits/test patches that the agent must commit before it finishes.
# Note: patching workloads or exec'ing into pods can reach whatever those pods
# can (including mounted secrets) - accepted for a single-owner homelab.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-agent
  namespace: homelab-agent
---
# Read: the built-in "view" role (namespaced objects, no Secrets) ...
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-agent-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: homelab-agent
    namespace: homelab-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-agent
rules:
  # ... plus cluster-scoped objects and the CRDs "view" doesn't cover
  - apiGroups: [""]
    resources: [nodes, persistentvolumes, namespaces, componentstatuses]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io, admissionregistration.k8s.io, scheduling.k8s.io, node.k8s.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [argoproj.io, monitoring.coreos.com, external-secrets.io, cert-manager.io, acme.cert-manager.io, metallb.io]
    resources: ["*"]
    verbs: [get, list, watch]
  # restarts and minor live edits
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [patch, update]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, deployments/scale, statefulsets/scale]
    verbs: [patch, update]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, patch]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [patch, update]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [patch, update]
  # pause/resume selfHeal on one app for a test patch; force a refresh
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [patch, update]
  # force-sync annotation
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [patch]
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors, podmonitors, prometheusrules, probes]
    verbs: [patch, update]
  # one-off cleanup (2026-10-12): kube-system Services left by the old
  # "kube-prometheus-stack" release; the kubelet one matches the kps-kubelet
  # ServiceMonitor too, so every kubelet/cAdvisor target is scraped twice
  - apiGroups: [""]
    resources: [services]
    resourceNames: [kube-prometheus-stack-kubelet, kube-prometheus-stack-coredns, kube-prometheus-stack-kube-controller-manager, kube-prometheus-stack-kube-etcd, kube-prometheus-stack-kube-proxy, kube-prometheus-stack-kube-scheduler]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab-agent
subjects:
  - kind: ServiceAccount
    name: homelab-agent
    namespace: homelab-agent
