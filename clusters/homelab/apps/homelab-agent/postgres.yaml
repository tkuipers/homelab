# The agent's database: conversations, transcripts, personas, notes, settings.
# The password is generated once by External Secrets (nobody needs to know it)
# and kept as long as the Secret exists; backups in postgres-backup-cronjob.yaml.
#
# Two roles: "agent" (owner, used for migrations/writes) and "agent_reader"
# (read-only, used for reads and queries). The reader can SELECT on all tables
# in the public schema but cannot INSERT, UPDATE, DELETE or DDL.
# A NetworkPolicy restricts Postgres access to the agent pod only.

# Reader password (same pattern: generated once, never rotated)
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: homelab-agent-postgres-reader
  namespace: homelab-agent
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-agent-postgres-reader
  namespace: homelab-agent
spec:
  refreshInterval: "0"
  target:
    name: homelab-agent-postgres-reader
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: homelab-agent-postgres-reader
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: homelab-agent-postgres
  namespace: homelab-agent
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-agent-postgres
  namespace: homelab-agent
spec:
  refreshInterval: "0"   # generate once, never rotate (the database keeps the first password)
  target:
    name: homelab-agent-postgres
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: homelab-agent-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-agent-postgres
  namespace: homelab-agent
  labels:
    app: homelab-agent-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homelab-agent-postgres
  template:
    metadata:
      labels:
        app: homelab-agent-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      # Postgres runs as non-root; the entrypoint handles UID remapping
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Create the read-only role after Postgres is ready
        - name: create-reader
          image: postgres:16
          command:
            - sh
            - -ec
            - |
              until pg_isready -h localhost -U agent -d agent; do sleep 1; done
              psql -v ON_ERROR_STOP=1 -U agent -d agent <<'SQL'
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'agent_reader') THEN
                  CREATE ROLE agent_reader LOGIN PASSWORD :'READER_PASS';
                END IF;
              END
              $$;
              GRANT USAGE ON SCHEMA public TO agent_reader;
              GRANT SELECT ON ALL TABLES IN SCHEMA public TO agent_reader;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO agent_reader;
              SQL
          env:
            - name: PGHOST
              value: localhost
            - name: PGUSER
              value: agent
            - name: PGDATABASE
              value: agent
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: homelab-agent-postgres
                  key: password
            - name: READER_PASS
              valueFrom:
                secretKeyRef:
                  name: homelab-agent-postgres-reader
                  key: password
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: agent
            - name: POSTGRES_DB
              value: agent
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homelab-agent-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
        # Prometheus metrics; scraped by the "app-exporters" PodMonitor in infrastructure/observability
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          env:
            - name: DATA_SOURCE_URI
              value: localhost:5432/agent?sslmode=disable
            - name: DATA_SOURCE_USER
              value: agent
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: homelab-agent-postgres
                  key: password
          ports:
            - containerPort: 9187
              name: metrics
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
      volumes:
        - name: data
          hostPath:
            path: /var/persist/homelab-agent-postgres
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-agent-postgres
  namespace: homelab-agent
  labels:
    app: homelab-agent-postgres
spec:
  selector:
    app: homelab-agent-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# NetworkPolicy: only the agent pod and the backup job may reach Postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homelab-agent-postgres
  namespace: homelab-agent
spec:
  podSelector:
    matchLabels:
      app: homelab-agent-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: homelab-agent
      ports:
        - port: 5432
    - from:
        - podSelector:
            matchLabels:
              app: homelab-agent-postgres-backup
      ports:
        - port: 5432
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: homelab-agent-postgres-backup
  namespace: homelab-agent
  labels:
    app: homelab-agent-postgres-backup
spec:
  schedule: "15 3 * * *"   # daily 03:15 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: homelab-agent-postgres-backup
        spec:
          nodeSelector:
            kubernetes.io/hostname: dell-r620
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16
              command:
                - /bin/bash
                - -c
                - |
                  # pipefail: a failing dump must fail the Job, not leave an empty .gz
                  set -euo pipefail
                  TS=$(date +%Y%m%d-%H%M%S)
                  DAILY=/backups/daily; WEEKLY=/backups/weekly; MONTHLY=/backups/monthly
                  mkdir -p "$DAILY" "$WEEKLY" "$MONTHLY"
                  FILE="homelab-agent-${TS}.sql.gz"
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -h homelab-agent-postgres -U agent agent --no-owner --no-acl | gzip > "${DAILY}/${FILE}"
                  DOW=$(date +%u); DOM=$(date +%d)
                  if [ "$DOW" -eq 7 ]; then cp "${DAILY}/${FILE}" "${WEEKLY}/${FILE}"; fi
                  if [ "$DOM" -eq "01" ]; then cp "${DAILY}/${FILE}" "${MONTHLY}/${FILE}"; fi
                  find "$DAILY"   -maxdepth 1 -type f -name '*.sql.gz' -mtime +14 -delete
                  find "$WEEKLY"  -maxdepth 1 -type f -name '*.sql.gz' -mtime +56 -delete
                  find "$MONTHLY" -maxdepth 1 -type f -name '*.sql.gz' -mtime +365 -delete
                  ls -lh "${DAILY}/${FILE}"
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: homelab-agent-postgres
                      key: password
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              hostPath:
                path: /var/persist/homelab-agent-postgres-backups
