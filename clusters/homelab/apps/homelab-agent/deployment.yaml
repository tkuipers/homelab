# The agent: web UI (agent.tkuipers.ca), alert webhooks, SMS, daily scan, and the
# Claude Code conversations. Source: github.com/tkuipers/homelab-agent (private).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-agent
  namespace: homelab-agent
  labels:
    app: homelab-agent
spec:
  replicas: 1
  strategy:
    type: Recreate   # one writer for /data
  selector:
    matchLabels:
      app: homelab-agent
  template:
    metadata:
      labels:
        app: homelab-agent
    spec:
      serviceAccountName: homelab-agent
      # SIGTERM pauses running turns and flushes the database (src/main.ts); they resume after the restart
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr-secret
      # plenty of memory for parallel Claude Code sessions
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      initContainers:
        # local-path volumes start out world-writable and owned by root: make /data the
        # agent's alone (it holds the Claude token, gh login and the worktrees)
        - name: data-perms
          image: ghcr.io/tkuipers/homelab-agent:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
          command: [sh, -ec, "chown 1000:1000 /data && chmod 0700 /data"]
          volumeMounts:
            - name: data
              mountPath: /data
        # Pod firewall (flannel can't enforce NetworkPolicies): only the egress proxy's user
        # (1337) may leave the cluster. The agent and every command it runs reach the
        # internet only through the proxy, which only allows hosts on the allow-list
        # Tyler edits in the web UI.
        - name: firewall
          image: ghcr.io/tkuipers/homelab-agent:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN, NET_RAW]
          command:
            - sh
            - -ec
            - |
              iptables -A OUTPUT -o lo -j ACCEPT
              iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
              iptables -A OUTPUT -d 10.96.0.0/12 -j ACCEPT   # services (kube-dns, API server, Grafana, Authelia)
              iptables -A OUTPUT -d 10.244.0.0/16 -j ACCEPT  # pods
              iptables -A OUTPUT -d 10.0.0.0/24 -j ACCEPT    # nodes (kubelet probes)
              iptables -A OUTPUT -m owner --uid-owner 1337 -j ACCEPT
              iptables -A OUTPUT -j REJECT
              ip6tables -A OUTPUT -o lo -j ACCEPT
              ip6tables -A OUTPUT -m owner --uid-owner 1337 -j ACCEPT
              ip6tables -A OUTPUT -j REJECT
              iptables -S OUTPUT
        # Egress proxy (native sidecar), the pod's only way out: allow-listed hosts only.
        - name: egress
          image: ghcr.io/tkuipers/homelab-agent:latest
          imagePullPolicy: Always
          restartPolicy: Always
          securityContext:
            runAsUser: 1337
            runAsGroup: 1337
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: MODE
              value: proxy
          # the proxy listens on loopback only (other pods must not use it), so probe from inside
          startupProbe:
            exec:
              command: ["bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]
            periodSeconds: 1
            failureThreshold: 30
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 192Mi
        # Native sidecar (starts first, runs alongside): holds the SSH keys in an
        # ssh-agent and shares only its socket + the public signing key via /ssh.
        - name: keys
          image: ghcr.io/tkuipers/homelab-agent:latest
          imagePullPolicy: Always
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: MODE
              value: keys
          startupProbe:
            exec:
              command: ["test", "-S", "/ssh/agent.sock"]
            periodSeconds: 1
            failureThreshold: 30
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
            - name: ssh
              mountPath: /ssh
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 96Mi
      containers:
        - name: agent
          image: ghcr.io/tkuipers/homelab-agent:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PUBLIC_URL
              value: https://agent.tkuipers.ca
            # traces -> Alloy (OTLP) -> Tempo; the agent's commands don't inherit these
            - name: OTEL_SERVICE_NAME
              value: homelab-agent
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc:4318
            # tool-use turns per session before it stops with max_turns_reached (default 200;
            # 10000 is the highest the app accepts, so effectively no limit; the daily budget still applies)
            - name: AGENT_MAX_TURNS
              value: "10000"
            # each Bash command gets ulimit -v 20Gi: a runaway command fails on its own instead of
            # OOM-killing the container (memory.oom.group kills every process, i.e. every conversation)
            - name: AGENT_COMMAND_MEMORY_MIB
              value: "20480"
            - name: AUTHELIA_VERIFY_URL
              value: http://authelia.authelia.svc.cluster.local/api/authz/auth-request
            - name: GRAFANA_URL
              value: http://kps-grafana.observability.svc
            - name: REPO_URL
              value: git@github.com:tkuipers/homelab.git
            - name: SSH_AUTH_SOCK
              value: /ssh/agent.sock
            - name: PGHOST
              value: homelab-agent-postgres
            - name: PGUSER
              value: agent
            - name: PGDATABASE
              value: agent
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: homelab-agent-postgres, key: password}}
            # read-only connection for queries (the agent process uses the writer for writes)
            - name: PGREADER_USER
              value: agent_reader
            - name: PGREADER_PASSWORD
              valueFrom: {secretKeyRef: {name: homelab-agent-postgres-reader, key: password}}
            # everything leaves through the egress sidecar; in-cluster traffic goes direct
            - name: HTTPS_PROXY
              value: http://127.0.0.1:3128
            - name: HTTP_PROXY
              value: http://127.0.0.1:3128
            - name: NO_PROXY
              value: localhost,127.0.0.1,.svc,.cluster.local,10.96.0.0/12,10.244.0.0/16
            - name: NODE_USE_ENV_PROXY
              value: "1"
            - name: NODE_OPTIONS
              value: --disable-warning=UNDICI-EHPA
            # ssh finds ~/.ssh via the passwd entry, not $HOME: point it at the config that routes it through the proxy
            - name: GIT_SSH_COMMAND
              value: ssh -F /data/home/.ssh/config
            - name: GMAIL_MCP_URL
              value: http://google-mcp.mcp.svc/mcp
            - name: GMAIL_ASSISTANT_MCP_URL
              value: http://google-mcp-assistant.mcp.svc/mcp
            - name: BROWSER_MCP_URL
              value: http://browser-mcp.mcp-browser.svc/mcp
            - name: HOME_ASSISTANT_MCP_URL
              value: http://homeassistant.homeassistant.svc.cluster.local:8123/api/mcp
            - name: ARR_MCP_URL
              value: http://arr-mcp.mcp-arr.svc/mcp
            - name: WHATSAPP_MCP_URL
              value: http://whatsapp-mcp.mcp-whatsapp.svc/mcp
            - name: SCAN_TIME
              value: "02:00"
            - name: SCAN_TZ
              value: America/Edmonton
            - name: AGENT_MAX_PARALLEL
              value: "3"
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom: {secretKeyRef: {name: homelab-agent, key: grafana-token}}
            - name: ADGUARD_USERNAME
              valueFrom: {secretKeyRef: {name: homelab-agent, key: adguard-username, optional: true}}
            - name: ADGUARD_PASSWORD
              valueFrom: {secretKeyRef: {name: homelab-agent, key: adguard-password, optional: true}}
            - name: WEBHOOK_TOKEN
              valueFrom: {secretKeyRef: {name: homelab-agent, key: webhook-token}}
            - name: TWILIO_ACCOUNT_SID
              valueFrom: {secretKeyRef: {name: homelab-agent, key: twilio-account-sid, optional: true}}
            - name: TWILIO_AUTH_TOKEN
              valueFrom: {secretKeyRef: {name: homelab-agent, key: twilio-auth-token, optional: true}}
            - name: SMS_FROM
              valueFrom: {secretKeyRef: {name: homelab-agent, key: sms-from, optional: true}}
            - name: SMS_ALLOWED_NUMBERS
              valueFrom: {secretKeyRef: {name: homelab-agent, key: sms-allowed-numbers, optional: true}}
            - name: TYPESAFE_API_KEY
              valueFrom: {secretKeyRef: {name: homelab-agent, key: typesafe-api-key, optional: true}}
            # image generation (fal.ai) for the study companion
            - name: FAL_KEY
              valueFrom: {secretKeyRef: {name: homelab-agent, key: fal-key, optional: true}}
            - name: RUNPOD_KEY
              valueFrom: {secretKeyRef: {name: homelab-agent, key: runpod-key, optional: true}}
            # personas that run on OpenRouter models instead of Claude
            - name: OPENROUTER_API_KEY
              valueFrom: {secretKeyRef: {name: homelab-agent, key: openrouter-key, optional: true}}
            - name: APNS_KEY
              valueFrom: {secretKeyRef: {name: homelab-agent, key: apns-key, optional: true}}
            - name: APNS_KEY_ID
              valueFrom: {secretKeyRef: {name: homelab-agent, key: apns-key-id, optional: true}}
            - name: APNS_TEAM_ID
              valueFrom: {secretKeyRef: {name: homelab-agent, key: apns-team-id, optional: true}}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: ssh
              mountPath: /ssh
            - name: mcp-secrets
              mountPath: /secrets/mcp
              readOnly: true
            # the Professor's ledger signing key (created by hand; until it exists her ledger is unsigned)
            - name: ledger-key
              mountPath: /secrets/ledger-key
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              # room for model fits and builds run by the agents (dell-r620 has ~170Gi free)
              memory: 48Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homelab-agent-data
        - name: keys
          secret:
            secretName: homelab-agent-keys
            defaultMode: 0400
        - name: mcp-secrets
          secret:
            secretName: homelab-agent-mcp
            optional: true
            defaultMode: 0440
        - name: ledger-key
          secret:
            secretName: professor-ledger-key
            optional: true
            defaultMode: 0440
        - name: ssh
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
