# Everything comes from 1Password: every field of "Homelab Agent Credentials"
# (created by tooling/scripts/setup-credentials/setup-homelab-agent-credentials.sh;
# the Twilio and Jev fields may be added later) plus the read-only Grafana
# service account token in "Observability Credentials".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-agent
  namespace: homelab-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: homelab-agent
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: "Homelab Agent Credentials"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
  data:
    - secretKey: grafana-token
      remoteRef:
        key: "Observability Credentials"
        property: grafana-mcp-readonly-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Tyler's agent keys, mounted ONLY into the key sidecar (MODE=keys): "Agent SSH Key"
# authenticates git to GitHub, "Agent SSH Signing Key" signs commits as Tyler.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-agent-keys
  namespace: homelab-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: homelab-agent-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: auth-private-key
      remoteRef:
        key: "Agent SSH Key"
        property: private key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: signing-private-key
      remoteRef:
        key: "Agent SSH Signing Key"
        property: private key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Secrets for MCP servers configured in the agent's web UI (Settings > MCP servers).
# Every field of the 1Password item "Homelab Agent MCP Secrets" becomes a file the
# UI can reference by name; the values never show in the UI. The mount is optional:
# the agent runs without the item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-agent-mcp
  namespace: homelab-agent
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: homelab-agent-mcp
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: "Homelab Agent MCP Secrets"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      rewrite:
        - regexp:
            source: "[^a-zA-Z0-9._-]"
            target: "-"
    # the tokens for the gates in front of the Gmail and browser MCP servers (generated next to them, pushed to 1Password)
    - extract:
        key: "Google MCP Gate"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - extract:
        key: "Google MCP Gate Assistant"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - extract:
        key: "Browser MCP Gate"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
