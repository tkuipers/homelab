apiVersion: v1
kind: Service
metadata:
  name: homelab-agent
  namespace: homelab-agent
  labels:
    app: homelab-agent
spec:
  selector:
    app: homelab-agent
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-agent-relay
  namespace: homelab-agent
  labels:
    app: homelab-agent-relay
spec:
  selector:
    app: homelab-agent-relay
  ports:
    - name: http
      port: 80
      targetPort: http
