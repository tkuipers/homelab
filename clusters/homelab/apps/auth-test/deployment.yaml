apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-test
  namespace: auth-test
  labels:
    app: auth-test
    tags.datadoghq.com/env: homelab
    tags.datadoghq.com/service: auth-test
    tags.datadoghq.com/version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-test
  template:
    metadata:
      labels:
        app: auth-test
        tags.datadoghq.com/env: homelab
        tags.datadoghq.com/service: auth-test
        tags.datadoghq.com/version: "1.0"
      annotations:
        ad.datadoghq.com/auth-test.logs: '[{"source":"nginx","service":"auth-test"}]'
    spec:
      containers:
      - name: auth-test
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: content
          mountPath: /usr/share/nginx/html
          readOnly: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
      volumes:
      - name: content
        configMap:
          name: auth-test-content

