apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-test
  namespace: auth-test
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: protected.tkuipers.ca
    nginx.ingress.kubernetes.io/auth-url: http://authentik-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/nginx
    nginx.ingress.kubernetes.io/auth-signin: https://auth.tkuipers.ca/outpost.goauthentik.io/start?rd=$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - protected.tkuipers.ca
    secretName: auth-test-tls
  rules:
  - host: protected.tkuipers.ca
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: auth-test
            port:
              number: 80

