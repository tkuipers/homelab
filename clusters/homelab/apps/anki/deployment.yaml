apiVersion: apps/v1
kind: Deployment
metadata:
  name: anki
  namespace: anki
  labels:
    app: anki
spec:
  replicas: 1
  # one server at a time on the SQLite collections in the hostPath
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: anki
  template:
    metadata:
      labels:
        app: anki
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      # one-time cold copy of the 25.09 server data before 26.09
      initContainers:
        - name: data-copy-pre-26
          image: busybox:1.38.0
          command: ["/bin/sh", "-c"]
          args:
            - '[ -d /persist/anki-data.bak-25.09 ] || cp -a /persist/anki-data /persist/anki-data.bak-25.09'
          volumeMounts:
            - name: persist
              mountPath: /persist
      containers:
        - name: anki
          # renovate: datasource=docker
          image: neilalcoseba/anki-sync:26.09.4
          ports:
            - containerPort: 8084
              name: http
          env:
            - name: SYNC_USER1
              valueFrom:
                secretKeyRef:
                  name: anki-credentials
                  key: sync_user1
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          hostPath:
            path: /var/persist/anki-data
            type: DirectoryOrCreate
        - name: persist
          hostPath:
            path: /var/persist
            type: Directory
