apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anki
  namespace: anki
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - anki.tkuipers.ca
      secretName: anki-tkuipers-ca-tls
  rules:
    - host: anki.tkuipers.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: anki
                port:
                  number: 8084
