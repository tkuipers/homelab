apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: polymarket-credentials
  namespace: polymarket-bot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: polymarket-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # Bot env vars (consumed by polymarket_bot.main + redeem.py)
        POLY_CLOB_HOST: "{{ .poly_clob_host }}"
        POLYGON_RPC_URL: "{{ .polygon_rpc_url }}"
        WALLET_PRIVATE_KEY: "{{ .wallet_private_key }}"
        POLY_API_KEY: "{{ .poly_api_key }}"
        POLY_API_SECRET: "{{ .poly_api_secret }}"
        POLY_API_PASSPHRASE: "{{ .poly_api_passphrase }}"
        POLY_FUNDER: "{{ .poly_funder }}"
        POLY_SIGNATURE_TYPE: "{{ .poly_signature_type }}"
        POLY_PROXY_ADDRESS: "{{ .poly_proxy_address }}"
        BUILDER_API_KEY: "{{ .builder_api_key }}"
        BUILDER_SECRET: "{{ .builder_secret }}"
        BUILDER_PASS_PHRASE: "{{ .builder_pass_phrase }}"
        RELAYER_URL: "{{ .relayer_url }}"
        # V2 own-wallet relayer auth — unlimited daily quota for own-wallet
        # operations. The bot prefers this over the legacy BUILDER_API
        # HMAC triple when both are set. See redeem._OwnWalletRelayClient.
        RELAYER_API_KEY: "{{ .relayer_api_key }}"
        RELAYER_API_KEY_ADDRESS: "{{ .relayer_api_key_address }}"
        # Postgres — split fields (used by the postgres pod) plus a fully-
        # formed DATABASE_URL the bot reads directly via env.
        postgres-user: "{{ .postgres_user }}"
        postgres-password: "{{ .postgres_password }}"
        postgres-database: "{{ .postgres_database }}"
        DATABASE_URL: "postgresql://{{ .postgres_user }}:{{ .postgres_password }}@postgres:5432/{{ .postgres_database }}"
  data:
    - secretKey: poly_clob_host
      remoteRef: { key: "Polymarket Bot", property: poly-clob-host }
    - secretKey: polygon_rpc_url
      remoteRef: { key: "Polymarket Bot", property: polygon-rpc-url }
    - secretKey: wallet_private_key
      remoteRef: { key: "Polymarket Bot", property: wallet-private-key }
    - secretKey: poly_api_key
      remoteRef: { key: "Polymarket Bot", property: poly-api-key }
    - secretKey: poly_api_secret
      remoteRef: { key: "Polymarket Bot", property: poly-api-secret }
    - secretKey: poly_api_passphrase
      remoteRef: { key: "Polymarket Bot", property: poly-api-passphrase }
    - secretKey: poly_funder
      remoteRef: { key: "Polymarket Bot", property: poly-funder }
    - secretKey: poly_signature_type
      remoteRef: { key: "Polymarket Bot", property: poly-signature-type }
    - secretKey: poly_proxy_address
      remoteRef: { key: "Polymarket Bot", property: poly-proxy-address }
    - secretKey: builder_api_key
      remoteRef: { key: "Polymarket Bot", property: builder-api-key }
    - secretKey: builder_secret
      remoteRef: { key: "Polymarket Bot", property: builder-secret }
    - secretKey: builder_pass_phrase
      remoteRef: { key: "Polymarket Bot", property: builder-pass-phrase }
    - secretKey: relayer_url
      remoteRef: { key: "Polymarket Bot", property: relayer-url }
    - secretKey: relayer_api_key
      remoteRef: { key: "Polymarket Bot", property: relayer-api-key }
    - secretKey: relayer_api_key_address
      remoteRef: { key: "Polymarket Bot", property: relayer-api-key-address }
    - secretKey: postgres_user
      remoteRef: { key: "Polymarket Bot", property: postgres-user }
    - secretKey: postgres_password
      remoteRef: { key: "Polymarket Bot", property: postgres-password }
    - secretKey: postgres_database
      remoteRef: { key: "Polymarket Bot", property: postgres-database }
