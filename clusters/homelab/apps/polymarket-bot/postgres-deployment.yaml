apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: polymarket-bot
  labels:
    app: polymarket-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: polymarket-postgres
  template:
    metadata:
      labels:
        app: polymarket-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: polymarket-secret
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: polymarket-secret
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: polymarket-secret
                  key: postgres-database
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              # via sh: kubelet only expands $(VAR) from static env values, so the
              # secret-backed POSTGRES_USER became "" and every probe logged
              # FATAL: role "root" does not exist
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              # via sh: kubelet only expands $(VAR) from static env values, so the
              # secret-backed POSTGRES_USER became "" and every probe logged
              # FATAL: role "root" does not exist
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
        # Prometheus metrics (connections, transactions, locks, db size);
        # scraped by the "app-exporters" PodMonitor in infrastructure/observability
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          env:
            - name: PGDB
              valueFrom:
                secretKeyRef:
                  name: polymarket-secret
                  key: postgres-database
            - name: DATA_SOURCE_URI
              value: "localhost:5432/$(PGDB)?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: polymarket-secret
                  key: postgres-user
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: polymarket-secret
                  key: postgres-password
          ports:
            - containerPort: 9187
              name: metrics
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: data
          hostPath:
            path: /var/persist/polymarket-postgres
            type: DirectoryOrCreate
