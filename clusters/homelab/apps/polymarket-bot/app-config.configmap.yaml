apiVersion: v1
kind: ConfigMap
metadata:
  name: bot-config
  namespace: polymarket-bot
  labels:
    app: polymarket-bot
data:
  # Mirror of ~/polymarket-bot/config.yaml. Edit this file (or run kustomize
  # edit) and ``kubectl rollout restart deployment/bot`` to pick the change
  # up. The bot reads $BOT_CONFIG from the env; the app-deployment mounts
  # this ConfigMap at /etc/polymarket-bot/config.yaml and overrides the env
  # so the in-image config.yaml is shadowed.
  config.yaml: |
    # Strategy + risk parameters. Edit this ConfigMap then `kubectl rollout
    # restart deployment/bot -n polymarket-bot` — the bot reads this file at
    # startup and captures the values into the scanner/monitor loops.
    # (No live reload; a pod restart is required for changes to take effect.)

    strategy:
      # Entry band on the side's ask price. Same band applies to YES and NO
      # when enable_no_side is True — the v5 "cheap tail" thesis is symmetric.
      yes_ask_min: 0.10
      yes_ask_max: 0.20

      # When True, the scanner evaluates each market on both YES and NO,
      # using the same price band and time window. Per-(market, side) dedup
      # lets a single market hold one YES leg AND one NO leg concurrently
      # (the v5 backtest's paired-entry case is profitable: paired markets
      # were 13/13 net-positive at +175% capw on the paired-only subset).
      enable_no_side: true

      # Days until close window. The v5 sweep showed the lower bound at 1
      # (not 3) improves capw — the strongest edge is in markets within a
      # week of resolution.
      days_until_close_min: 1
      days_until_close_max: 21

      # Quality / liquidity filters
      min_lifetime_volume_usd: 50_000
      min_24h_volume_usd: 500
      max_spread: 0.03                  # yes_ask - yes_bid
      max_last_trade_age_seconds: 3600
      position_size_max_fraction_of_book: 0.5

      # Use Polymarket's published taxonomy. Every market has a `feeType`
      # (politics_fees, sports_fees_v2, crypto_fees_v2, tech_fees,
      # culture_fees, economics_fees, general_fees, finance_prices_fees,
      # or null). We exclude sports + crypto buckets at the source. This
      # replaces the prior regex-based sports/crypto matching, which kept
      # leaking edge cases like T20 cricket (live -$0.67 on position #184,
      # 2026-05-26).
      excluded_fee_types:
        - "sports_fees_v2"
        - "crypto_fees_v2"
      # Belt-and-braces: any market with a non-null `sportsMarketType`
      # (moneyline / spread / total) is rejected as sports even when its
      # `feeType` is missing. Catches legacy sports rows that pre-date
      # the v2 fee schedule.
      exclude_sports_markets: true

      # category from Gamma is null on every row — kept for forward
      # compat only.
      excluded_categories: []
      # Regex backstop. The feeType filter above is now load-bearing.
      # Kept narrow for the few intraday gamblety questions Polymarket
      # sometimes publishes without a sports feeType.
      excluded_question_patterns:
        - "(?i)\\bup or down\\b"
        - "(?i)next ?(5|15|30) ?min"

      # Reject negRisk (categorical-event sub-) markets at the filter
      # layer. v3 backtest shows ~+7% per-trade ROI on this bucket with
      # a 52% win rate, vs ~+29% / 71% on pure binary — and the spread
      # tax can push that down toward break-even. Flip to false to
      # re-include them once the edge improves.
      exclude_neg_risk: true

      # Exit rule (hybrid take-profit; no stop-loss by design)
      take_profit_trigger: 1.50          # yes_bid >= entry * trigger
      take_profit_sell_fraction: 0.75    # sell this fraction at trigger; hold the rest to resolution

    risk:
      # v5 backtest used $2.00 ticket / $75 total cap / $5 reserve — matching
      # those here so live behaviour tracks the simulation that produced
      # +40.8% capw with paired YES+NO entries enabled.
      max_position_size_usd: 2.00
      max_concurrent_positions: 40000
      # Hard caps on absolute loss exposure. The effective ceiling is whichever
      # cap binds first — at $2.00/position with $75 total, the practical
      # bound is ~37 simultaneous positions.
      max_daily_deployment_usd: 10000
      max_total_deployment_usd: 75
      usdc_reserve_min: 5
      # Smaller ticket for negRisk (categorical-event) markets. Backtest
      # shows the per-trade edge is meaningfully weaker on negRisk
      # (~+16% vs ~+37% on pure binary). Still worth trading them so
      # capital keeps cycling when binary candidates are scarce, but at
      # a smaller bet and lower priority. $1.01 is just above the
      # $1.00 viable floor.
      max_position_size_usd_neg_risk: 1.50
      # Tuned for the strategy's 38.8% per-trade loss rate. At threshold=5, random
      # variance trips the breaker ~6x per 90 days (false positives). At 12, the
      # expected false-trip rate is ~0.008 per 90 days — only fires if the edge
      # has actually broken (loss rate spikes well above 50%). Will be replaced
      # by the rolling-drawdown breaker spec'd in PLAN.md.
      consecutive_loss_circuit_breaker: 12

    runtime:
      scan_interval_seconds: 300         # 5 min
      monitor_interval_seconds: 60       # 1 min
      bankroll_snapshot_interval_seconds: 300
      resolution_sweep_interval_seconds: 300
      http_timeout_seconds: 20

    trading:
      # Master switch. The bot ALSO honours bot_state.trading_enabled in the DB;
      # if either this OR the DB flag is False, the executor is a no-op.
      # The DB-side flag is the operator-facing toggle (Pause/Resume button).
      enabled: true
