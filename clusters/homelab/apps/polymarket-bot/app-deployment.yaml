apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  namespace: polymarket-bot
  labels:
    app: polymarket-bot
spec:
  # IMPORTANT: replicas must be 1. The bot holds in-memory state for the
  # circuit-breaker counter and assumes single-process ownership of the DB.
  # Two replicas WOULD double-trade.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: polymarket-bot
  template:
    metadata:
      labels:
        app: polymarket-bot
      annotations:
        ad.datadoghq.com/bot.logs: '[{"source":"python","service":"polymarket-bot"}]'
    spec:
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      imagePullSecrets:
        - name: ghcr-secret
      # DNS via the cluster's coredns so the bot can resolve postgres.
      # polymarket-bot.svc.cluster.local (in-cluster), in addition to
      # external Polymarket / Polygon-RPC hostnames which gluetun resolves
      # via the VPN. ``dnsPolicy: ClusterFirst`` is the default but gluetun's
      # DNS override would otherwise force 1.1.1.1; we tell gluetun to use
      # coredns so in-cluster resolution keeps working.
      containers:
        # AirVPN sidecar — same pattern as mediacenter/sabnzbd. Owns the
        # pod's network namespace via NET_ADMIN. The bot container shares
        # this network, so all bot traffic egresses through wireguard.
        - name: gluetun
          image: qmcgaw/gluetun:latest
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          # Service traffic (nginx-ingress -> :8080) needs to reach the bot
          # *through* gluetun's network namespace, so we expose the port on
          # the sidecar where ports actually live.
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "airvpn"
            - name: VPN_TYPE
              value: "wireguard"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef: { name: airvpn-credentials, key: private_key }
            - name: WIREGUARD_PRESHARED_KEY
              valueFrom:
                secretKeyRef: { name: airvpn-credentials, key: preshared_key }
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef: { name: airvpn-credentials, key: addresses }
            - name: SERVER_COUNTRIES
              valueFrom:
                secretKeyRef: { name: airvpn-credentials, key: server_country }
            # Keep in-cluster traffic local: postgres (10.103.x), coredns
            # (10.96.0.10), and the rest of the cluster all live under
            # 10.0.0.0/8. Without this, the bot can't reach its DB.
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.0.0.0/8"
            # Use cluster coredns instead of gluetun's default 1.1.1.1 so
            # in-cluster hostnames (postgres.polymarket-bot.svc...) still
            # resolve. coredns forwards external lookups upstream, so
            # Polymarket / Polygon hostnames still work — just through
            # coredns first.
            - name: DNS_ADDRESS
              value: "10.96.0.10"
            - name: DOT
              value: "off"
            - name: LOG_LEVEL
              value: "info"
            - name: TZ
              value: "America/Los_Angeles"
          resources:
            requests:
              memory: "64Mi"
              cpu: "20m"
            limits:
              memory: "256Mi"
              cpu: "200m"
        - name: bot
          # renovate: datasource=docker
          image: ghcr.io/tkuipers/polymarket-bot:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: polymarket-secret
          env:
            - name: BOT_DB
              value: /app/data/bot.db   # unused when DATABASE_URL is set, but kept for sanity
            - name: BOT_CONFIG          # shadows the in-image /app/config.yaml
              value: /etc/polymarket-bot/config.yaml
            - name: WEB_PORT
              value: "8080"
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_SERVICE
              value: polymarket-bot
            - name: DD_ENV
              value: production
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /etc/polymarket-bot
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        # The bot's only on-disk state is data/bot.db (SQLite). With Postgres
        # as the backing store this volume is effectively unused at runtime,
        # but the code still references the path for the seed-demo mode and
        # initial schema apply, so we keep a small emptyDir.
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: bot-config
            items:
              - key: config.yaml
                path: config.yaml
