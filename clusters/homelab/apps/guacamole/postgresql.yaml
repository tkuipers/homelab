---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: guacamole
data:
  pg_hba.conf: |
    # PostgreSQL Client Authentication Configuration File
    # TYPE  DATABASE        USER            ADDRESS                 METHOD

    # "local" is for Unix domain socket connections only
    local   all             all                                     trust
    # IPv4 local connections:
    host    all             all             127.0.0.1/32            trust
    # IPv6 local connections:
    host    all             all             ::1/128                 trust
    # Allow replication connections from localhost, by a user with the
    # replication privilege.
    local   replication     all                                     trust
    host    replication     all             127.0.0.1/32            trust
    host    replication     all             ::1/128                 trust

    # All other connections use md5 authentication
    host all all all md5
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: guacamole-postgres-pvc
  namespace: guacamole
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
  volumeName: guacamole-postgres-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-postgres
  namespace: guacamole
  labels:
    app: guacamole-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacamole-postgres
  template:
    metadata:
      labels:
        app: guacamole-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        command: ["docker-entrypoint.sh"]
        args: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: guacamole-postgres-secret
              key: database
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: guacamole-postgres-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: guacamole-postgres-secret
              key: postgres-password
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: postgres-config
          mountPath: /etc/postgresql
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: guacamole-postgres-pvc
      - name: postgres-config
        configMap:
          name: postgres-config
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole-postgres
  namespace: guacamole
  labels:
    app: guacamole-postgres
spec:
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    app: guacamole-postgres
  type: ClusterIP 