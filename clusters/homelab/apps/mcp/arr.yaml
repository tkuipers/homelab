# Sonarr, Radarr and Prowlarr for the homelab agent: aplaceforallmystuff/mcp-arr (upstream image pinned by
# digest), Streamable HTTP. Like the Gmail server it has no auth of its own, so it listens on
# 127.0.0.1 and the gate sidecar (the agent image, MODE=mcpgate) requires a shared bearer token,
# generated here, pushed to 1Password ("Arr MCP Gate") and read back by the agent's MCP secrets.
#
# The API keys are the ones Prowlarr, Jellyseerr and exportarr already use: read at start from
# each app's config.xml (hostPath on dell-r620, read-only, by an init container), the same way
# the arr-integration-job does. Its own namespace because hostPath needs a privileged one.
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-arr
  labels:
    # hostPath (the two config.xml files); the containers themselves run restricted
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-credentials
  namespace: mcp-arr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "{{ .username }}",
                "password": "{{ .token }}",
                "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef: {key: "GitHub Container Registry", property: username, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None}
    - secretKey: token
      remoteRef: {key: "GitHub Container Registry", property: token, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: arr-mcp-gate
  namespace: mcp-arr
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arr-mcp-gate
  namespace: mcp-arr
spec:
  refreshInterval: "0"  # generated once
  target:
    name: arr-mcp-gate
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        arr-mcp-authorization: "Bearer {{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: arr-mcp-gate
---
# the agent (homelab-agent namespace) reads it from 1Password with its other MCP secrets
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: arr-mcp-gate
  namespace: mcp-arr
spec:
  refreshInterval: 1h
  deletionPolicy: None
  updatePolicy: Replace
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-store
  selector:
    secret:
      name: arr-mcp-gate
  data:
    - conversionStrategy: None
      match:
        secretKey: arr-mcp-authorization
        remoteRef:
          remoteKey: Arr MCP Gate
          property: arr-mcp-authorization
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arr-mcp
  namespace: mcp-arr
  labels:
    app: arr-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arr-mcp
  template:
    metadata:
      labels:
        app: arr-mcp
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: dell-r620  # where the *arr config lives
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # copies just the two API keys out of the config directories (single-file hostPath mounts
      # fail on Talos), so the server never sees the rest of the *arr config
      initContainers:
        - name: api-keys
          image: ghcr.io/aplaceforallmystuff/mcp-arr@sha256:ace72c56448e8695e1d2d060e7437470e3f883fcc9316f1294e3a7f682e1efa1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command:
            - sh
            - -ec
            - |
              for app in sonarr radarr prowlarr; do
                key=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /arr/$app/config.xml)
                [ -n "$key" ] || { echo "no ApiKey in $app config.xml" >&2; exit 1; }
                printf %s "$key" > /keys/$app
              done
          volumeMounts:
            - {name: sonarr-config, mountPath: /arr/sonarr, readOnly: true}
            - {name: radarr-config, mountPath: /arr/radarr, readOnly: true}
            - {name: prowlarr-config, mountPath: /arr/prowlarr, readOnly: true}
            - {name: keys, mountPath: /keys}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
      containers:
        - name: mcp-arr
          # 1.7.3
          image: ghcr.io/aplaceforallmystuff/mcp-arr@sha256:ace72c56448e8695e1d2d060e7437470e3f883fcc9316f1294e3a7f682e1efa1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command:
            - sh
            - -c
            - SONARR_API_KEY=$(cat /keys/sonarr) RADARR_API_KEY=$(cat /keys/radarr) PROWLARR_API_KEY=$(cat /keys/prowlarr) exec node dist/index.js
          env:
            - name: MCP_TRANSPORT
              value: http
            - name: HOST
              value: 127.0.0.1  # only the gate reaches it
            - name: PORT
              value: "3000"
            - name: SONARR_URL
              value: http://sonarr.mediacenter.svc.cluster.local:8989
            - name: RADARR_URL
              value: http://radarr.mediacenter.svc.cluster.local:7878
            - name: PROWLARR_URL
              value: http://prowlarr.mediacenter.svc.cluster.local:9696
          volumeMounts:
            - {name: keys, mountPath: /keys, readOnly: true}
          resources:
            requests: {cpu: 5m, memory: 64Mi}
            limits: {memory: 256Mi}
        - name: gate
          image: ghcr.io/tkuipers/homelab-agent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: MODE
              value: mcpgate
            - name: GATE_UPSTREAM_PORT
              value: "3000"
            - name: GATE_OPEN_PATHS
              value: ""  # every request needs the token
            - name: GATE_AUTHORIZATION
              valueFrom: {secretKeyRef: {name: arr-mcp-gate, key: arr-mcp-authorization}}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /gate/healthz, port: http}
          resources:
            requests: {cpu: 5m, memory: 48Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: sonarr-config
          hostPath: {path: /var/persist/sonarr-config, type: Directory}
        - name: radarr-config
          hostPath: {path: /var/persist/radarr-config, type: Directory}
        - name: prowlarr-config
          hostPath: {path: /var/persist/prowlarr-config, type: Directory}
        - name: keys
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: arr-mcp
  namespace: mcp-arr
spec:
  selector:
    app: arr-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
