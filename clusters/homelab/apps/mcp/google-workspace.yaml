# Gmail for the homelab agent: taylorwilsdon/google_workspace_mcp (image built from
# homelab-agent/images/workspace-mcp, Gmail tools only, single user tkuipers123@gmail.com).
#
# It has no auth of its own and the cluster network doesn't enforce NetworkPolicies, so it
# listens on 127.0.0.1 only and a gate sidecar (the agent image, MODE=mcpgate) in front of it
# requires a shared bearer token. The token is generated here, pushed to 1Password ("Google
# MCP Gate") and read back by the agent's MCP secrets. Only /oauth2callback (Google's
# redirect after the one-time consent) is reachable from outside, behind Authelia.
#
# The Google OAuth client comes from 1Password "Google Workspace MCP" (client-id,
# client-secret); the refresh token lives on the PVC (local-path, so the pod stays on the node
# that first ran it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: google-workspace-mcp-oauth
  namespace: mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: google-workspace-mcp-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-id
      remoteRef: {key: "Google Workspace MCP", property: client-id, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None}
    - secretKey: client-secret
      remoteRef: {key: "Google Workspace MCP", property: client-secret, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: google-mcp-gate
  namespace: mcp
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: google-mcp-gate
  namespace: mcp
spec:
  refreshInterval: "0"  # generated once
  target:
    name: google-mcp-gate
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        google-mcp-authorization: "Bearer {{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: google-mcp-gate
---
# the agent (homelab-agent namespace) reads it from 1Password with its other MCP secrets
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: google-mcp-gate
  namespace: mcp
spec:
  refreshInterval: 1h
  deletionPolicy: None
  updatePolicy: Replace
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-store
  selector:
    secret:
      name: google-mcp-gate
  data:
    - conversionStrategy: None
      match:
        secretKey: google-mcp-authorization
        remoteRef:
          remoteKey: Google MCP Gate
          property: google-mcp-authorization
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: google-workspace-mcp
  namespace: mcp
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: google-workspace-mcp
  namespace: mcp
  labels:
    app: google-workspace-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate  # one writer on the credentials volume
  selector:
    matchLabels:
      app: google-workspace-mcp
  template:
    metadata:
      labels:
        app: google-workspace-mcp
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workspace-mcp
          image: ghcr.io/tkuipers/workspace-mcp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: GOOGLE_OAUTH_CLIENT_ID
              valueFrom: {secretKeyRef: {name: google-workspace-mcp-oauth, key: client-id}}
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: google-workspace-mcp-oauth, key: client-secret}}
            - name: USER_GOOGLE_EMAIL
              value: tkuipers123@gmail.com
            - name: WORKSPACE_EXTERNAL_URL
              value: https://google-mcp.tkuipers.ca
            - name: WORKSPACE_MCP_HOST
              value: 127.0.0.1  # only the gate reaches it
            - name: WORKSPACE_MCP_PORT
              value: "8000"
            - name: WORKSPACE_MCP_CREDENTIALS_DIR
              value: /data/credentials
            - name: HOME
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: {cpu: 10m, memory: 128Mi}
            limits: {memory: 512Mi}
        - name: gate
          image: ghcr.io/tkuipers/homelab-agent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: MODE
              value: mcpgate
            - name: GATE_UPSTREAM_PORT
              value: "8000"
            - name: GATE_AUTHORIZATION
              valueFrom: {secretKeyRef: {name: google-mcp-gate, key: google-mcp-authorization}}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /gate/healthz, port: http}
          resources:
            requests: {cpu: 5m, memory: 48Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: google-workspace-mcp
---
apiVersion: v1
kind: Service
metadata:
  name: google-mcp
  namespace: mcp
spec:
  selector:
    app: google-workspace-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Only Google's OAuth redirect, and only for Tyler's browser (Authelia)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: google-mcp
  namespace: mcp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/auth-url: http://authelia.authelia.svc.cluster.local/api/authz/auth-request
    nginx.ingress.kubernetes.io/auth-signin: https://auth.tkuipers.ca/?rd=https://$host$escaped_request_uri
spec:
  ingressClassName: nginx
  tls:
  - hosts: [google-mcp.tkuipers.ca]
    secretName: google-mcp-tkuipers-ca-tls
  rules:
  - host: google-mcp.tkuipers.ca
    http:
      paths:
      - path: /oauth2callback
        pathType: Exact
        backend:
          service:
            name: google-mcp
            port:
              number: 80
