apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-guesser-config
  namespace: stock-guesser
data:
  config.yaml: |
    appName: Stocker
    logLevel: INFO

    training:
      pop_size: 4
      num_generations: 3
      test_runs: 2
      max_layers: 100
      max_batch: 32

    model:
      path: /models/stock-guesser.keras

    tone:
      ibm:
        watson:
          endpoint: /v1/analyze
          params:
            version: 2022-04-07

    news:
      source:
        newsapi:
          sources:
            - business-insider
            - reuters
            - the-wall-street-journal
            - the-verge
            - ars-technica
            - wired

    stocks:
      watch:
        - name: Uber
          alias:
            - Uber
          ticker: UBER
          market: NYSE
        - name: Google
          alias:
            - Google
            - Alphabet
          ticker: GOOG
          market: NASDAQ
        - name: Ford Motor Co.
          alias:
            - Ford
          ticker: F
          market: NYSE
        - name: Boeing
          alias:
            - Boeing
          ticker: BA
          market: NYSE
        - name: NVIDIA
          alias:
            - NVIDIA
            - Nvidia
          ticker: NVDA
          market: NASDAQ
        - name: Tesla
          alias:
            - Tesla
          ticker: TSLA
          market: NASDAQ
