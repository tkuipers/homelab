apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-guesser-config
  namespace: stock-guesser
data:
  config.yaml: |
    appName: Stocker
    logLevel: INFO

    training:
      pop_size: 16
      num_generations: 50
      test_runs: 5
      max_layers: 100
      max_batch: 64
      mating_size: 6

    model:
      path: /models/stock-guesser.keras

    tone:
      ibm:
        watson:
          endpoint: /v1/analyze
          params:
            version: 2022-04-07

    news:
      source:
        newsapi:
          sources:
            - business-insider
            - reuters
            - the-wall-street-journal
            - the-verge
            - ars-technica
            - wired

    stocks:
      watch:
        - name: Uber
          alias:
            - Uber
          ticker: UBER
          market: NYSE
        - name: Google
          alias:
            - Google
            - Alphabet
          ticker: GOOG
          market: NASDAQ
