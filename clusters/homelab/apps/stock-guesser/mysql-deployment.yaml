apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: stock-guesser
  labels:
    app: stock-guesser-mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stock-guesser-mysql
  template:
    metadata:
      labels:
        app: stock-guesser-mysql
    spec:
      nodeSelector:
        kubernetes.io/hostname: omen-worker1
      # 8.0 -> 8.4 upgrades the data dictionary in place (no way back): keep a cold
      # copy of the 8.0 data dir, taken while MySQL is stopped (Recreate).
      initContainers:
        - name: datadir-copy-pre-84
          image: busybox:1.38.0
          command: ["/bin/sh", "-c"]
          args:
            - '[ -d /persist/stock-guesser-mysql.bak-8.0 ] || cp -a /persist/stock-guesser-mysql /persist/stock-guesser-mysql.bak-8.0'
          volumeMounts:
            - name: persist
              mountPath: /persist
      containers:
        - name: mysql
          # 8.0 reached end of life in April 2026; 8.4 is the LTS line
          image: mysql:8.4.13
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stock-guesser-secret
                  key: mysql-root-password
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: stock-guesser-secret
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stock-guesser-secret
                  key: mysql-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: stock-guesser-secret
                  key: mysql-database
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-config
              mountPath: /etc/mysql/conf.d
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          startupProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: mysql-data
          hostPath:
            path: /var/persist/stock-guesser-mysql
            type: DirectoryOrCreate
        - name: mysql-config
          configMap:
            name: mysql-config
        - name: persist
          hostPath:
            path: /var/persist
            type: Directory
