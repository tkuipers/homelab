apiVersion: batch/v1
kind: CronJob
metadata:
  name: stock-guesser-training
  namespace: stock-guesser
  labels:
    app: stock-guesser-training
spec:
  schedule: "0 0 * * *"  # Daily at midnight
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # runs take ~5h; a hung run (2026-09-23, no output for 18 days) blocked every
      # later run because of concurrencyPolicy: Forbid
      activeDeadlineSeconds: 43200
      template:
        metadata:
          labels:
            app: stock-guesser-training
        spec:
          nodeSelector:
            kubernetes.io/hostname: omen-worker1
          restartPolicy: Never
          runtimeClassName: nvidia
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: training
              # renovate: datasource=docker
              image: ghcr.io/tkuipers/stock-info:d26b44d
              command:
                - python
                - NetworkTrainer.py
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: stock-guesser-secret
                      key: database-url
                - name: WATSON_URL
                  valueFrom:
                    secretKeyRef:
                      name: stock-guesser-secret
                      key: watson-url
                - name: WATSON_KEY
                  valueFrom:
                    secretKeyRef:
                      name: stock-guesser-secret
                      key: watson-key
                - name: NEWSAPI_KEY
                  valueFrom:
                    secretKeyRef:
                      name: stock-guesser-secret
                      key: newsapi-key
                - name: STOCKER_CONFIG_PATH
                  value: /config/config.yaml
                - name: MODEL_PATH
                  value: /models/stock-guesser.keras
                # TensorFlow/CUDA logging suppression
                - name: TF_CPP_MIN_LOG_LEVEL
                  value: "3"
                - name: ABSL_MIN_LOG_LEVEL
                  value: "3"
                - name: TF_FORCE_GPU_ALLOW_GROWTH
                  value: "true"
                - name: TF_ENABLE_ONEDNN_OPTS
                  value: "0"
                - name: TF_AUTOGRAPH_VERBOSITY
                  value: "0"
                - name: CUDA_MODULE_LOADING
                  value: "LAZY"
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: models
                  mountPath: /models
              resources:
                requests:
                  memory: "4Gi"
                  cpu: "1000m"
                limits:
                  memory: "16Gi"
                  cpu: "4000m"
                  nvidia.com/gpu: 1
          volumes:
            - name: config
              configMap:
                name: stock-guesser-config
            - name: models
              hostPath:
                path: /var/persist/stock-guesser-models
                type: DirectoryOrCreate
