apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stock-guesser-credentials
  namespace: stock-guesser
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: stock-guesser-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        database-url: "mysql+mysqldb://{{ .mysqluser }}:{{ .mysqlpassword }}@mysql:3306/{{ .mysqldatabase }}"
        mysql-root-password: "{{ .mysqlrootpassword }}"
        mysql-user: "{{ .mysqluser }}"
        mysql-password: "{{ .mysqlpassword }}"
        mysql-database: "{{ .mysqldatabase }}"
        newsapi-key: "{{ .newsapikey }}"
        watson-url: "{{ .watsonurl }}"
        watson-key: "{{ .watsonkey }}"
        aws-access-key-id: "{{ .awsaccesskeyid }}"
        aws-secret-access-key: "{{ .awssecretaccesskey }}"
        s3-bucket: "{{ .s3bucket }}"
        s3-region: "{{ .s3region }}"
  data:
    # MySQL credentials
    - secretKey: mysqlrootpassword
      remoteRef:
        key: "Stock Guesser"
        property: mysql-root-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: mysqluser
      remoteRef:
        key: "Stock Guesser"
        property: mysql-username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: mysqlpassword
      remoteRef:
        key: "Stock Guesser"
        property: mysql-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: mysqldatabase
      remoteRef:
        key: "Stock Guesser"
        property: mysql-database
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # NewsAPI
    - secretKey: newsapikey
      remoteRef:
        key: "Stock Guesser"
        property: newsapi-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Watson Tone Analyzer
    - secretKey: watsonurl
      remoteRef:
        key: "Stock Guesser"
        property: watson-url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: watsonkey
      remoteRef:
        key: "Stock Guesser"
        property: watson-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # AWS S3 Backup
    - secretKey: awsaccesskeyid
      remoteRef:
        key: "Stock Guesser"
        property: aws-access-key-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: awssecretaccesskey
      remoteRef:
        key: "Stock Guesser"
        property: aws-secret-access-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: s3bucket
      remoteRef:
        key: "Stock Guesser"
        property: s3-bucket
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: s3region
      remoteRef:
        key: "Stock Guesser"
        property: s3-region
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
