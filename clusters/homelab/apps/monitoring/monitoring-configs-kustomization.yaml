apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-configs
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  path: ./clusters/homelab/apps/monitoring/configs
  prune: true
  wait: true
  dependsOn:
    - name: monitoring-stack 