---
# Mediacenter ServiceMonitors
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jellyfin
  namespace: monitoring
  labels:
    app: jellyfin
spec:
  selector:
    matchLabels:
      app: jellyfin
  namespaceSelector:
    matchNames:
    - mediacenter
  endpoints:
  - port: http
    interval: 30s
    path: /metrics
