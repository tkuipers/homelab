apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
  - secretKey: admin-user
    remoteRef:
      key: "Grafana Admin"
      property: username
  - secretKey: admin-password
    remoteRef:
      key: "Grafana Admin"
      property: password 