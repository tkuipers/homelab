apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=65.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    createNamespace: true
  targetNamespace: monitoring
  values:
    # Prometheus configuration
    prometheus:
      prometheusSpec:
        # Enable persistent storage for Prometheus
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        # Retention for metrics
        retention: 30d
        # Resource limits
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
          limits:
            memory: 2Gi
            cpu: 1000m
        # Service monitor selector (monitor all services)
        serviceMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        
    # Grafana configuration
    grafana:
      # Enable persistent storage for Grafana
      persistence:
        enabled: true
        size: 15Gi
      
      # Admin credentials from ExternalSecret
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      
      # Resource limits
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 200m
          
      # Grafana configuration
      grafana.ini:
        server:
          domain: watchtower.tkuipers.ca
          root_url: https://watchtower.tkuipers.ca
        security:
          disable_gravatar: true
        users:
          allow_sign_up: false
          auto_assign_org_role: Viewer
          default_theme: dark
          
      # Default data sources (Prometheus will be auto-configured)
      sidecar:
        datasources:
          enabled: true
          defaultDatasourceEnabled: true
        dashboards:
          enabled: true
          searchNamespace: ALL
          
    # AlertManager configuration
    alertmanager:
      alertmanagerSpec:
        # Persistent storage for AlertManager
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 100m
            
    # Node exporter configuration
    nodeExporter:
      enabled: true
      
    # Kube-state-metrics configuration  
    kubeStateMetrics:
      enabled: true
      
    # Default ServiceMonitors for Kubernetes components
    defaultRules:
      create: true
    kubeApiServer:
      enabled: true
    kubelet:
      enabled: true
    kubeControllerManager:
      enabled: true
    coreDns:
      enabled: true
    kubeEtcd:
      enabled: false  # Usually not accessible in managed clusters
    kubeScheduler:
      enabled: true
    kubeProxy:
      enabled: true 