apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llama-api-key
  namespace: ml-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: llama-api-key
    creationPolicy: Owner
  data:
  - secretKey: api-key
    remoteRef:
      key: "LLM Service API Key"
      property: api_key

