apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
  labels:
    app: homeassistant
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
      annotations:
        ad.datadoghq.com/homeassistant.logs: '[{"source":"homeassistant","service":"homeassistant"}]'
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      initContainers:
        # Bootstraps configuration.yaml (trusted_proxies for ingress-nginx),
        # installs hass-oidc-auth at the pinned version, and rewrites a
        # sentinel-bracketed auth_oidc block from the OIDC client secret on
        # every boot (so rotation propagates on pod restart).
        - name: seed-config
          image: busybox:1.36
          env:
            - name: OIDC_INTEGRATION_VERSION
              value: "1.0.2"
            - name: DAIKIN_INTEGRATION_VERSION
              value: "0.10.1"
            - name: DREAME_INTEGRATION_VERSION
              # v2 beta — required for Dreamehome account login (v1.x is Mi cloud only).
              value: "2.0.0b23"
            - name: DREAME_MAP_CARD_VERSION
              value: "1.4.2"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homeassistant-oidc
                  key: client_secret
          command:
            - sh
            - -c
            - |
              set -eu
              CONFIG=/config/configuration.yaml

              # --- Ensure base config + http trusted_proxies block ---
              if [ ! -f "$CONFIG" ]; then
                cat > "$CONFIG" <<'EOF'
              # Loads default set of integrations. Do not remove.
              default_config:

              frontend:
                themes: !include_dir_merge_named themes

              automation: !include automations.yaml
              script: !include scripts.yaml
              scene: !include scenes.yaml

              http:
                use_x_forwarded_for: true
                trusted_proxies:
                  - 10.244.0.0/16
                  - 10.96.0.0/12
              EOF
                touch /config/automations.yaml /config/scripts.yaml /config/scenes.yaml
              elif ! grep -qE '^http:' "$CONFIG"; then
                cat >> "$CONFIG" <<'EOF'

              http:
                use_x_forwarded_for: true
                trusted_proxies:
                  - 10.244.0.0/16
                  - 10.96.0.0/12
              EOF
              fi

              # --- Install/upgrade hass-oidc-auth custom_component ---
              TARGET=/config/custom_components/auth_oidc
              WANT_VER="$OIDC_INTEGRATION_VERSION"
              CURRENT_VER=""
              if [ -f "$TARGET/manifest.json" ]; then
                CURRENT_VER=$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]+"' "$TARGET/manifest.json" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
              fi
              if [ "$CURRENT_VER" != "$WANT_VER" ]; then
                echo "Installing hass-oidc-auth v$WANT_VER (had: ${CURRENT_VER:-none})"
                rm -rf "$TARGET"
                mkdir -p "$TARGET"
                wget -q -O /tmp/auth_oidc.zip "https://github.com/christiaangoossens/hass-oidc-auth/releases/download/v${WANT_VER}/hass-oidc-auth.zip"
                (cd "$TARGET" && unzip -q /tmp/auth_oidc.zip)
                rm /tmp/auth_oidc.zip
              fi

              # --- Install/upgrade ha-daikinone custom_component ---
              TARGET=/config/custom_components/daikinone
              WANT_VER="$DAIKIN_INTEGRATION_VERSION"
              CURRENT_VER=""
              if [ -f "$TARGET/manifest.json" ]; then
                CURRENT_VER=$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]+"' "$TARGET/manifest.json" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
              fi
              if [ "$CURRENT_VER" != "$WANT_VER" ]; then
                echo "Installing ha-daikinone v$WANT_VER (had: ${CURRENT_VER:-none})"
                rm -rf "$TARGET" /tmp/daikin-extract /tmp/daikin.tar.gz
                mkdir -p /tmp/daikin-extract /config/custom_components
                wget -q -O /tmp/daikin.tar.gz "https://github.com/zlangbert/ha-daikinone/archive/refs/tags/v${WANT_VER}.tar.gz"
                tar xz -C /tmp/daikin-extract --strip-components=1 -f /tmp/daikin.tar.gz
                cp -r /tmp/daikin-extract/custom_components/daikinone "$TARGET"
                rm -rf /tmp/daikin.tar.gz /tmp/daikin-extract
              fi

              # --- Install/upgrade dreame-vacuum custom_component ---
              # Release zip is flat (files at the archive root), so unzip directly into the target.
              TARGET=/config/custom_components/dreame_vacuum
              WANT_VER="$DREAME_INTEGRATION_VERSION"
              CURRENT_VER=""
              if [ -f "$TARGET/manifest.json" ]; then
                # Capture beta suffix too (e.g. "2.0.0b23") so we don't redownload every pod start.
                CURRENT_VER=$(grep -oE '"version"[[:space:]]*:[[:space:]]*"v?[^"]+"' "$TARGET/manifest.json" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9]*' || true)
              fi
              if [ "$CURRENT_VER" != "$WANT_VER" ]; then
                echo "Installing dreame-vacuum v$WANT_VER (had: ${CURRENT_VER:-none})"
                rm -rf "$TARGET"
                mkdir -p "$TARGET"
                wget -q -O /tmp/dreame_vacuum.zip "https://github.com/Tasshack/dreame-vacuum/releases/download/v${WANT_VER}/dreame_vacuum.zip"
                (cd "$TARGET" && unzip -q /tmp/dreame_vacuum.zip)
                rm /tmp/dreame_vacuum.zip
              fi

              # --- Install/upgrade dreame-vacuum-map-card (Lovelace JS module) ---
              # Single-file card — drop into /config/www/ so HA serves it at /local/.
              CARD_DIR=/config/www/dreame-vacuum-map-card
              CARD_FILE="$CARD_DIR/dreame-vacuum-map-card.js"
              CARD_VER_FILE="$CARD_DIR/.version"
              CURRENT_VER=""
              if [ -f "$CARD_VER_FILE" ]; then
                CURRENT_VER=$(cat "$CARD_VER_FILE")
              fi
              if [ "$CURRENT_VER" != "$DREAME_MAP_CARD_VERSION" ] || [ ! -f "$CARD_FILE" ]; then
                echo "Installing dreame-vacuum-map-card v$DREAME_MAP_CARD_VERSION (had: ${CURRENT_VER:-none})"
                mkdir -p "$CARD_DIR"
                wget -q -O "$CARD_FILE.tmp" "https://github.com/noambergauz/dreame-vacuum-map-card/releases/download/v${DREAME_MAP_CARD_VERSION}/dreame-vacuum-map-card.js"
                mv "$CARD_FILE.tmp" "$CARD_FILE"
                echo "$DREAME_MAP_CARD_VERSION" > "$CARD_VER_FILE"
              fi

              # --- Sync declarative config from kustomize-generated ConfigMaps ---
              mkdir -p /config/packages /config/dashboards
              rm -f /config/packages/*.yaml /config/dashboards/*.yaml 2>/dev/null || true
              for f in /managed-config/packages/*.yaml; do
                [ -e "$f" ] && cp "$f" /config/packages/
              done
              for f in /managed-config/dashboards/*.yaml; do
                [ -e "$f" ] && cp "$f" /config/dashboards/
              done

              # --- Manage sentinel-bracketed blocks (rewrite on every boot) ---
              # Strip any existing managed blocks so we can rewrite cleanly.
              awk '
                /^# >>> .* managed >>>/ { in_block=1; next }
                /^# <<< .* managed <<</ { in_block=0; next }
                !in_block { print }
              ' "$CONFIG" > "$CONFIG.tmp"

              cat >> "$CONFIG.tmp" <<'EOF'

              # >>> homeassistant managed >>>
              # Managed by the seed-config initContainer.
              # Drop files into managed/packages/ in git to add HA config.
              # Edit managed/dashboards/home.yaml for the declarative dashboard.
              homeassistant:
                packages: !include_dir_named packages
              lovelace:
                mode: storage
                dashboards:
                  home-yaml:
                    mode: yaml
                    filename: dashboards/home.yaml
                    title: Home
                    icon: mdi:home
                    show_in_sidebar: true
              # <<< homeassistant managed <<<
              EOF

              cat >> "$CONFIG.tmp" <<EOF

              # >>> auth_oidc managed >>>
              auth_oidc:
                client_id: "homeassistant"
                client_secret: "$OIDC_CLIENT_SECRET"
                discovery_url: "https://auth.tkuipers.ca/.well-known/openid-configuration"
                display_name: "Authelia"
                features:
                  automatic_user_linking: true
              # <<< auth_oidc managed <<<
              EOF
              mv "$CONFIG.tmp" "$CONFIG"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: managed-packages
              mountPath: /managed-config/packages
              readOnly: true
            - name: managed-dashboards
              mountPath: /managed-config/dashboards
              readOnly: true
      containers:
        - name: homeassistant
          # renovate: datasource=docker
          image: ghcr.io/home-assistant/home-assistant:stable
          ports:
            - containerPort: 8123
              name: http
          env:
            - name: TZ
              value: "America/Los_Angeles"
            - name: HA_HEALTHCHECK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homeassistant-reconciler
                  key: token
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              memory: "1Gi"
              cpu: "100m"
            limits:
              # dreame-vacuum needs serious headroom on first boot: the integration ships
              # ~15MB of bundled map resources + pulls in mini-racer (V8 engine) + numpy +
              # pillow + pycryptodome. Observed peak >4Gi while loading; 8Gi is safe.
              memory: "8Gi"
              cpu: "1000m"
          # Probes hit /api/config (auth-required) so we can detect
          # recovery_mode / safe_mode / non-RUNNING state — / returns
          # 200 even when HA boots into recovery mode after a config error.
          # On 401/403 the probe soft-passes: HTTP layer is up, the token
          # is just bad, so we'd rather degrade detection than restart-loop.
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import json, os, sys, urllib.request, urllib.error
                  req = urllib.request.Request(
                      "http://localhost:8123/api/config",
                      headers={"Authorization": "Bearer " + os.environ.get("HA_HEALTHCHECK_TOKEN", "")},
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=10) as r:
                          cfg = json.loads(r.read())
                  except urllib.error.HTTPError as e:
                      sys.exit(0 if e.code in (401, 403) else 1)
                  except Exception:
                      sys.exit(1)
                  if cfg.get("recovery_mode") or cfg.get("safe_mode"):
                      sys.exit(1)
                  if cfg.get("state") != "RUNNING":
                      sys.exit(1)
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import json, os, sys, urllib.request, urllib.error
                  req = urllib.request.Request(
                      "http://localhost:8123/api/config",
                      headers={"Authorization": "Bearer " + os.environ.get("HA_HEALTHCHECK_TOKEN", "")},
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=10) as r:
                          cfg = json.loads(r.read())
                  except urllib.error.HTTPError as e:
                      sys.exit(0 if e.code in (401, 403) else 1)
                  except Exception:
                      sys.exit(1)
                  if cfg.get("recovery_mode") or cfg.get("safe_mode"):
                      sys.exit(1)
                  if cfg.get("state") != "RUNNING":
                      sys.exit(1)
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          hostPath:
            path: /var/persist/homeassistant-config
            type: DirectoryOrCreate
        - name: managed-packages
          configMap:
            name: homeassistant-packages
        - name: managed-dashboards
          configMap:
            name: homeassistant-dashboards
