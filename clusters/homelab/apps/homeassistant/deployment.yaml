apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
  labels:
    app: homeassistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
      annotations:
        ad.datadoghq.com/homeassistant.logs: '[{"source":"homeassistant","service":"homeassistant"}]'
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      initContainers:
        # Ensures HA's configuration.yaml trusts the ingress-nginx proxy.
        # Without this HA's forwarded middleware rejects all requests with HTTP 400.
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              CONFIG=/config/configuration.yaml
              if [ ! -f "$CONFIG" ]; then
                cat > "$CONFIG" <<'EOF'
              # Loads default set of integrations. Do not remove.
              default_config:

              frontend:
                themes: !include_dir_merge_named themes

              automation: !include automations.yaml
              script: !include scripts.yaml
              scene: !include scenes.yaml

              http:
                use_x_forwarded_for: true
                trusted_proxies:
                  - 10.244.0.0/16
                  - 10.96.0.0/12
              EOF
                touch /config/automations.yaml /config/scripts.yaml /config/scenes.yaml
              elif ! grep -qE '^http:' "$CONFIG"; then
                cat >> "$CONFIG" <<'EOF'

              http:
                use_x_forwarded_for: true
                trusted_proxies:
                  - 10.244.0.0/16
                  - 10.96.0.0/12
              EOF
              fi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: homeassistant
          # renovate: datasource=docker
          image: ghcr.io/home-assistant/home-assistant:stable
          ports:
            - containerPort: 8123
              name: http
          env:
            - name: TZ
              value: "America/Los_Angeles"
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
      volumes:
        - name: config
          hostPath:
            path: /var/persist/homeassistant-config
            type: DirectoryOrCreate
