apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeassistant-daikin
  namespace: homeassistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: homeassistant-daikin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: email
      remoteRef:
        key: "Daikin Home"
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: "Daikin Home"
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
