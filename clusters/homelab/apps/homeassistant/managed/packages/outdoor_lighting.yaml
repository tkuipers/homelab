automation:
  - id: outdoor_lighting_backyard_post_sunset
    alias: "Outdoor Lighting: Back yard on 30 min after sunset"
    trigger:
      - platform: sun
        event: sunset
        offset: "+00:30:00"
    action:
      - service: light.turn_on
        target:
          entity_id: light.back_yard_floodlights
        data:
          brightness: 173
          color_temp_kelvin: 3095

  # Fallback in case Good Night isn't run: kill the back yard lights at 1:00 AM.
  - id: outdoor_lighting_backyard_off_1am
    alias: "Outdoor Lighting: Back yard off at 1:00 AM"
    trigger:
      - platform: time
        at: "01:00:00"
    action:
      - service: light.turn_off
        target:
          entity_id: light.back_yard_floodlights
