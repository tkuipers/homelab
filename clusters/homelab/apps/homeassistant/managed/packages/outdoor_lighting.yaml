automation:
  - id: outdoor_lighting_backyard_post_sunset
    alias: "Outdoor Lighting: Back yard on 30 min after sunset"
    trigger:
      - platform: sun
        event: sunset
        offset: "+00:30:00"
    action:
      - service: light.turn_on
        target:
          entity_id: light.back_yard_floodlights
        data:
          brightness: 173
          color_temp_kelvin: 3095

  # Fallback in case Good Night isn't run: kill the back yard lights at solar
  # midnight. Template trigger fires once when now() crosses sun.sun's
  # next_midnight attribute (which then advances to tomorrow, resetting the trigger).
  - id: outdoor_lighting_backyard_off_solar_midnight
    alias: "Outdoor Lighting: Back yard off at solar midnight"
    trigger:
      - platform: template
        value_template: >
          {{ state_attr('sun.sun', 'next_midnight') is not none and
             now() >= as_datetime(state_attr('sun.sun', 'next_midnight')) }}
    action:
      - service: light.turn_off
        target:
          entity_id: light.back_yard_floodlights
