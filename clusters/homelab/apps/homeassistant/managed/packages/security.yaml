# Notification group — add entries here as phones are registered in the HA app.
# Service names follow the pattern: mobile_app_<device_name_slugified>.
notify:
  - platform: group
    name: all_phones
    services:
      - service: mobile_app_iphone

# Presence group — add device_tracker entity IDs here as phones are registered.
# The group is 'home' if any member is home, 'not_home' only when all are away.
group:
  household_phones:
    name: Household Phones
    entities:
      - device_tracker.iphone
  # All window contact sensors — referenced by the rain alert below.
  windows:
    name: Windows
    entities:
      - binary_sensor.dining_room_window
      - binary_sensor.main_common_space_window
      - binary_sensor.upstairs_common_room_window
      - binary_sensor.main_bedroom_window
      - binary_sensor.main_bedroom_small_window
      - binary_sensor.ensuite_window
      - binary_sensor.vacuum_room_window
      - binary_sensor.spare_bedroom_window
  # Exterior person-doors that breach the conditioned envelope (the overhead
  # garage door has its own alert and the garage is unconditioned).
  doors:
    name: Doors
    entities:
      - binary_sensor.main_entrance_door
      - binary_sensor.back_door
      - binary_sensor.garage_entrance_door

# Virtual "is it raining" sensor from the Met.no forecast condition, so the
# automation can use one 5-minute duration regardless of which rainy sub-state
# the forecast reports (rainy / pouring / lightning-rainy / ...).
template:
  - binary_sensor:
      - name: "Is Raining"
        unique_id: is_raining
        device_class: moisture
        state: >
          {{ states('weather.forecast_home') in
             ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'] }}

automation:
  # Notify both phones when the garage door has been open for 5+ minutes and
  # nobody is home. The notification carries a "Close Door" action button that
  # triggers the garage cover close (via the Aqara relay toggle).
  - id: security_garage_open_alert
    alias: "Security: Garage open > 5 min with nobody home"
    trigger:
      - platform: state
        entity_id: binary_sensor.garage_door
        to: "on"
        for: "00:05:00"
    condition:
      - condition: state
        entity_id: group.household_phones
        state: "not_home"
    action:
      - service: notify.all_phones
        data:
          title: "Garage Door Open"
          message: "The garage door has been open for over 5 minutes and nobody is home."
          data:
            actions:
              - action: "CLOSE_GARAGE"
                title: "Close Door"
            push:
              interruption-level: time-sensitive

  - id: security_garage_close_action
    alias: "Security: Close garage from notification action"
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "CLOSE_GARAGE"
    condition:
      - condition: state
        entity_id: binary_sensor.garage_door
        state: "on"
    action:
      - service: cover.close_cover
        target:
          entity_id: cover.garage_door

  # Auto-lock: if either entrance lock is left unlocked for 5 continuous minutes
  # after 9:30 PM, lock it and send a notification.
  - id: security_autolock_garage_entrance
    alias: "Security: Auto-lock garage entrance after 5 min unlocked (after 9:30 PM)"
    trigger:
      - platform: state
        entity_id: lock.garage_entrance
        to: "unlocked"
        for: "00:05:00"
    condition:
      - condition: time
        after: "21:30:00"
    action:
      - service: lock.lock
        target:
          entity_id: lock.garage_entrance
      - service: notify.all_phones
        data:
          title: "Garage Entrance Locked"
          message: "Garage entrance was auto-locked (unlocked for 5+ min after 9:30 PM)."

  - id: security_autolock_main_entrance
    alias: "Security: Auto-lock main entrance after 5 min unlocked (after 9:30 PM)"
    trigger:
      - platform: state
        entity_id: lock.main_entrance
        to: "unlocked"
        for: "00:05:00"
    condition:
      - condition: time
        after: "21:30:00"
    action:
      - service: lock.lock
        target:
          entity_id: lock.main_entrance
      - service: notify.all_phones
        data:
          title: "Main Entrance Locked"
          message: "Main entrance was auto-locked (unlocked for 5+ min after 9:30 PM)."

  # Notify when it's been raining for 5+ minutes and one or more windows are
  # open, listing which ones so they can be closed. Fires when rain has
  # persisted 5 minutes, and when a window opens while it's already been raining.
  - id: weather_rain_open_windows_alert
    alias: "Weather: Open windows while raining"
    trigger:
      # Rain has now persisted for 5 continuous minutes.
      - platform: state
        entity_id: binary_sensor.is_raining
        to: "on"
        for: "00:05:00"
      # A window opens (condition below checks it's already been raining 5+ min).
      - platform: state
        entity_id:
          - binary_sensor.dining_room_window
          - binary_sensor.main_common_space_window
          - binary_sensor.upstairs_common_room_window
          - binary_sensor.main_bedroom_window
          - binary_sensor.main_bedroom_small_window
          - binary_sensor.ensuite_window
          - binary_sensor.vacuum_room_window
          - binary_sensor.spare_bedroom_window
        to: "on"
    condition:
      # Raining now, continuously for at least 5 minutes.
      - condition: state
        entity_id: binary_sensor.is_raining
        state: "on"
        for: "00:05:00"
      # At least one window open.
      - condition: template
        value_template: >
          {{ expand('group.windows') | selectattr('state', 'eq', 'on') | list | count > 0 }}
    action:
      - variables:
          open_windows: >
            {{ expand('group.windows') | selectattr('state', 'eq', 'on')
               | map(attribute='name') | list | join(', ') }}
      - service: notify.all_phones
        data:
          title: "Windows open while it's raining"
          message: >-
            It's been raining for over 5 minutes and these windows are open:
            {{ open_windows }}. You may want to close them.
          data:
            push:
              interruption-level: time-sensitive

  # Safety interlock: don't run HVAC against open openings. If a window has been
  # open 5+ min or an exterior door 10+ min while the thermostat is in an active
  # mode (heat/cool/heat_cool), switch it off and say to seal the house first.
  # Also fires if the thermostat is turned on while something is already open too
  # long, so HVAC can't be started against an unsealed house.
  - id: hvac_seal_house_interlock
    alias: "HVAC: Stop heating/cooling if house not sealed"
    trigger:
      - platform: state
        entity_id: group.windows
        to: "on"
        for: "00:05:00"
      - platform: state
        entity_id: group.doors
        to: "on"
        for: "00:10:00"
      - platform: state
        entity_id: climate.main_floor_thermostat
        to:
          - heat
          - cool
          - heat_cool
    condition:
      - condition: state
        entity_id: climate.main_floor_thermostat
        state:
          - heat
          - cool
          - heat_cool
      - condition: template
        value_template: >
          {{ (expand('group.windows') | selectattr('state', 'eq', 'on')
                | selectattr('last_changed', 'lt', now() - timedelta(minutes=5)) | list | count > 0)
             or (expand('group.doors') | selectattr('state', 'eq', 'on')
                | selectattr('last_changed', 'lt', now() - timedelta(minutes=10)) | list | count > 0) }}
    action:
      - variables:
          open_too_long: >
            {{ (expand('group.windows') | selectattr('state', 'eq', 'on')
                  | selectattr('last_changed', 'lt', now() - timedelta(minutes=5)) | map(attribute='name') | list)
               + (expand('group.doors') | selectattr('state', 'eq', 'on')
                  | selectattr('last_changed', 'lt', now() - timedelta(minutes=10)) | map(attribute='name') | list) }}
      - service: climate.turn_off
        target:
          entity_id: climate.main_floor_thermostat
      - service: notify.all_phones
        data:
          title: "HVAC stopped — seal the house"
          message: >-
            Heating/cooling was switched off because the house isn't sealed.
            Open: {{ open_too_long | join(', ') }}. Please close up before running HVAC again.
          data:
            push:
              interruption-level: time-sensitive
