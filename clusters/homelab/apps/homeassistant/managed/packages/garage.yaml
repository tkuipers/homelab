template:
  - binary_sensor:
      - name: "Garage Door"
        unique_id: "garage_door_contact_inverted"
        device_class: garage_door
        state: "{{ is_state('binary_sensor.aqara_door_and_window_sensor_door', 'off') }}"
        availability: "{{ states('binary_sensor.aqara_door_and_window_sensor_door') not in ['unavailable', 'unknown'] }}"
