script:
  garage_door_pulse:
    alias: "Garage Door Pulse"
    sequence:
      - action: light.turn_on
        target:
          entity_id: light.aqara_dual_relay_module_t2
      - delay: "00:00:01"
      - action: light.turn_off
        target:
          entity_id: light.aqara_dual_relay_module_t2

template:
  - binary_sensor:
      - name: "Garage Door"
        unique_id: "garage_door_contact_inverted"
        device_class: garage_door
        state: "{{ is_state('binary_sensor.aqara_door_and_window_sensor_door', 'off') }}"
        availability: "{{ states('binary_sensor.aqara_door_and_window_sensor_door') not in ['unavailable', 'unknown'] }}"

  - button:
      - name: "Garage Door Trigger"
        unique_id: "garage_door_trigger"
        icon: mdi:garage
        press:
          - action: script.turn_on
            target:
              entity_id: script.garage_door_pulse

cover:
  - platform: template
    covers:
      garage_door:
        friendly_name: "Garage Door"
        unique_id: "garage_door_cover"
        device_class: garage
        value_template: "{{ is_state('binary_sensor.garage_door', 'on') }}"
        open_cover:
          service: script.garage_door_pulse
        close_cover:
          service: script.garage_door_pulse
        stop_cover:
          service: script.garage_door_pulse
