script:
  good_night:
    alias: "Good Night"
    icon: mdi:weather-night
    mode: single
    sequence:
      - choose:
          - conditions: "{{ is_state('cover.garage_door', 'open') }}"
            sequence:
              - service: cover.close_cover
                target:
                  entity_id: cover.garage_door
      - service: lock.lock
        target:
          entity_id:
            - lock.aqara_smart_lock_u50
            - lock.aqara_smart_lock_u50_2
      - service: light.turn_off
        target:
          entity_id:
            - light.h3200
            - light.smart_wi_fi_switch
