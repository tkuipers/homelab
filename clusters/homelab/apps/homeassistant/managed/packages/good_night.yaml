script:
  good_night:
    alias: "Good Night"
    icon: mdi:weather-night
    mode: single
    sequence:
      - choose:
          - conditions: "{{ is_state('cover.garage_door', 'open') }}"
            sequence:
              - service: cover.close_cover
                target:
                  entity_id: cover.garage_door
      - service: lock.lock
        target:
          entity_id:
            - lock.garage_entrance
            - lock.main_entrance
      - service: light.turn_off
        target:
          entity_id:
            - light.back_yard_floodlights
            - light.main_bedroom
