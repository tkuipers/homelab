title: Home
views:
  - title: Overview
    path: overview
    icon: mdi:home
    type: sections
    sections:
      - title: Entrances
        cards:
          - type: tile
            entity: cover.garage_door
          - type: tile
            entity: lock.aqara_smart_lock_u50
            name: Garage Entrance
          - type: tile
            entity: lock.aqara_smart_lock_u50_2
            name: Main Entrance

      - title: Climate
        cards:
          - type: thermostat
            entity: climate.main_room_thermostat
            name: Main Floor
          - type: tile
            entity: sensor.main_room_thermostat_indoor_temperature
            name: Indoor Temperature
          - type: tile
            entity: sensor.main_room_thermostat_indoor_humidity
            name: Indoor Humidity
          - type: tile
            entity: sensor.main_room_thermostat_outdoor_temperature
            name: Outdoor Temperature
          - type: tile
            entity: sensor.main_room_thermostat_outdoor_humidity
            name: Outdoor Humidity
          - type: tile
            entity: sensor.main_room_thermostat_outdoor_air_quality
            name: Air Quality
          - type: tile
            entity: select.main_room_thermostat_fan_speed
            name: Fan Speed

      - title: Monitoring
        cards:
          - type: tile
            entity: binary_sensor.aqara_water_leak_sensor_water_leak
            name: Water Leak
          - type: tile
            entity: sensor.aqara_temp_humidity_sensor_t1_temperature
            name: Attic Temperature
          - type: tile
            entity: sensor.aqara_temp_humidity_sensor_t1_humidity
            name: Attic Humidity

  - title: Climate
    path: climate
    icon: mdi:thermometer
    type: sections
    sections:
      - title: Main Floor
        cards:
          - type: thermostat
            entity: climate.main_room_thermostat
          - type: tile
            entity: select.main_room_thermostat_fan_speed
            name: Fan Speed

      - title: Indoor
        cards:
          - type: history-graph
            title: Temperature
            hours_to_show: 24
            entities:
              - entity: sensor.main_room_thermostat_indoor_temperature
          - type: history-graph
            title: Humidity
            hours_to_show: 24
            entities:
              - entity: sensor.main_room_thermostat_indoor_humidity

      - title: Outside
        cards:
          - type: tile
            entity: sensor.main_room_thermostat_outdoor_temperature
            name: Temperature
          - type: tile
            entity: sensor.main_room_thermostat_outdoor_humidity
            name: Humidity
          - type: tile
            entity: sensor.main_room_thermostat_outdoor_air_quality
            name: Air Quality
          - type: tile
            entity: sensor.main_room_thermostat_outdoor_air_quality_index
            name: AQI
          - type: history-graph
            title: Outdoor Temperature
            hours_to_show: 24
            entities:
              - entity: sensor.main_room_thermostat_outdoor_temperature

      - title: Attic
        cards:
          - type: history-graph
            title: Temperature
            hours_to_show: 24
            entities:
              - entity: sensor.aqara_temp_humidity_sensor_t1_temperature
          - type: history-graph
            title: Humidity
            hours_to_show: 24
            entities:
              - entity: sensor.aqara_temp_humidity_sensor_t1_humidity
