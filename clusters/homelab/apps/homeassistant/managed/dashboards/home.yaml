title: Home
# Lovelace resources for this dashboard (e.g. dreame-vacuum-map-card.js) are
# registered via HA's storage-mode resources API by the reconciler — see
# managed/registry.yaml `lovelace_resources` and reconciler/reconcile.py.
# A `resources:` block here would be ignored under lovelace.mode: storage.
views:
  - title: Overview
    path: overview
    icon: mdi:home
    type: sections
    sections:
      - title: Sun
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - type: attribute
                entity: sun.sun
                attribute: next_rising
                name: Next Sunrise
                icon: mdi:weather-sunset-up
                format: time
              - type: attribute
                entity: sun.sun
                attribute: next_setting
                name: Next Sunset
                icon: mdi:weather-sunset-down
                format: time

      - title: Entrances
        cards:
          - type: tile
            entity: cover.garage_door
          - type: tile
            entity: lock.garage_entrance
            name: Garage Entrance
          - type: tile
            entity: lock.main_entrance
            name: Main Entrance

      - title: Quick Actions
        cards:
          - type: button
            name: Good Night
            icon: mdi:weather-night
            icon_height: 60px
            tap_action:
              action: call-service
              service: script.good_night

      - title: Climate
        cards:
          - type: thermostat
            entity: climate.main_floor_thermostat
            name: Main Floor
          - type: tile
            entity: sensor.main_floor_indoor_temperature
            name: Indoor Temperature
          - type: tile
            entity: sensor.main_floor_indoor_humidity
            name: Indoor Humidity
          - type: tile
            entity: sensor.outdoor_temperature
            name: Outdoor Temperature
          - type: tile
            entity: sensor.outdoor_humidity
            name: Outdoor Humidity
          - type: tile
            entity: sensor.outdoor_air_quality
            name: Air Quality
          - type: tile
            entity: select.main_floor_fan_speed
            name: Fan Speed

      # Sits between Climate and Monitoring per home-priority ordering.
      - title: Vacuum
        cards:
          - type: tile
            entity: sensor.dreame_vacuum_status
            name: Status
          - type: tile
            entity: sensor.dreame_vacuum_current_room
            name: Current Room
          - type: entities
            title: Pick rooms
            show_header_toggle: false
            entities:
              - entity: input_boolean.vacuum_pick_living_room
              - entity: input_boolean.vacuum_pick_kitchen
              - entity: input_boolean.vacuum_pick_dining_hall
              - entity: input_boolean.vacuum_pick_corridor
              - entity: input_boolean.vacuum_pick_entry
              - entity: input_boolean.vacuum_pick_laundry
              - entity: input_boolean.vacuum_pick_bathroom
          - type: button
            name: Clean Selected Rooms
            icon: mdi:robot-vacuum-variant
            tap_action:
              action: call-service
              service: script.vacuum_clean_selected_rooms
          - type: button
            name: Full Clean
            icon: mdi:robot-vacuum
            tap_action:
              action: call-service
              service: vacuum.start
              service_data:
                entity_id: vacuum.dreame_vacuum

      - title: Bedroom
        cards:
          - type: tile
            entity: light.main_bedroom
            name: Bedroom Light

      - title: Monitoring
        cards:
          - type: tile
            entity: binary_sensor.utilities_water_leak
            name: Water Leak
          - type: tile
            entity: sensor.attic_temperature
            name: Attic Temperature
          - type: tile
            entity: sensor.attic_humidity
            name: Attic Humidity

  - title: Vacuum
    path: vacuum
    icon: mdi:robot-vacuum
    type: sections
    sections:
      - title: Status
        cards:
          - type: tile
            entity: vacuum.dreame_vacuum
            name: Dreame Vacuum
            features:
              - type: vacuum-commands
                commands:
                  - start_pause
                  - stop
                  - return_home
                  - locate
          - type: tile
            entity: sensor.dreame_vacuum_status
            name: Status
          - type: tile
            entity: sensor.dreame_vacuum_state
            name: State
          - type: tile
            entity: sensor.dreame_vacuum_battery_level
            name: Battery
          - type: tile
            entity: sensor.dreame_vacuum_current_room
            name: Current Room
          - type: tile
            entity: sensor.dreame_vacuum_charging_status
            name: Charging
          - type: tile
            entity: sensor.dreame_vacuum_error
            name: Error
          - type: tile
            entity: sensor.dreame_vacuum_cleaning_progress
            name: Progress
          - type: tile
            entity: sensor.dreame_vacuum_cleaning_time
            name: Cleaning Time

      - title: Quick Actions
        cards:
          - type: button
            name: Full Clean
            icon: mdi:robot-vacuum
            icon_height: 60px
            tap_action:
              action: call-service
              service: vacuum.start
              service_data:
                entity_id: vacuum.dreame_vacuum
          - type: button
            name: Return to Dock
            icon: mdi:home-import-outline
            tap_action:
              action: call-service
              service: vacuum.return_to_base
              service_data:
                entity_id: vacuum.dreame_vacuum
          - type: button
            name: Pause / Stop
            icon: mdi:pause
            tap_action:
              action: call-service
              service: vacuum.stop
              service_data:
                entity_id: vacuum.dreame_vacuum
          - type: button
            name: Locate
            icon: mdi:map-marker
            tap_action:
              action: call-service
              service: vacuum.locate
              service_data:
                entity_id: vacuum.dreame_vacuum
          - type: button
            name: Open Map
            icon: mdi:map
            tap_action:
              action: navigate
              navigation_path: /home-yaml/vacuum-map

      # Multi-room selection without the map. Toggle one or more rooms, then tap
      # the big "Clean Selected Rooms" button to dispatch them all in one call.
      # Backed by input_booleans + script.vacuum_clean_selected_rooms (managed/packages/vacuum.yaml).
      - title: Pick Rooms & Clean
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_boolean.vacuum_pick_living_room
              - entity: input_boolean.vacuum_pick_kitchen
              - entity: input_boolean.vacuum_pick_dining_hall
              - entity: input_boolean.vacuum_pick_corridor
              - entity: input_boolean.vacuum_pick_entry
              - entity: input_boolean.vacuum_pick_laundry
              - entity: input_boolean.vacuum_pick_bathroom
          - type: button
            name: Clean Selected Rooms
            icon: mdi:robot-vacuum-variant
            icon_height: 60px
            tap_action:
              action: call-service
              service: script.vacuum_clean_selected_rooms

      # Per-room single-tap buttons. Each one immediately starts a clean of that
      # room only — no toggling, no confirmation. Handy for "just do this one."
      # Segment IDs: see vacuum.dreame_vacuum.attributes.rooms.
      - title: Clean One Room
        cards:
          - type: button
            name: Living Room
            icon: mdi:sofa-outline
            tap_action:
              action: call-service
              service: dreame_vacuum.vacuum_clean_segment
              service_data:
                entity_id: vacuum.dreame_vacuum
                segments: [7]
          - type: button
            name: Kitchen
            icon: mdi:chef-hat
            tap_action:
              action: call-service
              service: dreame_vacuum.vacuum_clean_segment
              service_data:
                entity_id: vacuum.dreame_vacuum
                segments: [6]
          - type: button
            name: Dining Hall
            icon: mdi:silverware-fork-knife
            tap_action:
              action: call-service
              service: dreame_vacuum.vacuum_clean_segment
              service_data:
                entity_id: vacuum.dreame_vacuum
                segments: [5]
          - type: button
            name: Corridor
            icon: mdi:foot-print
            tap_action:
              action: call-service
              service: dreame_vacuum.vacuum_clean_segment
              service_data:
                entity_id: vacuum.dreame_vacuum
                segments: [4]
          - type: button
            name: Entry
            icon: mdi:door
            tap_action:
              action: call-service
              service: dreame_vacuum.vacuum_clean_segment
              service_data:
                entity_id: vacuum.dreame_vacuum
                segments: [3]
          - type: button
            name: Laundry
            icon: mdi:washing-machine
            tap_action:
              action: call-service
              service: dreame_vacuum.vacuum_clean_segment
              service_data:
                entity_id: vacuum.dreame_vacuum
                segments: [2]
          - type: button
            name: Bathroom
            icon: mdi:toilet
            tap_action:
              action: call-service
              service: dreame_vacuum.vacuum_clean_segment
              service_data:
                entity_id: vacuum.dreame_vacuum
                segments: [1]

  - title: Climate
    path: climate
    icon: mdi:thermometer
    type: sections
    sections:
      - title: Main Floor
        cards:
          - type: thermostat
            entity: climate.main_floor_thermostat
          - type: tile
            entity: select.main_floor_fan_speed
            name: Fan Speed

      - title: Indoor
        cards:
          - type: history-graph
            title: Temperature
            hours_to_show: 24
            entities:
              - entity: sensor.main_floor_indoor_temperature
          - type: history-graph
            title: Humidity
            hours_to_show: 24
            entities:
              - entity: sensor.main_floor_indoor_humidity

      - title: Outside
        cards:
          - type: tile
            entity: sensor.outdoor_temperature
            name: Temperature
          - type: tile
            entity: sensor.outdoor_humidity
            name: Humidity
          - type: tile
            entity: sensor.outdoor_air_quality
            name: Air Quality
          - type: tile
            entity: sensor.outdoor_aqi
            name: AQI
          - type: history-graph
            title: Outdoor Temperature
            hours_to_show: 24
            entities:
              - entity: sensor.outdoor_temperature

      - title: Attic
        cards:
          - type: history-graph
            title: Temperature
            hours_to_show: 24
            entities:
              - entity: sensor.attic_temperature
          - type: history-graph
            title: Humidity
            hours_to_show: 24
            entities:
              - entity: sensor.attic_humidity

  # Hidden subview — accessed via the "Open Map" button in the Vacuum view
  # (or by URL: /home-yaml/vacuum-map). subview: true keeps it out of the tab
  # bar so the (admittedly ugly) map card isn't in your face every visit.
  - title: Vacuum Map
    path: vacuum-map
    icon: mdi:map
    subview: true
    type: sections
    sections:
      - title: ""
        cards:
          - type: custom:dreame-vacuum-map-card
            entity: vacuum.dreame_vacuum
            map_entity: camera.dreame_vacuum_map
            title: Dreame Vacuum
            default_mode: room
            theme: dark
            grid_options:
              columns: full
              rows: auto
