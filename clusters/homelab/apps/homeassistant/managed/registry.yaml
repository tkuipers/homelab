    level: -1
    icon: mdi:stairs-down
  - name: "Ground Floor"
    level: 0
    icon: mdi:home
  - name: "Upstairs"
    level: 1
    icon: mdi:stairs-up
  - name: "Attic"
    level: 2
    icon: mdi:home-roof

areas:
