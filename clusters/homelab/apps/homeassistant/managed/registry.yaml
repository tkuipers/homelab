# ── Device → entity registry mapping ───────────────────────────────────────
# Matter devices are matched by hardware SERIAL (or, when a device exposes no
# serial, by its Matter `identifier`). Each device's entities are matched by
# their Matter cluster "role" (the unique_id suffix), with `#N` ordinals to
# disambiguate same-role endpoints (e.g. the dual-relay's two channels). This
# is stable across re-pairing and cannot collide, unlike HA's auto-generated
# entity_ids — so there is intentionally NO rename-by-slug mechanism anymore.
#
# STRICT: the reconciler FAILS if any Matter device, or any entity on one, is
# not declared here — so a newly-paired sensor you forget to add blocks the
# sync until it's added. To add one: find its serial in HA Settings > Devices
# (or `device_registry/list`), then add a block mapping each role -> entity id.
#
# Entity value: { id: <entity_id>, name: <optional friendly name>, hidden: <bool> }
#
# Non-Matter devices can't collide, so they stay simple:
#   unique_id_entities: matched by stable unique_id (the Daikin renames live here)
#   static_areas:       area-only assignment for canonical ids (templates, Dreame)
matter_devices:
  # Aqara Water Leak Sensor [Aqara Water Leak Sensor]  (5 entities)
