    area: "Utilities Room"
    entities:
      "IdentifyButton-3-1": { id: button.utilities_water_leak_identify, hidden: true }
      "PowerSource-47-12": { id: sensor.utilities_water_leak_battery }
      "PowerSourceBatReplacementDescription-47-19": { id: sensor.utilities_water_leak_battery_type, hidden: true }
      "PowerSourceBatVoltage-47-11": { id: sensor.utilities_water_leak_battery_voltage, hidden: true }
