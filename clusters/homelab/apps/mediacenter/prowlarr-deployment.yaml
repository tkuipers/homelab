apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: mediacenter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      containers:
      - name: prowlarr
        image: linuxserver/prowlarr:latest
        ports:
        - containerPort: 9696
          name: http
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Los_Angeles"
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      # Exportarr sidecar for Prometheus metrics (indexer health/failures)
      - name: exportarr
        image: ghcr.io/onedr0p/exportarr:v2.0
        args:
          - prowlarr
        env:
        - name: PORT
          value: "9710"
        - name: URL
          value: "http://localhost:9696"
        - name: CONFIG
          value: "/config/config.xml"
        - name: PROWLARR__BACKFILL
          value: "true"
        ports:
        - containerPort: 9710
          name: metrics
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "300m"
      volumes:
      - name: config
        hostPath:
          path: /var/persist/prowlarr-config
          type: DirectoryOrCreate

