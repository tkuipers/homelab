apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: mediacenter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      containers:
      - name: qbittorrent
        image: linuxserver/qbittorrent:latest
        ports:
        - containerPort: 8080
          name: webui
        - containerPort: 6881
          name: tcp-listen
          protocol: TCP
        - containerPort: 6881
          name: udp-listen
          protocol: UDP
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Los_Angeles"
        - name: WEBUI_PORT
          value: "8080"
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                # Wait for qBittorrent to initialize
                sleep 30
                
                # Update qBittorrent config
                CONFIG_FILE="/config/qBittorrent/qBittorrent.conf"
                if [ -f "$CONFIG_FILE" ]; then
                  # Backup original
                  cp "$CONFIG_FILE" "$CONFIG_FILE.bak"
                  
                  # Set ratio limit to 0 (stop seeding immediately)
                  sed -i 's/MaxRatio=.*/MaxRatio=0/' "$CONFIG_FILE" || echo "MaxRatio=0" >> "$CONFIG_FILE"
                  sed -i 's/MaxRatioAction=.*/MaxRatioAction=0/' "$CONFIG_FILE" || echo "MaxRatioAction=0" >> "$CONFIG_FILE"
                  
                  # Set seeding time limit to 1 minute
                  sed -i 's/MaxSeedingMinutes=.*/MaxSeedingMinutes=1/' "$CONFIG_FILE" || echo "MaxSeedingMinutes=1" >> "$CONFIG_FILE"
                  
                  # Enable the limits
                  sed -i 's/GlobalMaxRatio=.*/GlobalMaxRatio=0/' "$CONFIG_FILE" || echo "GlobalMaxRatio=0" >> "$CONFIG_FILE"
                  
                  # Bypass auth for local subnet (pod network)
                  sed -i 's/WebUI\\AuthSubnetWhitelist=.*/WebUI\\AuthSubnetWhitelist=10.244.0.0\\/16/' "$CONFIG_FILE" || echo "WebUI\\AuthSubnetWhitelist=10.244.0.0/16" >> "$CONFIG_FILE"
                  sed -i 's/WebUI\\AuthSubnetWhitelistEnabled=.*/WebUI\\AuthSubnetWhitelistEnabled=true/' "$CONFIG_FILE" || echo "WebUI\\AuthSubnetWhitelistEnabled=true" >> "$CONFIG_FILE"
                  
                  echo "qBittorrent configured"
                else
                  echo "Config file not found yet, will use defaults"
                fi
          volumeMounts:
          - name: config
            mountPath: /config
          - name: media-root
            mountPath: /downloads
            subPath: downloads
          - name: media-root
            mountPath: /media
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
      initContainers:
      - name: create-downloads-dir
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          mkdir -p /media/downloads
          chmod 777 /media/downloads
        volumeMounts:
        - name: media-root
          mountPath: /media
      volumes:
      - name: config
        hostPath:
          path: /var/persist/qbittorrent-config
          type: DirectoryOrCreate
      - name: media-root
        persistentVolumeClaim:
          claimName: jellyfin-media

