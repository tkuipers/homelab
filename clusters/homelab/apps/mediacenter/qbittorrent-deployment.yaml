apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: mediacenter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      containers:
      - name: qbittorrent
        image: linuxserver/qbittorrent:latest
        ports:
        - containerPort: 8080
          name: webui
        - containerPort: 6881
          name: tcp-listen
          protocol: TCP
        - containerPort: 6881
          name: udp-listen
          protocol: UDP
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Los_Angeles"
        - name: WEBUI_PORT
          value: "8080"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /downloads
        - name: media
          mountPath: /media
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
      volumes:
      - name: config
        hostPath:
          path: /var/persist/qbittorrent-config
          type: DirectoryOrCreate
      - name: downloads
        persistentVolumeClaim:
          claimName: jellyfin-media
          subPath: downloads
      - name: media
        persistentVolumeClaim:
          claimName: jellyfin-media

