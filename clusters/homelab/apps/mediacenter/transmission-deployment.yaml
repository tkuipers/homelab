apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
  namespace: mediacenter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transmission
  template:
    metadata:
      labels:
        app: transmission
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      initContainers:
      - name: create-downloads-dir
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          mkdir -p /media/downloads/incomplete \
                   /media/downloads/complete/tv-sonarr \
                   /media/downloads/complete/radarr \
                   /media/tv \
                   /media/movies
          chmod -R 777 /media
        volumeMounts:
        - name: media-root
          mountPath: /media
      containers:
      # Gluetun VPN sidecar - provides network for Transmission
      - name: gluetun
        image: qmcgaw/gluetun:latest
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
        ports:
        - containerPort: 9091
          name: webui
          protocol: TCP
        env:
        - name: VPN_SERVICE_PROVIDER
          value: "custom"
        - name: VPN_TYPE
          value: "openvpn"
        - name: OPENVPN_CUSTOM_CONFIG
          value: "/gluetun/config/custom.conf"
        - name: FIREWALL_VPN_INPUT_PORTS
          valueFrom:
            secretKeyRef:
              name: airvpn-credentials
              key: forwarded_port
        - name: FIREWALL_INPUT_PORTS
          valueFrom:
            secretKeyRef:
              name: airvpn-credentials
              key: forwarded_port
        - name: LOG_LEVEL
          value: "info"
        - name: TZ
          value: "America/Los_Angeles"
        volumeMounts:
        - name: airvpn-config
          mountPath: /gluetun/config
          readOnly: true
        - name: gluetun-data
          mountPath: /gluetun
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      # Transmission - uses Gluetun's network
      - name: transmission
        image: linuxserver/transmission:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Los_Angeles"
        - name: USER
          valueFrom:
            secretKeyRef:
              name: transmission-credentials
              key: username
        - name: PASS
          valueFrom:
            secretKeyRef:
              name: transmission-credentials
              key: password
        - name: PEERPORT
          valueFrom:
            secretKeyRef:
              name: airvpn-credentials
              key: forwarded_port
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media-root
          mountPath: /downloads
          subPath: downloads
        - name: media-root
          mountPath: /media
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "2000m"
      volumes:
      - name: config
        hostPath:
          path: /var/persist/transmission-config
          type: DirectoryOrCreate
      - name: media-root
        persistentVolumeClaim:
          claimName: jellyfin-media
      - name: airvpn-config
        secret:
          secretName: airvpn-credentials
          defaultMode: 0400
      - name: gluetun-data
        emptyDir: {}

