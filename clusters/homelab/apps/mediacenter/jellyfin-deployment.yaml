apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: mediacenter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
      annotations:
        # Datadog logs for playback tracking
        ad.datadoghq.com/jellyfin.logs: '[{"source":"jellyfin","service":"jellyfin"}]'
        # Datadog Prometheus scraping for Jellyfin metrics (active streams, bandwidth)
        ad.datadoghq.com/jellyfin.checks: |
          {
            "openmetrics": {
              "instances": [
                {
                  "openmetrics_endpoint": "http://%%host%%:8096/metrics",
                  "namespace": "jellyfin",
                  "metrics": [".*"]
                }
              ]
            }
          }
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      # Enable Jellyfin metrics on startup
      initContainers:
      - name: enable-metrics
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          CONFIG_FILE="/config/config/system.xml"
          if [ -f "$CONFIG_FILE" ]; then
            sed -i 's/<EnableMetrics>false<\/EnableMetrics>/<EnableMetrics>true<\/EnableMetrics>/g' "$CONFIG_FILE"
            echo "Metrics enabled in $CONFIG_FILE"
          else
            echo "Config file not found, Jellyfin will create it on first start"
          fi
        volumeMounts:
        - name: config
          mountPath: /config
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:latest
        ports:
        - containerPort: 8096
          name: http
        - containerPort: 8920
          name: https
        - containerPort: 1900
          name: dlna
          protocol: UDP
        - containerPort: 7359
          name: discovery
          protocol: UDP
        env:
        - name: TZ
          value: "America/Los_Angeles"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: cache
          mountPath: /cache
        - name: media
          mountPath: /media
        - name: transcodes
          mountPath: /config/transcodes
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "6000m"
      volumes:
      - name: config
        hostPath:
          path: /var/persist/jellyfin-config
          type: DirectoryOrCreate
      - name: cache
        emptyDir: {}
      - name: media
        persistentVolumeClaim:
          claimName: jellyfin-media
      - name: transcodes
        emptyDir:
          sizeLimit: 50Gi

