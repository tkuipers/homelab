apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: mediacenter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      initContainers:
      - name: export-api-key
        image: busybox:1.38
        command:
        - sh
        - -c
        - |
          sed -n '/^auth:/,/^[^ ]/s/^  apikey: *//p' /config/config/config.yaml | head -1 | tr -d "'\"\r\n" > /keys/api-key
          chmod 0444 /keys/api-key
          [ -s /keys/api-key ] || echo "no API key found yet (first start?); exportarr will fail until the next restart"
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: exportarr-key
          mountPath: /keys
      containers:
      - name: bazarr
        image: linuxserver/bazarr:latest
        ports:
        - containerPort: 6767
          name: http
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Los_Angeles"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      # Exportarr sidecar for Prometheus metrics (API key copied from the app's config by
      # the export-api-key init container; exportarr only parses *arr config.xml itself)
      - name: exportarr
        image: ghcr.io/onedr0p/exportarr:v2.0
        args:
          - bazarr
        env:
        - name: PORT
          value: "9707"
        - name: URL
          value: "http://localhost:6767"
        - name: API_KEY_FILE
          value: /keys/api-key
        ports:
        - containerPort: 9707
          name: metrics
        volumeMounts:
        - name: exportarr-key
          mountPath: /keys
          readOnly: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "300m"
      volumes:
      - name: exportarr-key
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: config
        hostPath:
          path: /var/persist/bazarr-config
          type: DirectoryOrCreate
      - name: media
        persistentVolumeClaim:
          claimName: jellyfin-media

