apiVersion: v1
kind: ConfigMap
metadata:
  name: prowlarr-bootstrap
  namespace: mediacenter
data:
  bootstrap.sh: |
    #!/bin/sh
    set -e
    
    echo "Waiting for Prowlarr to start..."
    until curl -sf http://localhost:9696/ping > /dev/null 2>&1; do
      echo "  Prowlarr not ready, waiting..."
      sleep 5
    done
    
    echo "Prowlarr is up! Waiting for config.xml..."
    until [ -f /config/config.xml ]; do
      echo "  config.xml not found, waiting..."
      sleep 2
    done
    
    echo "Extracting API key..."
    API_KEY=$(grep "<ApiKey>" /config/config.xml | sed 's/.*<ApiKey>\(.*\)<\/ApiKey>.*/\1/')
    
    if [ -z "$API_KEY" ]; then
      echo "ERROR: Could not extract API key"
      exit 1
    fi
    
    echo "API Key found: ${API_KEY:0:8}..."
    
    # Check if already bootstrapped
    if [ -f /config/.bootstrapped ]; then
      echo "Already bootstrapped, skipping..."
      exit 0
    fi
    
    echo "Bootstrapping Prowlarr..."
    
    # Add indexer (example - customize per your indexer type)
    if [ -n "$INDEXER1_NAME" ] && [ -n "$INDEXER1_URL" ] && [ -n "$INDEXER1_APIKEY" ]; then
      echo "Adding indexer: $INDEXER1_NAME"
      curl -X POST "http://localhost:9696/api/v1/indexer" \
        -H "X-Api-Key: $API_KEY" \
        -H "Content-Type: application/json" \
        -d '{
          "name": "'"$INDEXER1_NAME"'",
          "implementation": "Newznab",
          "configContract": "NewznabSettings",
          "fields": [
            {"name": "baseUrl", "value": "'"$INDEXER1_URL"'"},
            {"name": "apiKey", "value": "'"$INDEXER1_APIKEY"'"},
            {"name": "categories", "value": [5000,5030,5040]}
          ],
          "enableRss": true,
          "enableAutomaticSearch": true,
          "enableInteractiveSearch": true,
          "protocol": "usenet",
          "priority": 25
        }' || echo "Failed to add indexer (may already exist)"
    fi
    
    # Link to Sonarr
    if [ -n "$SONARR_API_KEY" ]; then
      echo "Linking Sonarr..."
      curl -X POST "http://localhost:9696/api/v1/applications" \
        -H "X-Api-Key: $API_KEY" \
        -H "Content-Type: application/json" \
        -d '{
          "name": "Sonarr",
          "implementation": "Sonarr",
          "configContract": "SonarrSettings",
          "fields": [
            {"name": "prowlarrUrl", "value": "http://prowlarr:9696"},
            {"name": "baseUrl", "value": "http://sonarr:8989"},
            {"name": "apiKey", "value": "'"$SONARR_API_KEY"'"},
            {"name": "syncLevel", "value": 2}
          ],
          "syncLevel": "fullSync"
        }' || echo "Failed to link Sonarr (may already exist)"
    fi
    
    # Mark as bootstrapped
    touch /config/.bootstrapped
    echo "Bootstrap complete!"

