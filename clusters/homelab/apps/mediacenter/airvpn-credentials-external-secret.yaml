apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airvpn-credentials
  namespace: mediacenter
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: airvpn-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Decode base64-encoded certificate files from 1Password
        ca.crt: "{{ .ca_crt | b64dec }}"
        user.crt: "{{ .user_crt | b64dec }}"
        user.key: "{{ .user_key | b64dec }}"
        ta.key: "{{ .ta_key | b64dec }}"
        custom.conf: "{{ .custom_conf | b64dec }}"
        forwarded_port: "{{ .forwarded_port }}"
  dataFrom:
  - extract:
      key: "AirVPN"
      conversionStrategy: Default
      decodingStrategy: None
  data:
  - secretKey: ca_crt
    remoteRef:
      key: "AirVPN"
      property: ca.crt
  - secretKey: user_crt
    remoteRef:
      key: "AirVPN"
      property: user.crt
  - secretKey: user_key
    remoteRef:
      key: "AirVPN"
      property: user.key
  - secretKey: ta_key
    remoteRef:
      key: "AirVPN"
      property: ta.key
  - secretKey: custom_conf
    remoteRef:
      key: "AirVPN"
      property: custom.conf
  - secretKey: forwarded_port
    remoteRef:
      key: "AirVPN"
      property: forwarded_port

