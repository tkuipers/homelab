apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyseerr
  namespace: mediacenter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyseerr
  template:
    metadata:
      labels:
        app: jellyseerr
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      # Seerr (the merged Jellyseerr/Overseerr, v3) runs as node (UID 1000); the
      # Jellyseerr image ran as root, so the config dir needs chowning once. The first
      # start also keeps a copy of the Jellyseerr config (taken while nothing runs).
      initContainers:
      - name: config-owner
        image: busybox:1.38.0
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          [ -d /persist/jellyseerr-config.bak-pre-seerr ] || cp -a /persist/jellyseerr-config /persist/jellyseerr-config.bak-pre-seerr
          chown -R 1000:1000 /persist/jellyseerr-config
        volumeMounts:
        - name: persist
          mountPath: /persist
      containers:
      - name: jellyseerr
        # Jellyseerr was deprecated (last image 2.7.3, 2026-10); Seerr migrates its
        # config automatically on first start.
        image: ghcr.io/seerr-team/seerr:v3.5.2
        ports:
        - containerPort: 5055
          name: http
        env:
        - name: TZ
          value: "America/Los_Angeles"
        - name: LOG_LEVEL
          value: "info"
        volumeMounts:
        - name: config
          mountPath: /app/config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: config
        hostPath:
          path: /var/persist/jellyseerr-config
          type: DirectoryOrCreate
      - name: persist
        hostPath:
          path: /var/persist
          type: Directory
