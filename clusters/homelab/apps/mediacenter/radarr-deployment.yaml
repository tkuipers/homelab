apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: mediacenter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
      annotations:
        # Datadog Prometheus scraping
        ad.datadoghq.com/exportarr.checks: |
          {
            "openmetrics": {
              "instances": [
                {
                  "openmetrics_endpoint": "http://%%host%%:9708/metrics",
                  "namespace": "radarr",
                  "metrics": [".*"]
                }
              ]
            }
          }
        # Datadog logs
        ad.datadoghq.com/radarr.logs: '[{"source":"radarr","service":"radarr"}]'
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      containers:
      - name: radarr
        image: linuxserver/radarr:latest
        ports:
        - containerPort: 7878
          name: http
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Los_Angeles"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      # Exportarr sidecar for Prometheus metrics
      - name: exportarr
        image: ghcr.io/onedr0p/exportarr:v2.3
        args:
          - radarr
        env:
        - name: PORT
          value: "9708"
        - name: URL
          value: "http://localhost:7878"
        - name: CONFIG
          value: "/config/config.xml"
        ports:
        - containerPort: 9708
          name: metrics
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
      volumes:
      - name: config
        hostPath:
          path: /var/persist/radarr-config
          type: DirectoryOrCreate
      - name: media
        persistentVolumeClaim:
          claimName: jellyfin-media

