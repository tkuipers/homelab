apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: mediacenter
spec:
  selector:
    app: qbittorrent
  ports:
  - name: webui
    port: 8080
    targetPort: 8080
  - name: tcp-listen
    port: 6881
    targetPort: 6881
    protocol: TCP
  - name: udp-listen
    port: 6881
    targetPort: 6881
    protocol: UDP

