apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr-config
  namespace: mediacenter
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: prowlarr-config
    creationPolicy: Owner
  data:
  # Sonarr API key for app sync
  - secretKey: sonarr-api-key
    remoteRef:
      key: "Prowlarr Apps"
      property: sonarr_api_key
  # Example indexer configurations (add more as needed)
  - secretKey: indexer1-name
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer1_name
  - secretKey: indexer1-url
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer1_url
  - secretKey: indexer1-apikey
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer1_apikey

