apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr-config
  namespace: mediacenter
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: prowlarr-config
    creationPolicy: Owner
  data:
  # Indexer 1
  - secretKey: indexer1-name
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer1_name
  - secretKey: indexer1-url
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer1_url
  - secretKey: indexer1-apikey
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer1_apikey
  # Indexer 2
  - secretKey: indexer2-name
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer2_name
  - secretKey: indexer2-url
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer2_url
  - secretKey: indexer2-apikey
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer2_apikey
  # Indexer 3
  - secretKey: indexer3-name
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer3_name
  - secretKey: indexer3-url
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer3_url
  - secretKey: indexer3-apikey
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer3_apikey
  # Indexer 4
  - secretKey: indexer4-name
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer4_name
  - secretKey: indexer4-url
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer4_url
  - secretKey: indexer4-apikey
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer4_apikey
  # Indexer 5
  - secretKey: indexer5-name
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer5_name
  - secretKey: indexer5-url
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer5_url
  - secretKey: indexer5-apikey
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer5_apikey
  # Indexer 6
  - secretKey: indexer6-name
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer6_name
  - secretKey: indexer6-url
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer6_url
  - secretKey: indexer6-apikey
    remoteRef:
      key: "Prowlarr Indexers"
      property: indexer6_apikey

