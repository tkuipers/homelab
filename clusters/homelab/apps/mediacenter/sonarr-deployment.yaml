apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: mediacenter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
      annotations:
        # Datadog Prometheus scraping
        ad.datadoghq.com/exportarr.checks: |
          {
            "openmetrics": {
              "instances": [
                {
                  "openmetrics_endpoint": "http://%%host%%:9707/metrics",
                  "namespace": "sonarr",
                  "metrics": [".*"]
                }
              ]
            }
          }
        # Datadog logs
        ad.datadoghq.com/sonarr.logs: '[{"source":"sonarr","service":"sonarr"}]'
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-r620
      containers:
      - name: sonarr
        image: linuxserver/sonarr:latest
        ports:
        - containerPort: 8989
          name: http
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Los_Angeles"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      # Exportarr sidecar for Prometheus metrics
      - name: exportarr
        image: ghcr.io/onedr0p/exportarr:v2.0
        args:
          - sonarr
        env:
        - name: PORT
          value: "9707"
        - name: URL
          value: "http://localhost:8989"
        - name: CONFIG
          value: "/config/config.xml"
        ports:
        - containerPort: 9707
          name: metrics
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
      volumes:
      - name: config
        hostPath:
          path: /var/persist/sonarr-config
          type: DirectoryOrCreate
      - name: media
        persistentVolumeClaim:
          claimName: jellyfin-media

