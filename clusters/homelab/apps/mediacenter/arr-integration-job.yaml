apiVersion: v1
kind: ConfigMap
metadata:
  name: arr-integration-script
  namespace: mediacenter
data:
  setup.py: |
    #!/usr/bin/env python3
    import os
    import sys
    import time
    import json
    import hashlib
    import urllib.request
    import urllib.error
    import xml.etree.ElementTree as ET
    from typing import Optional, Dict, Any
    
    class ArrIntegration:
        def __init__(self):
            self.sonarr_url = "http://sonarr:8989"
            self.radarr_url = "http://radarr:7878"
            self.prowlarr_url = "http://prowlarr:9696"
            self.transmission_url = "http://transmission:9091"
            self.bazarr_url = "http://bazarr:6767"
            
            self.transmission_user = os.getenv("TRANSMISSION_USER")
            self.transmission_pass = os.getenv("TRANSMISSION_PASS")
            
            self.sonarr_api_key = None
            self.radarr_api_key = None
            self.prowlarr_api_key = None
            self.bazarr_api_key = None
            
        def log(self, message: str, level: str = "INFO"):
            symbols = {"INFO": "ℹ", "SUCCESS": "✓", "ERROR": "✗", "WARNING": "⚠"}
            print(f"{symbols.get(level, 'ℹ')} {message}")
            
        def wait_for_service(self, name: str, url: str, accept_401: bool = False):
            self.log(f"Waiting for {name}...")
            while True:
                try:
                    req = urllib.request.Request(url)
                    response = urllib.request.urlopen(req, timeout=2)
                    self.log(f"{name} is ready", "SUCCESS")
                    break
                except urllib.error.HTTPError as e:
                    # 401 means the service is up but requires auth (which is fine)
                    if e.code == 401 and accept_401:
                        self.log(f"{name} is ready", "SUCCESS")
                        break
                except:
                    pass
                time.sleep(2)
                
        def api_request(self, url: str, api_key: str, method: str = "GET", data: Optional[Dict] = None) -> tuple[int, Any]:
            headers = {"X-Api-Key": api_key, "Content-Type": "application/json"}
            request_data = json.dumps(data).encode() if data else None
            req = urllib.request.Request(url, data=request_data, headers=headers, method=method)
            
            try:
                response = urllib.request.urlopen(req)
                body = json.loads(response.read().decode())
                return response.status, body
            except urllib.error.HTTPError as e:
                try:
                    body = json.loads(e.read().decode())
                except:
                    body = {"error": e.reason}
                return e.code, body
                
        def extract_api_key(self, config_path: str, service_name: str) -> str:
            self.log(f"Extracting {service_name} API key...")
            try:
                if config_path.endswith('.xml'):
                    tree = ET.parse(config_path)
                    root = tree.getroot()
                    api_key = root.find(".//ApiKey").text
                    if api_key:
                        self.log(f"{service_name} API key extracted", "SUCCESS")
                        return api_key
                elif config_path.endswith('.yaml'):
                    # Parse YAML file for Bazarr
                    with open(config_path, 'r') as f:
                        for line in f:
                            if 'apikey:' in line:
                                api_key = line.split(':', 1)[1].strip()
                                if api_key:
                                    self.log(f"{service_name} API key extracted", "SUCCESS")
                                    return api_key
            except Exception as e:
                self.log(f"Failed to extract {service_name} API key: {e}", "ERROR")
                sys.exit(1)
                
        def setup_prowlarr_app(self, name: str, url: str, api_key: str, categories: list, implementation: str):
            self.log(f"Configuring {name} in Prowlarr...")
            
            # Check if already exists
            status, apps = self.api_request(f"{self.prowlarr_url}/api/v1/applications", self.prowlarr_api_key)
            if status == 200:
                for app in apps:
                    if app.get("name") == name:
                        self.log(f"{name} already configured in Prowlarr", "SUCCESS")
                        return
                        
            # Add new application
            payload = {
                "name": name,
                "syncLevel": "fullSync",
                "implementation": implementation,
                "configContract": f"{implementation}Settings",
                "fields": [
                    {"name": "prowlarrUrl", "value": self.prowlarr_url},
                    {"name": "baseUrl", "value": url},
                    {"name": "apiKey", "value": api_key},
                    {"name": "syncCategories", "value": categories}
                ],
                "tags": []
            }
            
            status, body = self.api_request(f"{self.prowlarr_url}/api/v1/applications", self.prowlarr_api_key, "POST", payload)
            if status in [200, 201]:
                self.log(f"{name} successfully linked to Prowlarr", "SUCCESS")
            else:
                error_msg = body.get("error", body)
                if "already exists" in str(error_msg).lower() or "unique" in str(error_msg).lower():
                    self.log(f"{name} already configured in Prowlarr", "SUCCESS")
                else:
                    self.log(f"Failed to link {name}: {error_msg}", "WARNING")
                    
        def add_indexer(self, name: str, url: str, api_key: str, app_profile_id: int):
            # Generate unique name
            hash_suffix = hashlib.md5(url.encode()).hexdigest()[:8]
            unique_name = f"{name}-{hash_suffix}"
            
            self.log(f"Adding indexer: {unique_name}")
            
            payload = {
                "name": unique_name,
                "implementation": "Newznab",
                "configContract": "NewznabSettings",
                "enable": True,
                "redirect": True,
                "appProfileId": app_profile_id,
                "fields": [
                    {"name": "baseUrl", "value": url},
                    {"name": "apiKey", "value": api_key or ""},
                    {"name": "categories", "value": [5000, 5030, 5040]}
                ],
                "enableRss": True,
                "enableAutomaticSearch": True,
                "enableInteractiveSearch": True,
                "protocol": "usenet",
                "priority": 25
            }
            
            status, body = self.api_request(f"{self.prowlarr_url}/api/v1/indexer", self.prowlarr_api_key, "POST", payload)
            if status in [200, 201]:
                self.log(f"Indexer {name} successfully added", "SUCCESS")
            else:
                error_msg = str(body)
                if "already exists" in error_msg.lower() or "unique" in error_msg.lower():
                    self.log(f"Indexer {name} already configured", "SUCCESS")
                elif "unable to connect" in error_msg.lower() or "404" in error_msg:
                    self.log(f"Indexer {name} not compatible (no API endpoint)", "WARNING")
                else:
                    self.log(f"Failed to add indexer {name}: {body}", "WARNING")
                    
        def add_torrent_indexer(self, name: str, definition_file: str, app_profile_id: int):
            """Add a torrent indexer using Prowlarr's built-in Cardigann definitions"""
            self.log(f"Adding torrent indexer: {name}")
            
            # Check if already exists
            status, indexers = self.api_request(f"{self.prowlarr_url}/api/v1/indexer", self.prowlarr_api_key)
            if status == 200:
                for indexer in indexers:
                    if indexer.get("name") == name or indexer.get("definitionName") == definition_file:
                        self.log(f"Torrent indexer {name} already configured", "SUCCESS")
                        return
            
            payload = {
                "name": name,
                "implementation": "Cardigann",
                "configContract": "CardigannSettings",
                "enable": True,
                "redirect": False,
                "appProfileId": app_profile_id,
                "protocol": "torrent",
                "priority": 25,
                "fields": [
                    {"name": "definitionFile", "value": definition_file}
                ]
            }
            
            status, body = self.api_request(f"{self.prowlarr_url}/api/v1/indexer", self.prowlarr_api_key, "POST", payload)
            if status in [200, 201]:
                self.log(f"Torrent indexer {name} successfully added", "SUCCESS")
            else:
                error_msg = str(body)
                if "already exists" in error_msg.lower() or "unique" in error_msg.lower():
                    self.log(f"Torrent indexer {name} already configured", "SUCCESS")
                elif "cloudflare" in error_msg.lower():
                    self.log(f"Torrent indexer {name} blocked by Cloudflare (needs FlareSolverr)", "WARNING")
                else:
                    self.log(f"Failed to add torrent indexer {name}", "WARNING")
                    
        def add_download_client(self, service_name: str, service_url: str, api_key: str, category: str):
            self.log(f"Adding Transmission to {service_name}...")
            
            payload = {
                "enable": True,
                "protocol": "torrent",
                "priority": 1,
                "removeCompletedDownloads": True,
                "removeFailedDownloads": True,
                "name": "Transmission",
                "fields": [
                    {"name": "host", "value": "transmission"},
                    {"name": "port", "value": 9091},
                    {"name": "urlBase", "value": "/transmission/"},
                    {"name": "username", "value": self.transmission_user},
                    {"name": "password", "value": self.transmission_pass},
                    {"name": "category", "value": category}
                ],
                "implementationName": "Transmission",
                "implementation": "Transmission",
                "configContract": "TransmissionSettings",
                "tags": []
            }
            
            status, body = self.api_request(f"{service_url}/api/v3/downloadclient", api_key, "POST", payload)
            if status in [200, 201]:
                self.log(f"Transmission added to {service_name}", "SUCCESS")
            else:
                error_msg = str(body)
                if "already exists" in error_msg.lower() or "unique" in error_msg.lower():
                    self.log(f"Transmission already configured in {service_name}", "SUCCESS")
                else:
                    self.log(f"Failed to add Transmission to {service_name}: {body}", "WARNING")
                    
        def add_path_mapping(self, service_name: str, service_url: str, api_key: str):
            self.log(f"Adding remote path mapping to {service_name}...")
            
            payload = {
                "host": "transmission",
                "remotePath": "/downloads/",
                "localPath": "/media/downloads/"
            }
            
            status, body = self.api_request(f"{service_url}/api/v3/remotepathmapping", api_key, "POST", payload)
            if status in [200, 201]:
                self.log(f"Remote path mapping added to {service_name}", "SUCCESS")
            else:
                self.log(f"Path mapping may already exist in {service_name} (this is fine)", "SUCCESS")
                
        def add_root_folder(self, service_name: str, service_url: str, api_key: str, path: str):
            self.log(f"Adding root folder {path} to {service_name}...")
            
            # Check if root folder already exists
            status, folders = self.api_request(f"{service_url}/api/v3/rootfolder", api_key)
            if status == 200:
                for folder in folders:
                    if folder.get("path") == path:
                        self.log(f"Root folder {path} already exists in {service_name}", "SUCCESS")
                        return
            
            payload = {"path": path}
            
            status, body = self.api_request(f"{service_url}/api/v3/rootfolder", api_key, "POST", payload)
            if status in [200, 201]:
                self.log(f"Root folder {path} added to {service_name}", "SUCCESS")
            else:
                error_msg = str(body)
                if "already" in error_msg.lower():
                    self.log(f"Root folder {path} already exists in {service_name}", "SUCCESS")
                else:
                    self.log(f"Failed to add root folder to {service_name}: {body}", "WARNING")
                    
        def setup_bazarr(self):
            self.log("Configuring Bazarr...")
            
            config_path = "/bazarr-config/config/config.yaml"
            
            # Read the current config
            try:
                with open(config_path, 'r') as f:
                    lines = f.readlines()
                
                # Parse and update config
                new_lines = []
                in_sonarr_section = False
                in_radarr_section = False
                in_general_section = False
                
                for line in lines:
                    # Update Sonarr section
                    if line.strip().startswith('sonarr:'):
                        in_sonarr_section = True
                        in_radarr_section = False
                        in_general_section = False
                        new_lines.append(line)
                    elif in_sonarr_section:
                        if line.strip().startswith('apikey:'):
                            new_lines.append(f"  apikey: {self.sonarr_api_key}\n")
                        elif line.strip().startswith('ip:'):
                            new_lines.append("  ip: sonarr\n")
                        elif line.strip().startswith('port:'):
                            new_lines.append("  port: 8989\n")
                        elif line.strip() and not line.startswith('  '):
                            in_sonarr_section = False
                            new_lines.append(line)
                        else:
                            new_lines.append(line)
                    # Update Radarr section
                    elif line.strip().startswith('radarr:'):
                        in_radarr_section = True
                        in_sonarr_section = False
                        in_general_section = False
                        new_lines.append(line)
                    elif in_radarr_section:
                        if line.strip().startswith('apikey:'):
                            new_lines.append(f"  apikey: {self.radarr_api_key}\n")
                        elif line.strip().startswith('ip:'):
                            new_lines.append("  ip: radarr\n")
                        elif line.strip().startswith('port:'):
                            new_lines.append("  port: 7878\n")
                        elif line.strip() and not line.startswith('  '):
                            in_radarr_section = False
                            new_lines.append(line)
                        else:
                            new_lines.append(line)
                    # Update general section for providers and enabling
                    elif line.strip().startswith('general:'):
                        in_general_section = True
                        in_sonarr_section = False
                        in_radarr_section = False
                        new_lines.append(line)
                    elif in_general_section:
                        if line.strip().startswith('enabled_providers:'):
                            new_lines.append("  enabled_providers:\n")
                            new_lines.append("  - opensubtitlescom\n")
                        elif line.strip().startswith('use_sonarr:'):
                            new_lines.append("  use_sonarr: true\n")
                        elif line.strip().startswith('use_radarr:'):
                            new_lines.append("  use_radarr: true\n")
                        elif line.strip() and not line.startswith('  '):
                            in_general_section = False
                            new_lines.append(line)
                        else:
                            new_lines.append(line)
                    else:
                        new_lines.append(line)
                
                # Write back the config
                with open(config_path, 'w') as f:
                    f.writelines(new_lines)
                
                self.log("Bazarr configured with Sonarr, Radarr, and OpenSubtitles.com", "SUCCESS")
                self.log("Note: Create language profiles manually in Bazarr UI (Settings > Languages)", "INFO")
                self.log("Restarting Bazarr pod to apply changes...", "INFO")
                
            except Exception as e:
                self.log(f"Failed to configure Bazarr: {e}", "ERROR")
                
        def run(self):
            print("=" * 60)
            print("   Arr Stack Integration Setup")
            print("=" * 60)
            print()
            
            # Wait for all services
            self.wait_for_service("Sonarr", f"{self.sonarr_url}/ping")
            self.wait_for_service("Radarr", f"{self.radarr_url}/ping")
            self.wait_for_service("Prowlarr", f"{self.prowlarr_url}/ping")
            self.wait_for_service("Transmission", self.transmission_url, accept_401=True)
            self.wait_for_service("Bazarr", f"{self.bazarr_url}/api/system/status", accept_401=True)
            print()
            
            # Extract API keys
            self.sonarr_api_key = self.extract_api_key("/sonarr-config/config.xml", "Sonarr")
            self.radarr_api_key = self.extract_api_key("/radarr-config/config.xml", "Radarr")
            self.prowlarr_api_key = self.extract_api_key("/prowlarr-config/config.xml", "Prowlarr")
            print()
            
            # Link apps to Prowlarr
            self.setup_prowlarr_app("Sonarr", self.sonarr_url, self.sonarr_api_key, [5000, 5030, 5040], "Sonarr")
            self.setup_prowlarr_app("Radarr", self.radarr_url, self.radarr_api_key, [2000, 2030, 2040, 2045, 2050], "Radarr")
            print()
            
            # Get app profile ID
            status, profiles = self.api_request(f"{self.prowlarr_url}/api/v1/appprofile", self.prowlarr_api_key)
            app_profile_id = profiles[0]["id"] if status == 200 and profiles else 1
            self.log(f"Using App Profile ID: {app_profile_id}")
            
            # Add public torrent indexers (using Cardigann definition files)
            self.add_torrent_indexer("EZTV", "eztv", app_profile_id)
            self.add_torrent_indexer("YTS", "yts", app_profile_id)
            self.add_torrent_indexer("TorrentGalaxy", "torrentgalaxy", app_profile_id)
            self.add_torrent_indexer("ThePirateBay", "thepiratebay", app_profile_id)
            print()
            
            # Configure Transmission
            self.add_download_client("Sonarr", self.sonarr_url, self.sonarr_api_key, "tv-sonarr")
            self.add_download_client("Radarr", self.radarr_url, self.radarr_api_key, "radarr")
            print()
            
            # Add path mappings
            self.add_path_mapping("Sonarr", self.sonarr_url, self.sonarr_api_key)
            self.add_path_mapping("Radarr", self.radarr_url, self.radarr_api_key)
            print()
            
            # Add root folders
            self.add_root_folder("Sonarr", self.sonarr_url, self.sonarr_api_key, "/media/tv")
            self.add_root_folder("Radarr", self.radarr_url, self.radarr_api_key, "/media/movies")
            print()
            
            # Trigger sync
            self.log("Triggering indexer sync...")
            self.api_request(f"{self.prowlarr_url}/api/v1/applications/sync", self.prowlarr_api_key, "POST")
            print()
            
            # Configure Bazarr
            self.setup_bazarr()
            
            print()
            print("=" * 60)
            print("   Setup Complete!")
            print("=" * 60)
            self.log("Sonarr linked to Prowlarr", "SUCCESS")
            self.log("Radarr linked to Prowlarr", "SUCCESS")
            self.log("Transmission configured in both", "SUCCESS")
            self.log("Remote path mappings configured", "SUCCESS")
            self.log("Bazarr linked to Sonarr and Radarr", "SUCCESS")
            self.log("Your media stack is fully integrated!", "SUCCESS")
            
    if __name__ == "__main__":
        integration = ArrIntegration()
        integration.run()
---
apiVersion: batch/v1
kind: Job
metadata:
  name: arr-integration-setup
  namespace: mediacenter
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: setup
        image: python:3.11-slim
        command:
        - python3
        - -u
        - /scripts/setup.py
        env:
        - name: TRANSMISSION_USER
          valueFrom:
            secretKeyRef:
              name: transmission-credentials
              key: username
        - name: TRANSMISSION_PASS
          valueFrom:
            secretKeyRef:
              name: transmission-credentials
              key: password
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: sonarr-config
          mountPath: /sonarr-config
          readOnly: true
        - name: radarr-config
          mountPath: /radarr-config
          readOnly: true
        - name: prowlarr-config
          mountPath: /prowlarr-config
          readOnly: true
        - name: bazarr-config
          mountPath: /bazarr-config
          readOnly: false
      volumes:
      - name: scripts
        configMap:
          name: arr-integration-script
          defaultMode: 0755
      - name: sonarr-config
        hostPath:
          path: /var/persist/sonarr-config
          type: Directory
      - name: radarr-config
        hostPath:
          path: /var/persist/radarr-config
          type: Directory
      - name: prowlarr-config
        hostPath:
          path: /var/persist/prowlarr-config
          type: Directory
      - name: bazarr-config
        hostPath:
          path: /var/persist/bazarr-config
          type: Directory
      nodeSelector:
        kubernetes.io/hostname: dell-r620
