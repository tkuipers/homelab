# cluster/core/flux-system/gotk-sync.yaml
#
# This file is also generated by the `flux bootstrap` command.
# It contains the GitRepository and Kustomization resources
# that point Flux to your repository to start the synchronization.
#
# You will replace the placeholder values below with the output
# from the bootstrap command.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: home-infra
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  url: ssh://git@github.com/tkuipers/homelab # This will be filled by `flux bootstrap`
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-infra 